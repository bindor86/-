<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>하늘 방어대</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #04050c; color: #f2f4ff;
  font-family: 'Gowun Dodum', 'Malgun Gothic', sans-serif; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #070b2a; }
#cv { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
#stage.aim #cv { cursor: none; }
.hidden { display: none !important; }
button { font-family: 'Jua', sans-serif; cursor: pointer; }

/* 위쪽 정보 막대 */
#hud { position: absolute; left: 0; top: 0; width: 1280px; height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px 0 20px; background: linear-gradient(rgba(5,6,22,0.88), rgba(5,6,22,0.4)); pointer-events: none; font-family: 'Jua', sans-serif; font-size: 27px; }
#hud .hl, #hud .hr { display: flex; align-items: center; gap: 14px; }
#hud .hl, #hud .hr { width: 470px; }
#hud .hr { justify-content: flex-end; }
#hud .hc { flex: 1; text-align: center; color: #ffe9a8; }
#hWave { color: #bcd0ff; }
.tag { font-size: 20px; padding: 3px 12px; border-radius: 12px; background: #ff7a4a; color: #fff; }
.tag.boss { background: #d8304a; }
.parts { color: #9fe8b8; }
.hbtn { pointer-events: auto; font-size: 22px; height: 42px; padding: 0 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.25); background: rgba(40,50,90,0.85); color: #fff; }
.hbtn:hover { background: rgba(70,90,150,0.95); }
.hbtn.icon { width: 46px; padding: 0; font-size: 20px; }
.hbtn.mega b { color: #ffd34a; }
.hbtn.mega.on { background: #f0a020; border-color: #ffe9a0; color: #3a2400; }
.hbtn.mega.on b { color: #3a2400; }
.hbtn:disabled { opacity: 0.4; cursor: default; }
#megaHint { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); font-family: 'Jua'; font-size: 26px; color: #3a2400;
  background: #ffcf4a; padding: 6px 20px; border-radius: 14px; pointer-events: none; }

/* 화면 */
#scr { position: absolute; inset: 0; }
#scr:empty { display: none; }
.full { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.panel { background: rgba(13,15,40,0.93); border: 2px solid rgba(150,175,255,0.35); border-radius: 22px; box-shadow: 0 14px 44px rgba(0,0,0,0.55); }
.btn { font-size: 28px; padding: 12px 30px; border-radius: 16px; border: none; color: #fff; background: linear-gradient(#5f90ff, #3a5fd8);
  box-shadow: 0 5px 0 #22348a; transition: transform 0.06s; }
.btn:hover { filter: brightness(1.13); transform: translateY(-2px); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #22348a; }
.btn.gold { background: linear-gradient(#ffd45a, #f0a020); color: #3a2400; box-shadow: 0 5px 0 #a86a10; }
.btn.green { background: linear-gradient(#5ad88a, #2fae64); box-shadow: 0 5px 0 #1f6e40; }
.btn.gray { background: linear-gradient(#6a6f8a, #4a4f68); box-shadow: 0 5px 0 #2e3246; }
.btn.red { background: linear-gradient(#ff6a7a, #d83a4a); box-shadow: 0 5px 0 #8a1f2a; }
.btn.small { font-size: 23px; padding: 9px 20px; }
.btn:disabled { opacity: 0.4; cursor: default; filter: none; transform: none; }
h1, h2, h3 { font-family: 'Jua', sans-serif; font-weight: normal; }

/* 타이틀 */
.title h1 { font-size: 112px; color: #fff; letter-spacing: 6px; text-shadow: 0 6px 0 #2a3a8a, 0 0 40px rgba(120,170,255,0.7); }
.title .sub { font-family: 'Jua'; font-size: 30px; color: #ffe9a8; margin: 6px 0 36px; text-shadow: 0 2px 6px #000; }
.title .menu { display: flex; flex-direction: column; gap: 16px; width: 560px; align-items: center; }
.title .menu > .btn { width: 440px; }
.title .row { display: flex; gap: 12px; width: 560px; }
.title .row .btn { flex: 1; padding: 9px 8px; white-space: nowrap; }
.title .foot { position: absolute; bottom: 18px; font-size: 21px; color: #c9d4ff; text-shadow: 0 2px 4px #000; }
.title .save { font-size: 20px; color: #bfe0ff; margin-top: -6px; text-align: center; }

/* 지도 */
.map { padding: 26px 40px; }
.map h2 { font-size: 48px; margin-bottom: 4px; text-align: center; }
.map .info { text-align: center; font-size: 23px; color: #c9d4ff; margin-bottom: 18px; }
.cities { display: grid; grid-template-columns: repeat(3, 330px); gap: 20px; }
.city { position: relative; height: 190px; border-radius: 20px; border: 3px solid rgba(255,255,255,0.18); color: #fff; text-align: left; padding: 16px 20px;
  font-family: 'Jua'; overflow: hidden; }
.city:hover:not(:disabled) { border-color: #ffe9a0; transform: translateY(-3px); }
.city .no { font-size: 20px; opacity: 0.85; }
.city .nm { font-size: 36px; margin: 2px 0 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
.city .st { font-size: 34px; color: #ffd34a; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
.city .st i { color: rgba(255,255,255,0.28); font-style: normal; }
.city .ne { font-size: 19px; opacity: 0.92; margin-top: 4px; }
.city.lock { filter: grayscale(0.85) brightness(0.55); }
.city .lk { position: absolute; right: 16px; top: 14px; font-size: 22px; }
.city .now { position: absolute; right: 14px; top: 14px; font-size: 19px; background: #ffcf4a; color: #3a2400; padding: 3px 10px; border-radius: 10px; }
.map .bar { display: flex; justify-content: center; gap: 16px; margin-top: 22px; }

/* 도시 소개 */
.intro { width: 940px; padding: 22px 40px 24px; text-align: center; }
.intro .no { font-family: 'Jua'; font-size: 24px; color: #bcd0ff; }
.intro h2 { font-size: 58px; margin: 0 0 4px; }
.intro .desc { font-size: 26px; line-height: 1.45; color: #e8ecff; margin-bottom: 14px; }
.intro .newE { display: flex; align-items: center; gap: 18px; text-align: left; background: rgba(255,255,255,0.06); border-radius: 16px; padding: 10px 18px; margin: 0 auto 12px; width: 840px; }
.intro .newE canvas { width: 80px; height: 80px; flex: none; }
.intro .newE .t1 { font-family: 'Jua'; font-size: 28px; color: #ffcf7a; }
.intro .newE .t2 { font-size: 23px; color: #e2e8ff; margin-top: 2px; }
.intro .bossP { font-family: 'Jua'; font-size: 23px; color: #ff9aa8; margin-bottom: 14px; }
.intro .how { text-align: left; font-size: 22px; line-height: 1.5; background: rgba(90,140,255,0.12); border-radius: 14px; padding: 10px 20px; margin: 0 auto 12px; width: 840px; }
.intro .how b { color: #ffe9a8; font-weight: normal; font-family: 'Jua'; }
.btnrow { display: flex; justify-content: center; gap: 16px; }

/* 정산·상점 */
.prep { position: absolute; inset: 0; display: grid; grid-template-columns: 400px 1fr; grid-template-rows: 1fr auto; gap: 16px; padding: 20px 24px 18px; }
.res { padding: 20px 24px; display: flex; flex-direction: column; }
.res h3 { font-size: 34px; margin-bottom: 10px; color: #9fe8b8; }
.res h3.ready { color: #bcd0ff; }
.res .line { display: flex; justify-content: space-between; font-size: 23px; padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.12); }
.res .line b { font-family: 'Jua'; font-weight: normal; color: #9fe8b8; }
.res .sum { display: flex; justify-content: space-between; font-family: 'Jua'; font-size: 30px; margin-top: 10px; color: #ffe9a8; }
.res .note { font-size: 21px; color: #9fe8ff; margin-top: 10px; line-height: 1.4; }
.res .next { margin-top: auto; padding-top: 12px; font-family: 'Jua'; font-size: 25px; color: #ffcf7a; line-height: 1.35; }
.res .next span { display: block; font-family: 'Gowun Dodum'; font-size: 20px; color: #e2e8ff; }
.shop { padding: 18px 22px; display: flex; flex-direction: column; }
.shopHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.shopHead h3 { font-size: 34px; }
.shopHead .parts { font-family: 'Jua'; font-size: 32px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.card { position: relative; height: 196px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.16); background: rgba(40,48,95,0.85); color: #fff;
  display: flex; flex-direction: column; align-items: center; padding: 10px 8px 8px; }
.card:hover:not(:disabled) { border-color: #9fe8b8; background: rgba(55,70,130,0.95); }
.card:disabled { opacity: 0.5; cursor: default; }
.card.max { opacity: 0.75; }
.card svg { width: 46px; height: 46px; }
.card .cn { font-size: 24px; margin-top: 4px; }
.card .pips { font-size: 15px; letter-spacing: 3px; color: #9fe8b8; margin-top: 2px; }
.card .pips i { color: rgba(255,255,255,0.22); font-style: normal; }
.card .cv { font-family: 'Gowun Dodum'; font-size: 20px; color: #e2e8ff; margin-top: 3px; }
.card .cc { margin-top: auto; font-size: 24px; color: #9fe8b8; }
.card .cc.no { color: #ff9a9a; }
.bottom { grid-column: 1 / 3; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
.blds { display: flex; gap: 6px; align-items: flex-end; }
.blds svg { width: 40px; height: 40px; }
.blds .lbl { font-family: 'Jua'; font-size: 24px; margin-right: 8px; }

/* 실패·클리어·엔딩 */
.mid { width: 760px; padding: 32px 40px; text-align: center; }
.mid h2 { font-size: 62px; margin-bottom: 8px; }
.mid .msg { font-size: 26px; line-height: 1.5; color: #e2e8ff; margin-bottom: 18px; }
.mid .assist { font-size: 23px; color: #9fe8ff; background: rgba(90,200,255,0.12); border-radius: 14px; padding: 10px 16px; margin-bottom: 20px; }
.bigstars { font-size: 92px; color: #ffd34a; letter-spacing: 8px; text-shadow: 0 4px 0 #a86a10; margin: -4px 0 6px; }
.bigstars i { color: rgba(255,255,255,0.2); text-shadow: none; font-style: normal; }
.bigstars span { display: inline-block; animation: pop 0.5s both; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; text-align: left; font-size: 24px; margin: 6px auto 20px; width: 560px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.12); padding: 3px 0; }
.stats b { font-family: 'Jua'; font-weight: normal; color: #ffe9a8; }
.rank { font-family: 'Jua'; font-size: 40px; color: #ffcf7a; margin-bottom: 8px; }

/* 모달 */
#modal { position: absolute; inset: 0; background: rgba(4,4,14,0.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
#modal .box { min-width: 560px; max-width: 900px; padding: 28px 36px; text-align: center; }
#modal h2 { font-size: 44px; margin-bottom: 16px; }
#modal .col { display: flex; flex-direction: column; gap: 14px; align-items: center; }
#modal .col .btn { width: 380px; }
.opt { display: flex; align-items: center; gap: 10px; margin: 10px auto; width: 600px; }
.opt .on2 { font-family: 'Jua'; font-size: 25px; width: 150px; text-align: left; }
.opt.c { justify-content: center; }
.help { text-align: left; font-size: 22px; line-height: 1.45; margin-bottom: 10px; }
.help p { margin: 3px 0; }
.help b { font-family: 'Jua'; font-weight: normal; color: #ffe9a8; }
.hlist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; text-align: left; margin-bottom: 16px; }
.hrow { display: flex; align-items: center; gap: 10px; font-size: 19px; line-height: 1.3; }
.hrow canvas { width: 56px; height: 56px; flex: none; }
.hrow b { display: block; font-family: 'Jua'; font-weight: normal; font-size: 22px; color: #ffcf7a; }
.seg { font-size: 22px; padding: 8px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); background: rgba(40,48,95,0.85); color: #fff; }
.seg.on { background: #3a5fd8; border-color: #bcd0ff; }
.recs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 30px; font-size: 24px; text-align: left; margin-bottom: 20px; }
.recs div { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.15); padding: 4px 0; }
.recs b { font-family: 'Jua'; font-weight: normal; color: #ffe9a8; }
.mtext { font-size: 25px; line-height: 1.5; margin-bottom: 20px; color: #e2e8ff; }
</style></head><body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden">
    <div class="hl"><span id="hCity"></span><span id="hWave"></span><span id="hTheme" class="tag hidden"></span></div>
    <div class="hc"><span id="hScore"></span></div>
    <div class="hr">
      <span id="hParts" class="parts"></span>
      <button id="bMega" class="hbtn mega">메가 폭탄 <b id="hMega">0</b></button>
      <button id="bPause" class="hbtn icon" title="일시 정지">❚❚</button>
      <button id="bFull" class="hbtn icon" title="전체 화면">⛶</button>
    </div>
  </div>
  <div id="megaHint" class="hidden">메가 폭탄 조준 중! 터뜨릴 곳을 클릭해</div>
  <div id="scr"></div>
  <div id="modal" class="hidden"><div class="box panel" id="mbox"></div></div>
</div>
<script>
// ===== 하늘 방어대 — 데이터 =====
const VW = 1280, VH = 720, GROUND = 640, TOPBAR = 60;
const BLD_X = [232, 332, 432, 532, 748, 848, 948, 1048];
const BLD_W = 66;
const BAT_POS = [{ x: 640, y: 600 }, { x: 108, y: 600 }, { x: 1172, y: 600 }];

// 적 종류
const ENEMY = {
  meteor: { name: '운석',     speed: 56, r: 10, hp: 1, pts: 25,  chain: 1.0,  tip: '천천히 떨어지는 돌덩이야. 앞쪽을 살짝 노리면 돼.' },
  bomb:   { name: '외계 폭탄', speed: 96, r: 8,  hp: 1, pts: 50,  chain: 1.1,  tip: '운석보다 훨씬 빨라. 떨어질 자리를 미리 노려!' },
  split:  { name: '분열 운석', speed: 56, r: 13, hp: 1, pts: 60,  chain: 1.25, tip: '하늘 중간에서 셋으로 갈라져. 갈라지기 전에 터뜨려!' },
  drone:  { name: '외계 드론', speed: 64, r: 10, hp: 1, pts: 80,  chain: 0.95, tip: '좌우로 흔들리며 내려와. 흔들림 한가운데를 노려 봐.' },
  armor:  { name: '철갑 폭탄', speed: 46, r: 14, hp: 2, pts: 120, chain: 1.35, tip: '두 번 맞혀야 터져. 대신 터질 때 크게 터져!' },
};

// 웨이브 구성 (1~10)
const WAVE_THEME = [null, 'normal', 'normal', 'normal', 'shower', 'normal', 'normal', 'rush', 'normal', 'storm', 'boss'];
const THEME_INFO = {
  normal: { label: '',       tip: '' },
  shower: { label: '유성우',  tip: '운석이 떼로 몰려와! 한 방에 여러 개를 노려 봐.' },
  rush:   { label: '기습',    tip: '적들이 빠르게 내려와. 조금 앞을 노려!' },
  storm:  { label: '총공세',  tip: '온갖 적이 한꺼번에 몰려와. 요격탄도 넉넉히 줄게!' },
  boss:   { label: '모선 출현', tip: '모선을 맞혀서 격추해! 모선 근처에서 터진 연쇄 폭발도 모선에 맞아.' },
};

// 도시 6곳
const CITIES = [
  { id: 'village', name: '별빛 마을',    style: 'village', newEnemy: 'meteor',
    desc: '언덕 위 작은 마을이야. 밤하늘에서 첫 운석들이 떨어지기 시작했어.',
    pool: { meteor: 1 }, song: 'c1',
    boss: { name: '정찰 모선 「흑점」',    hp: 10, w: 200, h: 60, speed: 70, drops: ['meteor'], every: 3.1, n: [1, 1], charge: 0, shield: 0 } },
  { id: 'harbor',  name: '노을 항구',    style: 'harbor', newEnemy: 'bomb',
    desc: '노을 지는 바닷가 항구 도시야. 빠른 외계 폭탄이 섞여서 내려와.',
    pool: { meteor: 3, bomb: 1.3 }, song: 'c2',
    boss: { name: '폭격 모선 「붉은 갈퀴」', hp: 14, w: 214, h: 62, speed: 80, drops: ['bomb', 'meteor'], every: 2.9, n: [1, 2], charge: 0, shield: 0 } },
  { id: 'oasis',   name: '모래 오아시스', style: 'oasis', newEnemy: 'split',
    desc: '사막 한가운데 오아시스 마을이야. 갈라지는 운석을 조심해.',
    pool: { meteor: 3, bomb: 1.4, split: 1.2 }, song: 'c3',
    boss: { name: '사막 모선 「모래 전갈」', hp: 18, w: 228, h: 64, speed: 85, drops: ['split', 'meteor', 'bomb'], every: 2.8, n: [1, 2], charge: 0, shield: 0 } },
  { id: 'snow',    name: '눈꽃 산성',    style: 'snow', newEnemy: 'drone',
    desc: '눈 덮인 산 위의 성이야. 흔들리며 내려오는 드론이 나타나.',
    pool: { meteor: 3, bomb: 1.5, split: 1, drone: 1.3 }, song: 'c4',
    boss: { name: '얼음 모선 「서리 눈」',  hp: 20, w: 244, h: 68, speed: 88, drops: ['drone', 'meteor', 'bomb'], every: 2.9, n: [1, 2], charge: 15, shield: 0 } },
  { id: 'crystal', name: '수정 도시',    style: 'crystal', newEnemy: 'armor',
    desc: '빛나는 수정 탑의 도시야. 두 번 맞혀야 하는 철갑 폭탄이 와.',
    pool: { meteor: 2.6, bomb: 1.5, split: 1, drone: 1.1, armor: 1.1 }, song: 'c5',
    boss: { name: '수정 모선 「프리즘」',   hp: 24, w: 258, h: 70, speed: 92, drops: ['armor', 'bomb', 'drone', 'meteor'], every: 2.9, n: [1, 2], charge: 14, shield: 11 } },
  { id: 'capital', name: '별빛 왕도',    style: 'capital', newEnemy: null,
    desc: '왕국의 수도이자 마지막 도시야. 모든 적과 거대 모선이 몰려와!',
    pool: { meteor: 2.6, bomb: 1.6, split: 1.1, drone: 1.2, armor: 1.1 }, song: 'c6',
    boss: { name: '거대 모선 「검은 별」',  hp: 30, w: 320, h: 84, speed: 78, drops: ['meteor', 'bomb', 'split', 'drone', 'armor'], every: 2.9, n: [1, 2], charge: 12, shield: 10 } },
];

// 포대 강화
const UPGRADES = [
  { id: 'radius',  name: '폭발 범위', costs: [160, 340, 580, 900, 1350],
    val: lv => 54 + lv * 9,       fmt: v => v + '',          unit: '',   desc: '요격탄 폭발이 커져.' },
  { id: 'speed',   name: '요격탄 속도', costs: [140, 290, 520, 800, 1150],
    val: lv => 640 + lv * 110,    fmt: v => v + '',          unit: '',   desc: '요격탄이 더 빨리 날아가.' },
  { id: 'ammo',    name: '탄약 보급', costs: [160, 340, 580, 900, 1350],
    val: lv => lv * 2,            fmt: v => '+' + v,         unit: '발', desc: '웨이브마다 요격탄이 늘어나.' },
  { id: 'chain',   name: '연쇄 폭발', costs: [340, 700, 1150],
    val: lv => 0.62 + lv * 0.12,  fmt: v => Math.round(v * 100) + '%', unit: '', desc: '적이 터질 때 생기는 폭발이 커져.' },
  { id: 'battery', name: '포대 증설', costs: [560, 1000],
    val: lv => 1 + lv,            fmt: v => v + '',          unit: '기', desc: '끝 쪽에 포대가 생겨서 빨리 닿아. 요격탄도 1발 더.' },
  { id: 'shield',  name: '방어막',   costs: [450, 900, 1500],
    val: lv => lv,                fmt: v => v + '',          unit: '회', desc: '웨이브마다 건물 피해를 막아 줘.' },
];
const UPG = Object.fromEntries(UPGRADES.map(u => [u.id, u]));
// 도시별 건물 높이 (8칸)
const BLD_H = {
  village: [50, 62, 46, 84, 56, 68, 44, 60],
  harbor:  [58, 44, 70, 52, 48, 64, 104, 56],
  oasis:   [48, 60, 86, 52, 56, 50, 62, 46],
  snow:    [70, 56, 92, 60, 62, 88, 54, 72],
  crystal: [78, 96, 64, 108, 100, 70, 92, 80],
  capital: [72, 86, 66, 100, 102, 68, 88, 74],
};
const MEGA_MAX = 3, MEGA_COST = 200, MEGA_R = 175;
const repairCost = c => 100 + c * 20;

const RANKS = [
  { min: 18, name: '전설의 하늘 방어대장' },
  { min: 15, name: '하늘 방어대장' },
  { min: 11, name: '베테랑 포수' },
  { min: 0,  name: '새내기 포수' },
];
// ===== 하늘 방어대 — 게임 규칙 (화면 없이도 돌아가) =====
const Engine = (() => {
  function rngOf(seed) {
    let a = seed >>> 0;
    return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  function newRun(diff) {
    return {
      v: 1, diff: diff ? 1 : 0, city: 0, wave: 1, attempt: 0, stage: 'intro',
      bld: [1, 1, 1, 1, 1, 1, 1, 1],
      up: { radius: 0, speed: 0, ammo: 0, chain: 0, battery: 0, shield: 0 },
      parts: 0, score: 0, megas: 1,
      stars: [0, 0, 0, 0, 0, 0], unlocked: 0, cleared: false,
      cityRun: { score: 0, lost: 0, kills: 0, chain: 0, fails: 0 },
      stats: { kills: 0, fired: 0, bestChain: 0, fails: 0, bosses: 0, time: 0, waves: 0 },
      seed: (Math.random() * 1e9) | 0,
    };
  }

  // ----- 웨이브 계획 -----
  function plan(run) {
    const c = run.city, w = run.wave, theme = WAVE_THEME[w], hard = run.diff;
    const boss = theme === 'boss';
    let count = 10 + (w - 1) * 1.3 + c * 2.2;
    if (theme === 'shower') count *= 1.4;
    if (theme === 'rush') count *= 0.8;
    if (theme === 'storm') count *= 1.3;
    if (boss) count *= 0.35;
    if (hard) count *= 1.3;
    count = Math.round(count);
    let spd = 1 + (w - 1) * 0.04 + c * 0.08;
    if (theme === 'rush') spd *= 1.15;
    if (hard) spd *= 1.28;
    let dur = 16 + w * 0.8 + c * 0.6;
    if (theme === 'shower') dur *= 0.9;
    if (theme === 'rush') dur *= 0.8;
    if (boss) dur = 34 + c * 4;
    return { theme, boss, count, spd, dur };
  }

  function poolFor(run, theme) {
    const city = CITIES[run.city], w = run.wave;
    const pool = Object.assign({}, city.pool);
    const ne = city.newEnemy;
    if (ne && ne !== 'meteor') pool[ne] *= Math.min(1.25, 0.45 + 0.11 * w);
    if (theme === 'shower') { pool.meteor *= 2.6; if (pool.split) pool.split *= 1.4; }
    if (theme === 'rush') { if (pool.bomb) pool.bomb *= 2.4; if (pool.drone) pool.drone *= 1.5; }
    return pool;
  }
  function pickType(pool, rng) {
    let sum = 0; for (const k in pool) sum += pool[k];
    let r = rng() * sum;
    for (const k in pool) { r -= pool[k]; if (r <= 0) return k; }
    return 'meteor';
  }

  function buildQueue(run, P, rng) {
    const q = [], pool = poolFor(run, P.theme);
    const shower = P.theme === 'shower', storm = P.theme === 'storm';
    const avg = shower ? 4 : storm ? 3 : 2.3;
    let left = P.count, t = 2.4;
    const gap = P.dur / Math.max(1, Math.round(P.count / avg));
    let vol = 0;
    while (left > 0) {
      let size;
      if (shower) size = 3 + Math.floor(rng() * 3);
      else if (storm) size = 2 + Math.floor(rng() * 3);
      else size = 1 + Math.floor(rng() * 3) + (rng() < 0.22 ? 1 : 0);
      if (vol === 0) size = Math.min(size, 2);
      size = Math.min(size, left);
      const cx = 90 + rng() * 1100, spread = shower ? 80 : 150;
      const grp = shower ? vol + 1 : 0;
      for (let i = 0; i < size; i++)
        q.push({ t: t + i * (shower ? 0.16 : 0.32) + rng() * 0.25, type: pickType(pool, rng), x: clamp(cx + (rng() - 0.5) * spread, 30, 1250), grp });
      left -= size; vol++;
      t += gap * (size / avg) * (0.7 + rng() * 0.6);
    }
    q.sort((a, b) => a.t - b.t);
    return q;
  }

  // ----- 웨이브 시작 -----
  function startWave(run) {
    const P = plan(run);
    const rng = rngOf(run.seed + run.city * 1013 + run.wave * 97 + run.attempt * 7919);
    const style = CITIES[run.city].style;
    const nb = UPG.battery.val(run.up.battery);
    const W = {
      P, rng, t: 0, city: run.city, wave: run.wave, theme: P.theme, diff: run.diff, spd: P.spd * (1 - Math.min(4, run.attempt) * 0.06), assist: Math.min(4, run.attempt),
      R: UPG.radius.val(run.up.radius), shotSpeed: UPG.speed.val(run.up.speed), chainF: UPG.chain.val(run.up.chain),
      bld: BLD_X.map((x, i) => ({ i, x, w: BLD_W, h: BLD_H[style][i], alive: !!run.bld[i], targeted: 0, hitT: 0 })),
      bats: BAT_POS.slice(0, nb).map(p => ({ x: p.x, y: p.y, cd: 0, q: [], fireT: 0 })),
      shields: UPG.shield.val(run.up.shield) + Math.min(2, run.attempt), shieldMax: UPG.shield.val(run.up.shield) + Math.min(2, run.attempt),
      queue: buildQueue(run, P, rng), qi: 0, grpTarget: {},
      enemies: [], shots: [], blasts: [], groups: {}, ev: [],
      ammo: 0, ammoStart: 0, megas: run.megas, megaUsed: 0, megaArmed: false,
      kills: 0, chainBest: 0, fired: 0, lost: 0, score: 0, nid: 1,
      boss: null, resupT: 0, over: false, result: null, failT: -1, winT: -1,
    };
    const ratio = (P.theme === 'shower' ? 0.6 : 0.72) - run.city * 0.025 - run.diff * 0.06;
    const att = Math.min(4, run.attempt);
    let ammo = Math.ceil(P.count * ratio) + 2 + UPG.ammo.val(run.up.ammo) + (nb - 1) + att * 4;
    if (P.theme === 'storm') ammo += 3;
    if (P.boss) {
      const d = CITIES[run.city].boss;
      const hp = Math.round(d.hp * (run.diff ? 1.25 : 1) * (1 - att * 0.12));
      ammo += Math.ceil(hp * 0.9) + 2;
      W.boss = {
        def: d, x: 640, y: -140, baseY: 150, w: d.w, h: d.h, hp, maxHp: hp, dir: rng() < 0.5 ? -1 : 1,
        enter: 0, t: 0, dropT: 4, shieldT: 0, shieldCd: d.shield ? d.shield * 0.6 : 0,
        charge: 0, chargeCd: d.charge ? d.charge * 0.65 : 0, chargeHits: 0, chargeBi: -1,
        stun: 0, flash: 0, enraged: false, dead: false, deathT: 0, fxT: 0,
      };
      W.ev.push({ k: 'bossEnter' });
    }
    W.ammo = W.ammoStart = ammo;
    return W;
  }

  // ----- 목표 고르기 -----
  function pickTarget(W, grp) {
    const alive = W.bld.filter(b => b.alive);
    if (grp && W.grpTarget[grp] != null) {
      const b = W.bld[W.grpTarget[grp]];
      const near = alive.filter(o => Math.abs(o.i - b.i) <= 1);
      if (near.length) { const o = near[(W.rng() * near.length) | 0]; o.targeted++; return { x: o.x + (W.rng() - 0.5) * o.w * 0.5, y: GROUND - o.h + 6, bi: o.i }; }
    }
    if (alive.length && W.rng() < 0.8) {
      let best = null, bv = 1e9;
      for (const b of alive) { const v = b.targeted + W.rng() * 1.6; if (v < bv) { bv = v; best = b; } }
      best.targeted++;
      if (grp) W.grpTarget[grp] = best.i;
      return { x: best.x + (W.rng() - 0.5) * best.w * 0.5, y: GROUND - best.h + 6, bi: best.i };
    }
    return { x: 50 + W.rng() * 1180, y: GROUND + 4, bi: -1 };
  }

  function spawnEnemy(W, type, x, y, grp, speedMul) {
    const d = ENEMY[type], tg = pickTarget(W, grp);
    const e = {
      id: W.nid++, type, x, y, sx: x, sy: y, tx: tg.x, ty: tg.y, bi: tg.bi, p: 0,
      len: Math.max(1, Math.hypot(tg.x - x, tg.y - y)),
      speed: d.speed * W.spd * (0.92 + W.rng() * 0.16) * (speedMul || 1),
      r: d.r, hp: d.hp, maxHp: d.hp, age: 0, ph: W.rng() * 6.283, trail: [], tt: 0, dead: false, hitT: 0,
    };
    if (type === 'split') e.splitY = 230 + W.rng() * 110;
    if (type === 'drone') { e.amp = 50 + W.rng() * 35; e.freq = 0.45 + W.rng() * 0.25; }
    W.enemies.push(e);
    return e;
  }

  // 적 위치 (예측에도 씀)
  function enemyPos(e, p, age) {
    let x = e.sx + (e.tx - e.sx) * p, y = e.sy + (e.ty - e.sy) * p;
    if (e.type === 'drone') {
      const env = Math.min(1, p * 7, (1 - p) * 2.6);
      x += Math.sin(e.ph + age * e.freq * 6.283) * e.amp * Math.max(0, env);
      x = clamp(x, 16, VW - 16);
    }
    return [x, y];
  }
  function predict(e, dt) {
    const p = Math.min(1, e.p + e.speed * dt / e.len);
    return enemyPos(e, p, e.age + dt);
  }

  // ----- 발사 -----
  function fire(W, x, y) {
    if (W.over || W.failT >= 0) return false;
    x = clamp(x, 8, VW - 8); y = clamp(y, 14, GROUND - 34);
    const mega = W.megaArmed && W.megas > 0;
    W.megaArmed = false;
    if (!mega && W.ammo <= 0) { W.ev.push({ k: 'empty' }); return false; }
    let best = null, bt = 1e9;
    for (const b of W.bats) {
      const t = Math.max(0, b.cd) + b.q.length * 0.2 + Math.hypot(x - b.x, y - b.y) / W.shotSpeed;
      if (t < bt) { bt = t; best = b; }
    }
    if (best.q.length >= 3) return false;
    if (mega) { W.megas--; W.megaUsed++; } else W.ammo--;
    W.fired++;
    best.q.push({ x, y, mega });
    return true;
  }
  function launch(W, b, s) {
    b.cd = 0.2; b.fireT = 0.25;
    W.shots.push({ id: W.nid++, bx: b.x, by: b.y, x: b.x, y: b.y, tx: s.x, ty: s.y, speed: W.shotSpeed * (s.mega ? 0.85 : 1), mega: s.mega });
    W.ev.push({ k: 'fire', x: b.x, y: b.y, tx: s.x, ty: s.y, mega: s.mega });
  }

  // ----- 폭발 -----
  function addBlast(W, x, y, R, depth, root, kind) {
    const T = kind === 'mega' ? [0.34, 0.65, 0.45] : kind === 'shot' ? [0.22, 0.38, 0.32] : kind === 'fx' ? [0.2, 0.25, 0.35] : [0.18, 0.3, 0.28];
    const b = { id: W.nid++, x, y, R, t: 0, g: T[0], h: T[1], f: T[2], depth, root, kind, hit: new Set(), hitBoss: kind === 'fx' };
    W.blasts.push(b);
    W.ev.push({ k: 'boom', x, y, R, depth, kind });
    return b;
  }
  function blastR(b) {
    if (b.t < b.g) { const u = b.t / b.g; return b.R * (1 - (1 - u) * (1 - u)); }
    if (b.t < b.g + b.h) return b.R;
    return b.R * Math.max(0, 1 - (b.t - b.g - b.h) / b.f);
  }

  function kill(W, e, b) {
    e.dead = true;
    if (e.bi >= 0) W.bld[e.bi].targeted--;
    const d = ENEMY[e.type];
    if (!b) { W.score += d.pts; W.kills++; W.ev.push({ k: 'kill', x: e.x, y: e.y, type: e.type, n: 1, pts: d.pts, quiet: true }); return; }
    const g = W.groups[b.root] || (W.groups[b.root] = { n: 0 });
    g.n++;
    const pts = Math.round(d.pts * Math.min(g.n, 8) * (W.diff ? 1.5 : 1));
    W.score += pts; W.kills++;
    if (g.n > W.chainBest) W.chainBest = g.n;
    W.ev.push({ k: 'kill', x: e.x, y: e.y, type: e.type, n: g.n, pts });
    addBlast(W, e.x, e.y, W.R * W.chainF * d.chain, b.depth + 1, b.root, 'chain');
  }

  function damage(W, e, b) {
    e.hp -= b.kind === 'mega' ? 3 : 1;
    if (e.hp <= 0) kill(W, e, b);
    else { e.hitT = 0.5; W.ev.push({ k: 'armor', x: e.x, y: e.y }); }
  }

  function impact(W, e) {
    e.dead = true;
    if (e.bi >= 0) {
      const b = W.bld[e.bi];
      b.targeted--;
      if (b.alive) {
        if (W.shields > 0) { W.shields--; W.ev.push({ k: 'impact', x: e.x, y: e.y, bi: b.i, shield: true }); return; }
        b.alive = false; b.hitT = 1; W.lost++;
        W.ev.push({ k: 'impact', x: e.x, y: e.y, bi: b.i, hit: true });
        return;
      }
    }
    W.ev.push({ k: 'impact', x: e.x, y: e.y, bi: -1 });
  }

  function split(W, e) {
    e.dead = true;
    if (e.bi >= 0) W.bld[e.bi].targeted--;
    W.ev.push({ k: 'split', x: e.x, y: e.y });
    for (let i = 0; i < 3; i++) {
      const c = spawnEnemy(W, 'meteor', e.x, e.y, 0, 1.08);
      c.speed = Math.max(c.speed, e.speed * 1.05);
    }
  }

  function hitsBoss(B, x, y, r) {
    const ax = B.w / 2 + r * 0.75, ay = B.h / 2 + r * 0.75;
    const dx = (x - B.x) / ax, dy = (y - B.y) / ay;
    return dx * dx + dy * dy < 1;
  }

  // ----- 모선 -----
  function stepBoss(W, dt) {
    const B = W.boss, d = B.def;
    B.t += dt; if (B.flash > 0) B.flash -= dt;
    if (B.dead) {
      B.deathT += dt; B.fxT -= dt;
      if (B.fxT <= 0 && B.deathT < 2.2) {
        B.fxT = 0.16;
        addBlast(W, B.x + (W.rng() - 0.5) * B.w * 0.9, B.y + (W.rng() - 0.5) * B.h, 40 + W.rng() * 50, 0, 0, 'fx');
      }
      return;
    }
    if (B.enter < 1) {
      B.enter = Math.min(1, B.enter + dt / 2.6);
      const u = 1 - Math.pow(1 - B.enter, 3);
      B.y = -140 + (B.baseY + 140) * u;
      return;
    }
    const sp = B.def.speed * (B.enraged ? 1.3 : 1) * (B.charge > 0 ? 0.25 : 1) * (W.diff ? 1.1 : 1);
    B.x += B.dir * sp * dt;
    const m = B.w / 2 + 30;
    if (B.x > VW - m) { B.x = VW - m; B.dir = -1; }
    if (B.x < m) { B.x = m; B.dir = 1; }
    B.y = B.baseY + Math.sin(B.t * 1.2) * 9;
    if (B.stun > 0) { B.stun -= dt; return; }
    // 방어막
    if (d.shield) {
      if (B.shieldT > 0) B.shieldT -= dt;
      else if (B.charge <= 0) { B.shieldCd -= dt; if (B.shieldCd <= 0) { B.shieldT = 2.6; B.shieldCd = d.shield * (B.enraged ? 0.8 : 1); W.ev.push({ k: 'bossShield' }); } }
    }
    // 광선 충전
    if (d.charge) {
      if (B.charge > 0) {
        B.charge -= dt;
        if (B.chargeHits >= 2) {
          B.charge = 0; B.stun = 1.8; B.chargeCd = d.charge;
          W.score += 300; W.ev.push({ k: 'chargeCancel', x: B.x, y: B.y });
        } else if (B.charge <= 0) {
          B.chargeCd = d.charge * (B.enraged ? 0.85 : 1);
          const b = W.bld[B.chargeBi];
          if (b && b.alive) {
            if (W.shields > 0) { W.shields--; W.ev.push({ k: 'beam', bi: b.i, shield: true }); }
            else { b.alive = false; b.hitT = 1; W.lost++; W.ev.push({ k: 'beam', bi: b.i, hit: true }); }
          } else W.ev.push({ k: 'beam', bi: B.chargeBi });
        }
      } else if (B.shieldT <= 0) {
        B.chargeCd -= dt;
        if (B.chargeCd <= 0) {
          const alive = W.bld.filter(b => b.alive);
          if (alive.length) {
            alive.sort((a, b) => Math.abs(a.x - B.x) - Math.abs(b.x - B.x));
            const pick = alive[Math.min(alive.length - 1, (W.rng() * 2) | 0)];
            B.charge = 3.8; B.chargeHits = 0; B.chargeBi = pick.i;
            W.ev.push({ k: 'charge', bi: pick.i });
          } else B.chargeCd = 3;
        }
      }
    }
    // 폭탄 떨구기
    if (B.charge <= 0) {
      B.dropT -= dt;
      if (B.dropT <= 0) {
        B.dropT = d.every * (B.enraged ? 0.72 : 1) * (W.diff ? 0.88 : 1);
        const n = d.n[0] + Math.floor(W.rng() * (d.n[1] - d.n[0] + 1)) + (B.enraged && W.rng() < 0.4 ? 1 : 0);
        for (let i = 0; i < n; i++) {
          const type = d.drops[(W.rng() * d.drops.length) | 0];
          spawnEnemy(W, type, B.x + (W.rng() - 0.5) * B.w * 0.55, B.y + B.h * 0.35, 0);
        }
        W.ev.push({ k: 'bossDrop', x: B.x, y: B.y + B.h * 0.4, n });
      }
    }
  }

  function bossHit(W, B, b) {
    b.hitBoss = true;
    if (B.dead || B.enter < 1) return;
    if (B.shieldT > 0) { W.ev.push({ k: 'bossBlock', x: b.x, y: b.y }); return; }
    const dmg = b.kind === 'mega' ? 3 : 1;
    B.hp -= dmg; B.flash = 0.18;
    if (B.charge > 0) B.chargeHits += dmg;
    W.score += 50 * dmg;
    W.ev.push({ k: 'bossHit', x: b.x, y: b.y, dmg });
    if (!B.enraged && B.hp <= B.maxHp / 2 && B.hp > 0) { B.enraged = true; W.ev.push({ k: 'enrage' }); }
    if (B.hp <= 0) {
      B.hp = 0; B.dead = true; B.charge = 0; B.shieldT = 0;
      W.score += 1500 + W.city * 500;
      W.ev.push({ k: 'bossDie', x: B.x, y: B.y });
      for (const e of W.enemies) if (!e.dead) { kill(W, e, null); addBlast(W, e.x, e.y, 34, 1, 0, 'fx'); }
    }
  }

  // ----- 한 걸음 -----
  function step(W, dt) {
    if (W.over) return;
    W.t += dt;
    const B = W.boss;
    // 등장
    const spawning = W.failT < 0 && !(B && B.dead);
    while (spawning && W.qi < W.queue.length && W.queue[W.qi].t <= W.t) {
      const q = W.queue[W.qi++];
      spawnEnemy(W, q.type, q.x, -18, q.grp);
    }
    // 포대
    for (const b of W.bats) {
      if (b.cd > 0) b.cd -= dt;
      if (b.fireT > 0) b.fireT -= dt;
      if (b.cd <= 0 && b.q.length) launch(W, b, b.q.shift());
    }
    // 요격탄
    for (const s of W.shots) {
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy), mv = s.speed * dt;
      if (d <= mv) { s.done = true; addBlast(W, s.tx, s.ty, s.mega ? MEGA_R : W.R, 0, s.id, s.mega ? 'mega' : 'shot'); }
      else { s.x += dx / d * mv; s.y += dy / d * mv; }
    }
    // 적
    for (const e of W.enemies) {
      if (e.dead) continue;
      e.age += dt; if (e.hitT > 0) e.hitT -= dt;
      e.p += e.speed * dt / e.len;
      if (e.p >= 1) { e.p = 1; const pp = enemyPos(e, 1, e.age); e.x = pp[0]; e.y = pp[1]; impact(W, e); continue; }
      const pp = enemyPos(e, e.p, e.age); e.x = pp[0]; e.y = pp[1];
      e.tt += dt; if (e.tt > 0.045) { e.tt = 0; e.trail.push(e.x, e.y); if (e.trail.length > 32) e.trail.splice(0, 2); }
      if (e.type === 'split' && e.y >= e.splitY) split(W, e);
    }
    // 폭발
    for (const b of W.blasts) {
      b.t += dt;
      if (b.kind === 'fx') continue;
      const r = blastR(b);

  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 */ } }
  function load(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  const meta = Object.assign({ best: 0, clears: 0, hardClears: 0, time: 0, kills: 0, bestChain: 0, sfx: 0.85, bgm: 0.6, shake: true, lines: true, seenHow: false }, load(META) || {});
  function saveMeta() { store(META, meta); }
  function saveRun() { if (run) store(SAVE, run); }
  function validRun(r) {
    return r && r.v === 1 && r.up && Array.isArray(r.bld) && r.bld.length === 8 && Array.isArray(r.stars) && r.city >= 0 && r.city < 6 && r.wave >= 1 && r.wave <= 10;
  }
  function loadRun() {
    const r = load(SAVE);
    if (!validRun(r)) return null;
    const base = Engine.newRun(r.diff);
    for (const k in base) if (r[k] === undefined) r[k] = base[k];
    for (const k in base.up) if (typeof r.up[k] !== 'number') r.up[k] = 0;
    for (const k in base.stats) if (typeof r.stats[k] !== 'number') r.stats[k] = 0;
    return r;
  }

  // ----- 화면 맞추기 -----
  function fit() {
    const st = $('stage'), s = Math.min(innerWidth / 1280, innerHeight / 720);
    st.style.transform = `scale(${s})`;
    st.style.left = (innerWidth - 1280 * s) / 2 + 'px';
    st.style.top = (innerHeight - 720 * s) / 2 + 'px';
    Render.resize(s);
  }
  function toggleFull() {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    } catch (e) { /* 지원 안 함 */ }
  }

  // ----- 입력 -----
  function toStage(cx, cy) {
    const r = $('cv').getBoundingClientRect();
    return [(cx - r.left) / r.width * VW, (cy - r.top) / r.height * VH];
  }
  window.addEventListener('mousemove', e => {
    mouse.cx = e.clientX; mouse.cy = e.clientY;
    const p = toStage(e.clientX, e.clientY); mouse.x = p[0]; mouse.y = p[1];
    mouse.inCv = e.target === $('cv');
  });
  $('cv').addEventListener('mouseleave', () => { mouse.inCv = false; });
  $('cv').addEventListener('click', e => {
    Sound.init();
    if (mode !== 'play' || paused || !W) return;
    const p = toStage(e.clientX, e.clientY);
    const wasMega = W.megaArmed;
    Engine.fire(W, p[0], p[1]);
    if (wasMega) updateHud(true);
  });
  // 스페이스바 = 좌클릭
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.key !== ' ') return;
    e.preventDefault();
    if (e.repeat) return;
    const x = mouse.cx >= 0 ? mouse.cx : innerWidth / 2, y = mouse.cy >= 0 ? mouse.cy : innerHeight / 2;
    const el = document.elementFromPoint(x, y);
    if (el) el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.key === ' ') e.preventDefault(); });
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button');
    if (b) { Sound.init(); setTimeout(() => b.blur(), 0); }
  }, true);
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused) openPause(); });
  window.addEventListener('blur', () => { if (mode === 'play' && !paused) openPause(); });

  // ----- 작은 도우미 -----
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  // 받침에 맞는 조사: J('노을 항구', '을', '를') → '노을 항구를'
  function J(word, a, b) {
    let ch = 0;
    for (let i = word.length - 1; i >= 0; i--) { const c = word.charCodeAt(i); if (c >= 0xAC00 && c <= 0xD7A3) { ch = c; break; } if (/[0-9]/.test(word[i])) { ch = -1; break; } }
    const jong = ch > 0 ? (ch - 0xAC00) % 28 : 0;
    if (a === '으로') return word + (jong && jong !== 8 ? '으로' : '로');
    return word + (jong ? a : b);
  }
  const starStr = n => '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>';
  const ICON = {
    radius: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="10" fill="#fff3b0"/><g stroke="#ffb040" stroke-width="4" stroke-linecap="round"><path d="M24 3v8M24 37v8M3 24h8M37 24h8M9 9l6 6M33 33l6 6M39 9l-6 6M9 39l6-6"/></g></svg>',
    speed: '<svg viewBox="0 0 48 48"><path d="M31 5c8 2 12 6 12 12L22 38 10 26 31 5z" fill="#cfe0ff"/><circle cx="31" cy="17" r="4" fill="#5a8cff"/><path d="M10 26l-7 7 8 2 2 8 7-7z" fill="#ff8a4a"/></svg>',
    ammo: '<svg viewBox="0 0 48 48"><g fill="#e8f0ff"><rect x="11" y="5" width="7" height="16" rx="3.5"/><rect x="20.5" y="3" width="7" height="18" rx="3.5"/><rect x="30" y="5" width="7" height="16" rx="3.5"/></g><rect x="5" y="18" width="38" height="25" rx="3" fill="#b07a3a"/><rect x="5" y="18" width="38" height="6" fill="#8a5a2a"/></svg>',
    chain: '<svg viewBox="0 0 48 48"><g fill="none" stroke-width="5"><circle cx="15" cy="31" r="10" stroke="#ff9a4a"/><circle cx="33" cy="17" r="10" stroke="#ff5aa0"/></g><circle cx="24" cy="24" r="5" fill="#fff"/></svg>',
    battery: '<svg viewBox="0 0 48 48"><path d="M3 45l8-14h26l8 14z" fill="#6a7088"/><rect x="21" y="6" width="6" height="22" rx="3" fill="#dfe8ff" transform="rotate(28 24 30)"/><path d="M13 31a11 11 0 0 1 22 0z" fill="#aab4cc"/></svg>',
    shield: '<svg viewBox="0 0 48 48"><path d="M24 3l17 6v13c0 11-8 19-17 23C15 41 7 33 7 22V9z" fill="#5ac8ff"/><path d="M24 10l10 4v8c0 7-4 12-10 15z" fill="#c6f0ff"/></svg>',
    repair: '<svg viewBox="0 0 48 48"><path d="M8 45V23l16-12 16 12v22z" fill="#d9b98a"/><path d="M4 25L24 9l20 16" fill="none" stroke="#8b2f35" stroke-width="5" stroke-linejoin="round"/><rect x="20" y="31" width="8" height="14" fill="#6a4a2a"/></svg>',
    mega: '<svg viewBox="0 0 48 48"><circle cx="24" cy="28" r="16" fill="#3a3f52"/><circle cx="24" cy="28" r="10" fill="#ffd34a"/><path d="M31 12l4-7M35 15l8-3" stroke="#ff8a3a" stroke-width="3.5" stroke-linecap="round"/><path d="M24 21l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#fff"/></svg>',
  };
  function bldSvg(alive, i) {
    const h = [26, 32, 24, 38, 30, 34, 22, 30][i];
    return alive
      ? `<svg viewBox="0 0 40 40"><rect x="7" y="${40 - h}" width="26" height="${h}" fill="#d9b98a"/><path d="M5 ${42 - h}L20 ${30 - h}L35 ${42 - h}z" fill="#8b2f35"/><rect x="12" y="${46 - h}" width="5" height="5" fill="#ffd76a"/><rect x="23" y="${46 - h}" width="5" height="5" fill="#ffd76a"/></svg>`
      : '<svg viewBox="0 0 40 40"><path d="M4 40l5-8 6 3 6-9 7 6 5-4 3 12z" fill="#4a4048"/></svg>';
  }
  function screen(html) { $('scr').innerHTML = html; }
  function on(id, fn) { const el = $(id); if (el) el.onclick = fn; }
  function showHud(v) {
    $('hud').classList.toggle('hidden', !v);
    $('stage').classList.toggle('aim', v);
    if (!v) $('megaHint').classList.add('hidden');
  }

  // ----- 데모 (배경에서 저절로 싸움) -----
  function newDemo(c) {
    const r = Engine.newRun(0);
    r.city = c; r.wave = 3 + ((Math.random() * 5) | 0); r.up.radius = 2; r.up.speed = 3; r.up.battery = 2; r.seed = (Math.random() * 1e9) | 0;
    const w = Engine.startWave(r); w.ammo = 999; if (w.boss) { w.boss = null; }
    return w;
  }
  function stepDemo(dt) {
    if (!demo || demo.city !== demoCity) demo = newDemo(demoCity);
    demoT -= dt;
    if (demoT <= 0) {
      demoT = 0.55 + Math.random() * 0.5;
      const es = demo.enemies.filter(e => e.y > 90 && e.y < 520);
      if (es.length) { es.sort((a, b) => b.y - a.y); const e = es[(Math.random() * Math.min(2, es.length)) | 0]; const p = Engine.predict(e, 0.75); Engine.fire(demo, p[0], p[1]); }
    }
    Engine.step(demo, dt);
    for (const ev of demo.ev) visual(ev, true, demo);
    demo.ev.length = 0;
    if (demo.over || demo.failT >= 0 || demo.t > 50) demo = newDemo(demoCity);
  }

  // ----- 사건 → 소리·효과 -----
  const CHAIN_COL = ['#ffffff', '#ffffff', '#ffe27a', '#ffb05a', '#ff7aa8', '#c98aff', '#7ad8ff', '#7affc8'];
  function visual(ev, quiet, w) {
    const S = n => { if (!quiet) Sound.play(n); };
    switch (ev.k) {
      case 'fire': S(ev.mega ? 'mega' : 'fire'); Render.burst(ev.x, ev.y - 8, 6, 'rgba(160,240,255,', 140, 0.3); break;
      case 'boom':
        if (ev.kind !== 'chain' && !quiet) Sound.boom(ev.kind, 0);
        if (ev.kind === 'mega') { Render.shake(14); Render.flash(0.22, '#cfeaff'); }
        Render.burst(ev.x, ev.y, ev.kind === 'chain' ? 9 : 14, ev.kind === 'mega' ? 'rgba(170,230,255,' : 'rgba(255,200,120,', ev.kind === 'mega' ? 420 : 230, 0.6);
        break;
      case 'kill': {
        if (!quiet) Sound.boom('chain', ev.n);
        Render.burst(ev.x, ev.y, 8, ev.type === 'bomb' ? 'rgba(140,255,160,' : ev.type === 'drone' ? 'rgba(120,230,255,' : ev.type === 'split' ? 'rgba(210,150,255,' : 'rgba(200,140,90,', 180, 0.9, 'debris');
        if (quiet) break;
        if (ev.n >= 2) Render.text(ev.x, ev.y - 26, (ev.n >= 6 ? '대' : '') + ev.n + '연쇄!', CHAIN_COL[Math.min(ev.n, 7)], 24 + Math.min(ev.n, 8) * 3, 1.1);
        Render.text(ev.x, ev.y + 6, '+' + ev.pts, '#ffe9a0', 18, 0.8, -30);
        if (ev.n >= 5) Render.shake(4 + Math.min(ev.n, 10));
        break;
      }
      case 'armor': S('armor'); Render.burst(ev.x, ev.y, 10, 'rgba(255,240,180,', 260, 0.35); if (!quiet) Render.text(ev.x, ev.y - 22, '깡!', '#ffe27a', 22, 0.6); break;
      case 'split': S('split'); Render.burst(ev.x, ev.y, 14, 'rgba(220,160,255,', 200, 0.5); break;
      case 'impact':
        if (ev.shield) { S('shield'); Render.burst(ev.x, ev.y, 18, 'rgba(140,230,255,', 260, 0.5); if (!quiet) Render.text(ev.x, ev.y - 30, '방어막!', '#9fe8ff', 26, 1); }
        else if (ev.hit) {
          S('bld'); Render.shake(10); Render.burst(ev.x, ev.y, 26, 'rgba(255,170,90,', 320, 0.8); Render.burst(ev.x, ev.y, 16, 'rgba(120,100,90,', 200, 1.4, 'debris');
          for (let i = 0; i < 6; i++) Render.addPart({ x: ev.x + (Math.random() - 0.5) * 40, y: ev.y, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 30, life: 2, size: 12, col: 'rgba(80,70,80,', type: 'smoke' });
          if (!quiet) Render.text(ev.x, ev.y - 40, '건물 피해!', '#ff8a8a', 28, 1.2);
        } else { S('ground'); Render.burst(ev.x, ev.y, 12, 'rgba(200,170,130,', 160, 0.6, 'debris'); }
        break;
      case 'empty': S('empty'); Render.text(mouse.x, mouse.y - 40, '요격탄이 없어!', '#ff9a9a', 24, 0.8); break;
      case 'bossEnter': break;
      case 'bossHit': S('bossHit'); Render.burst(ev.x, ev.y, 12, 'rgba(255,255,200,', 300, 0.4); Render.text(ev.x, ev.y - 20, '-' + ev.dmg, '#ffb0b0', 28, 0.8); break;
      case 'bossBlock': S('block'); Render.text(ev.x, ev.y - 20, '막혔어!', '#9fe8ff', 24, 0.8); break;
      case 'bossShield': S('bshield'); Render.text(w.boss.x, w.boss.y - 70, '방어막 전개! 잠깐 기다려', '#9fe8ff', 26, 1.6, -10); break;
      case 'charge': S('charge'); Render.setBanner('광선 충전!', '모선을 두 번 맞히면 막을 수 있어!', 2.4, '#ff8a8a'); break;
      case 'chargeCancel': S('cancel2'); Render.text(ev.x, ev.y - 60, '저지 성공! +300', '#9fe8b8', 30, 1.4, -20); break;
      case 'beam': {
        S('beam'); const b = w.bld[ev.bi];
        if (b && w.boss) Render.beam(w.boss.x, w.boss.y + w.boss.h * 0.3, b.x, GROUND - b.h);
        Render.shake(12); Render.flash(0.18, '#ff8080');
        if (ev.hit) { Render.burst(b.x, GROUND - b.h, 30, 'rgba(255,120,120,', 320, 0.9); Render.text(b.x, GROUND - b.h - 30, '건물 피해!', '#ff8a8a', 28, 1.2); }
        if (ev.shield && b) Render.text(b.x, GROUND - b.h - 30, '방어막!', '#9fe8ff', 28, 1.2);
        break;
      }
      case 'enrage': S('enrage'); Render.text(w.boss.x, w.boss.y - 80, '모선이 화났어!', '#ff7a7a', 32, 1.6, -10); break;
      case 'bossDie': S('bossDie'); Render.shake(22); Render.flash(0.5, '#fff1d0'); Render.setBanner('모선 격추!', J(CITIES[w.city].boss.name, '을', '를') + ' 물리쳤어!', 2.6, '#ffe27a'); break;
      case 'resupply': S('resupply'); Render.text(640, 600, '요격탄 보급 +' + ev.n, '#9fe8b8', 28, 1.4, -20); break;
      case 'bossDrop': S('drop'); break;
      case 'fall': S('fall'); Render.setBanner('도시가 무너졌어…', '괜찮아, 이 웨이브를 다시 할 수 있어', 2.2, '#ff9a9a'); break;
      case 'win': if (!w.boss) { S('win'); Render.setBanner('웨이브 클리어!', null, 1.4, '#9fe8b8'); } break;
    }
  }

  // ----- 위쪽 정보 -----
  let hudKey = '';
  function updateHud(force) {
    if (!W || !run) return;
    const key = [run.city, run.wave, run.score + W.score, run.parts, W.megas, W.megaArmed].join('|');
    if (!force && key === hudKey) return;
    hudKey = key;
    $('hCity').textContent = CITIES[run.city].name;
    $('hWave').textContent = '웨이브 ' + run.wave + '/10';
    const th = THEME_INFO[W.theme];
    $('hTheme').textContent = th.label; $('hTheme').classList.toggle('hidden', !th.label); $('hTheme').classList.toggle('boss', W.theme === 'boss');
    $('hScore').textContent = '점수 ' + fmt(run.score + W.score);
    $('hParts').textContent = '부품 ' + fmt(run.parts);
    $('hMega').textContent = W.megas;
    $('bMega').disabled = W.megas <= 0;
    $('bMega').classList.toggle('on', W.megaArmed);
    $('megaHint').classList.toggle('hidden', !W.megaArmed);
  }
  on('bMega', () => { if (mode !== 'play' || !W || W.megas <= 0) return; W.megaArmed = !W.megaArmed; Sound.play(W.megaArmed ? 'select' : 'cancel'); updateHud(true); });
  on('bPause', () => { if (mode === 'play') openPause(); });
  on('bFull', toggleFull);

  // ----- 웨이브 진행 -----
  function startWave() {
    snap = JSON.stringify(run);
    W = Engine.startWave(run);
    mode = 'play'; paused = false;
    screen(''); closeModal(); showHud(true); Render.clear();
    const th = THEME_INFO[W.theme];
    if (W.P.boss) {
      Render.setBanner('⚠ 모선 출현 ⚠', CITIES[run.city].boss.name, 3.2, '#ff8a8a');
      Sound.play('siren'); setTimeout(() => { if (mode === 'play') Sound.play('horn'); }, 900);
      Sound.setSong('boss');
    } else {
      const first = run.city === 0 && run.wave === 1;
      Render.setBanner('웨이브 ' + run.wave, th.label ? th.label + ' — ' + th.tip : first ? '떨어지는 운석 근처를 클릭해 봐!' : null, first ? 3.4 : 2.4);
      Sound.play('wave'); Sound.setSong(CITIES[run.city].song);
    }
    if (W.assist) Render.text(640, 440, '재도전 지원 — 요격탄 +' + W.assist * 4 + ', 적 속도 -' + W.assist * 6 + '%, 방어막 +' + Math.min(2, W.assist), '#9fe8ff', 25, 3.4, 0);
    updateHud(true);
  }
  function waveOver() {
    const w = W;
    showHud(false);
    if (w.result === 'fail') {
      const t = run.stats.time;
      run = JSON.parse(snap); run.stats.time = t;
      run.attempt++; run.stats.fails++; run.cityRun.fails++;
      saveRun(); mode = 'screen';
      showFail();
      return;
    }
    const r = Engine.finishWave(run, w);
    if (r.ending) { if (run.diff) meta.hardClears++; else meta.clears++; run.endingSeen = false; }
    meta.kills += r.kills; meta.bestChain = Math.max(meta.bestChain, r.chainBest); meta.best = Math.max(meta.best, run.score);
    saveMeta(); saveRun();
    mode = 'screen';
    if (r.boss) showClear(r); else showPrep(r);
  }

  // ----- 화면들 -----
  function showTitle() {
    mode = 'title'; showHud(false); closeModal(); Sound.setSong('title');
    demoCity = (Math.random() * 6) | 0;
    const saved = loadRun();
    const where = saved ? (saved.cleared && saved.stage === 'clear' ? '모든 도시 해방 · 별 ' + saved.stars.reduce((a, b) => a + b, 0) + '/18' : CITIES[saved.city].name + ' · 웨이브 ' + saved.wave) + (saved.diff ? ' · 어려움' : '') : '';
    screen(`<div class="full title">
      <h1>하늘 방어대</h1>
      <div class="sub">운석과 외계 폭탄으로부터 도시 6곳을 지켜 줘!</div>
      <div class="menu">
        ${saved ? `<button class="btn gold" id="tCont">이어하기</button><div class="save">${where}</div>` : ''}
        <button class="btn ${saved ? '' : 'gold'}" id="tNew">새 게임</button>

      </div>
      <div class="foot">마우스 왼쪽 클릭만 쓰면 돼 · 스페이스바도 클릭이랑 똑같아 · 진행은 자동 저장돼</div>
    </div>`);
    on('tCont', () => { Sound.play('start'); run = saved; resume(); });
    on('tNew', () => confirmNew(0, !!saved));
    on('tHard', () => confirmNew(1, !!saved));

    on('tRec', showRecords);
    on('tSet', () => openSettings(false));

  }
  function confirmNew(diff, hasSave) {
    const go = () => { Sound.play('start'); run = Engine.newRun(diff); Engine.startCity(run, 0); saveRun(); showIntro(); };
    if (!hasSave) return go();
    modal(`<h2>새로 시작할까?</h2><div class="mtext">지금 저장된 진행은 지워져.</div>
      <div class="btnrow"><button class="btn red" id="mYes">새로 시작</button><button class="btn gray" id="mNo">취소</button></div>`);

  function resume() {
    if (run.cleared && run.endingSeen === false) showEnding();

    else showMap();
  }

  function showMap() {
    mode = 'map'; showHud(false); closeModal(); Sound.setSong('shop');
    demoCity = Math.min(5, run.unlocked);
    const total = run.stars.reduce((a, b) => a + b, 0);
    const cards = CITIES.map((c, i) => {
      const lock = i > run.unlocked;
      const nowTag = i === run.city && run.stage === 'prep' ? `<span class="now">웨이브 ${run.wave}부터</span>`
        : i === run.unlocked && !run.stars[i] ? '<span class="now">다음 도시</span>' : '';
      const grad = ['#2b3a8a,#6b4f93', '#8d3e6e,#e7845a', '#4d3f86,#d9895f', '#183563,#5f86b3', '#22164a,#2f8080', '#3a0f2e,#8f3a3d'][i];
      return `<button class="city ${lock ? 'lock' : ''}" id="city${i}" ${lock ? 'disabled' : ''} style="background:linear-gradient(135deg,${grad})">

        <div class="st">${starStr(run.stars[i])}</div>
        <div class="ne">${lock ? '앞 도시를 지키면 열려' : c.newEnemy ? '새 적: ' + ENEMY[c.newEnemy].name : '모든 적 + 거대 모선'}</div>
        ${lock ? '<span class="lk">잠김</span>' : nowTag}
      </button>`;
    }).join('');
    screen(`<div class="full"><div class="map panel">
      <h2>도시 지도</h2>
      <div class="info">별 ${total}/18 · 점수 ${fmt(run.score)} · 부품 ${fmt(run.parts)}${run.diff ? ' · 어려움 모드' : ''}</div>
      <div class="cities">${cards}</div>
      <div class="bar"><button class="btn gray small" id="mTitle">타이틀로</button><button class="btn gray small" id="mSet">설정</button></div>
    </div></div>`);

    on('mTitle', showTitle);
    on('mSet', () => openSettings(false));
  }
  function pickCity(i) {
    Sound.play('select');
    if (i === run.city && run.stage === 'prep') return showPrep(null);
    if (i === run.city && run.stage === 'intro') return showIntro();
    const go = () => { Engine.startCity(run, i); saveRun(); showIntro(); };
    if (run.stage === 'prep' && run.wave > 1) {
      modal(`<h2>다른 도시로 갈까?</h2><div class="mtext">${J(CITIES[run.city].name, '은', '는')} 웨이브 ${run.wave}까지 진행 중이야.<br>옮기면 그 도시는 나중에 처음부터 다시 해야 해.</div>
        <div class="btnrow"><button class="btn gold" id="mYes">옮기기</button><button class="btn gray" id="mNo">취소</button></div>`);
      on('mYes', () => { closeModal(); go(); });
      on('mNo', closeModal);
    } else go();
  }

      • 웨이브가 끝나면 남은 건물만큼 <b>부품</b>을 받아 포대를 강화해.</div>` : '';
    screen(`<div class="full"><div class="intro panel">
      <div class="no">도시 ${run.city + 1} / 6${run.diff ? ' · 어려움' : ''}</div>
      <h2>${c.name}</h2>
      <div class="desc">${c.desc}</div>
      ${ne ? `<div class="newE"><canvas id="neIcon" width="160" height="160"></canvas><div><div class="t1">${run.city === 0 ? '적' : '새 적'}: ${ENEMY[ne].name}</div><div class="t2">${ENEMY[ne].tip}</div></div></div>` : '<div class="newE"><div><div class="t1">마지막 도시</div><div class="t2">지금까지 나온 적이 모두 섞여서 와. 마지막 웨이브엔 거대 모선이 기다려!</div></div></div>'}
      ${how}
      <div class="bossP">10번째 웨이브: ${c.boss.name}<br><span style="color:#ffe9a8">끝까지 건물을 7채 이상 지키면 별 3개, 4채 이상이면 별 2개!</span></div>
      <div class="btnrow"><button class="btn gray small" id="iMap">지도</button><button class="btn" id="iShop">포대 강화</button><button class="btn gold" id="iGo">방어 시작!</button></div>
    </div></div>`);

  function showPrep(r) {
    mode = 'prep'; showHud(false); closeModal(); Sound.setSong('shop');
    demoCity = run.city;
    run.stage = 'prep'; saveRun();
    renderPrep(r);
  }
  function renderPrep(r) {
    const P = Engine.plan(run), th = THEME_INFO[P.theme];
    let res;
    if (r) {
      const p = r.parts;
      res = `<h3>웨이브 ${run.wave - 1} 클리어!</h3>
        <div class="line">남은 건물 ${r.alive}/8 <b>+${p.bld}</b></div>
        <div class="line">남은 요격탄 ${r.ammoLeft}발 <b>+${p.ammo}</b></div>
        <div class="line">격추 ${r.kills} <b>+${p.kill}</b></div>
        <div class="line">최대 연쇄 ${r.chainBest} <b>+${p.chain}</b></div>
        ${p.perfect ? `<div class="line">무피해 보너스 <b>+${p.perfect}</b></div>` : ''}
        <div class="sum"><span>받은 부품</span><span>+${r.total}</span></div>
        <div class="line" style="border:none">웨이브 점수 <b style="color:#ffe9a8">${fmt(r.waveScore + r.bonusScore)}</b></div>

    } else {
      res = `<h3 class="ready">작전 준비</h3>
        <div class="line">도시 <b style="color:#fff">${CITIES[run.city].name}</b></div>
        <div class="line">점수 <b style="color:#ffe9a8">${fmt(run.score)}</b></div>
        <div class="line">메가 폭탄 <b style="color:#ffd34a">${run.megas}개</b></div>
        ${run.attempt ? `<div class="note">재도전 지원 중: 요격탄 +${Math.min(4, run.attempt) * 4}, 적 속도 -${Math.min(4, run.attempt) * 6}%, 방어막 +${Math.min(2, run.attempt)}</div>` : ''}`;
    }
    const next = P.boss ? `<div class="next">다음: 웨이브 10 · 모선 출현!<span>${J(CITIES[run.city].boss.name, '이', '가')} 와. 모선을 맞혀서 격추해!</span></div>`
      : `<div class="next">다음: 웨이브 ${run.wave}${th.label ? ' · ' + th.label : ''}<span>${th.tip || '적 ' + P.count + '개 정도가 내려와.'}</span></div>`;
    const cards = UPGRADES.map(u => {
      const lv = run.up[u.id], cost = Engine.upCost(run, u.id), max = cost == null;
      const pips = '●'.repeat(lv) + '<i>' + '●'.repeat(u.costs.length - lv) + '</i>';
      const cv = max ? u.fmt(u.val(lv)) + u.unit + ' (최고)' : u.fmt(u.val(lv)) + ' → ' + u.fmt(u.val(lv + 1)) + u.unit;
      return `<button class="card ${max ? 'max' : ''}" id="up_${u.id}" ${max || run.parts < cost ? 'disabled' : ''} title="${u.desc}">
        ${ICON[u.id]}<div class="cn">${u.name}</div><div class="pips">${pips}</div><div class="cv">${cv}</div>
        <div class="cc ${!max && run.parts < cost ? 'no' : ''}">${max ? '완료' : '부품 ' + cost}</div></button>`;
    }).join('');
    const dead = run.bld.filter(v => !v).length, rc = repairCost(run.city);
    const items = `<button class="card" id="itRepair" ${dead && run.parts >= rc ? '' : 'disabled'}>${ICON.repair}<div class="cn">건물 수리</div><div class="cv">무너진 건물 ${dead}채</div><div class="cv">하나 다시 짓기</div><div class="cc ${run.parts < rc ? 'no' : ''}">${dead ? '부품 ' + rc : '필요 없음'}</div></button>
      <button class="card" id="itMega" ${run.megas < MEGA_MAX && run.parts >= MEGA_COST ? '' : 'disabled'}>${ICON.mega}<div class="cn">메가 폭탄</div><div class="cv">아주 크게 터지는 한 방</div><div class="cv">가진 것 ${run.megas}/${MEGA_MAX}</div><div class="cc ${run.parts < MEGA_COST ? 'no' : ''}">${run.megas >= MEGA_MAX ? '가득' : '부품 ' + MEGA_COST}</div></button>`;
    const blds = run.bld.map((v, i) => bldSvg(v, i)).join('');
    screen(`<div class="prep">
      <div class="res panel">${res}${next}</div>
      <div class="shop panel">
        <div class="shopHead"><h3>포대 강화</h3><span class="parts">부품 ${fmt(run.parts)}</span></div>
        <div class="cards">${cards}${items}</div>
      </div>
      <div class="bottom panel">
        <div class="blds"><span class="lbl">건물</span>${blds}</div>
        <div class="btnrow"><button class="btn gray small" id="pMap">지도</button><button class="btn gray small" id="pTitle">저장하고 나가기</button><button class="btn gold" id="pGo">${P.boss ? '모선 맞서기 ▶' : '웨이브 ' + run.wave + ' 시작 ▶'}</button></div>
      </div>
    </div>`);
    UPGRADES.forEach(u => on('up_' + u.id, () => { if (Engine.buyUp(run, u.id)) { Sound.play('buy'); saveRun(); renderPrep(r); } else Sound.play('error'); }));
    on('itRepair', () => { if (Engine.buyRepair(run) >= 0) { Sound.play('buy'); saveRun(); renderPrep(r); } else Sound.play('error'); });
    on('itMega', () => { if (Engine.buyMega(run)) { Sound.play('buy'); saveRun(); renderPrep(r); } else Sound.play('error'); });
    on('pMap', showMap);
    on('pTitle', () => { saveRun(); showTitle(); });
    on('pGo', () => { Sound.play('start'); startWave(); });
  }

  function showFail() {

      <div class="assist">재도전 지원: 요격탄 +${a * 4} · 적 속도 -${a * 6}% · 방어막 +${Math.min(2, a)}${run.wave === 10 ? ' · 모선 체력 -' + a * 12 + '%' : ''}</div>
      <div class="btnrow"><button class="btn" id="fShop">포대 강화 들르기</button><button class="btn gold" id="fGo">다시 도전 ▶</button></div>

      <div class="bigstars">${stars}</div>
      <div class="msg" style="margin-bottom:8px">${r.stars === 3 ? '완벽한 방어야!' : r.stars === 2 ? '건물이 7채 이상 남으면 별 3개야.' : '건물이 4채 이상 남으면 별 2개야.'}${r.newBest && !r.firstClear ? ' 별 기록을 새로 세웠어!' : ''}</div>
      <div class="stats">
        <div>남은 건물 <b>${r.alive}/8</b></div><div>격추 <b>${cr.kills}</b></div>

        <div>도시 점수 <b>${fmt(cr.score)}</b></div><div>재도전 <b>${cr.fails}번</b></div>
        <div>모선 보상 <b>부품 +${r.parts.boss}</b></div><div>도시 보상 <b>부품 +${r.clearBonus}</b></div>
      </div>
      <div class="btnrow">${r.ending ? '<button class="btn gold" id="cEnd">마지막 이야기 ▶</button>'
        : `<button class="btn gray" id="cMap">지도</button>${run.city < 5 ? `<button class="btn gold" id="cNext">${J(CITIES[run.city + 1].name, '으로', '로')} ▶</button>` : ''}`}</div>

  function showEnding() {

    const mins = Math.round(run.stats.time / 60);
    screen(`<div class="full"><div class="mid panel" style="width:860px">
      <h2>하늘이 다시 맑아졌어!</h2>
      <div class="msg">거대 모선 「검은 별」이 무너지고, 외계 함대는 멀리 물러갔어.<br>여섯 도시의 사람들이 밤하늘의 불꽃놀이를 올려다보며 하늘 방어대를 외쳐!</div>
      <div class="rank">칭호: ${rank}</div>
      <div class="stats">
        <div>모은 별 <b>${total}/18</b></div><div>총점 <b>${fmt(run.score)}</b></div>
        <div>격추 <b>${fmt(run.stats.kills)}</b></div><div>최대 연쇄 <b>${run.stats.bestChain}</b></div>
        <div>재도전 <b>${run.stats.fails}번</b></div><div>플레이 시간 <b>${mins}분</b></div>
      </div>
      <div class="msg" style="font-size:22px">${run.diff ? '어려움 모드까지 깼어! 진짜 전설이야.' : '타이틀에서 어려움 모드가 열렸어. 지도에서 도시를 다시 골라 별을 더 모을 수도 있어.'}</div>
      <div class="btnrow"><button class="btn gray" id="eMap">지도</button><button class="btn gold" id="eTitle">타이틀로</button></div>
    </div></div>`);
    let n = 0;
    const fw = setInterval(() => {
      if (mode !== 'ending' || n++ > 40) return clearInterval(fw);
      const x = 120 + Math.random() * 1040, y = 90 + Math.random() * 300;
      Render.burst(x, y, 40, ['rgba(255,220,120,', 'rgba(255,140,200,', 'rgba(140,220,255,', 'rgba(160,255,170,'][n % 4], 260, 1.4);
      if (n % 3 === 0) Sound.boom('fx', 0);
    }, 450);
    on('eMap', showMap);
    on('eTitle', showTitle);
  }

  // ----- 모달 -----
  function modal(html) { $('mbox').innerHTML = html; $('modal').classList.remove('hidden'); }
  function closeModal() { $('modal').classList.add('hidden'); $('mbox').innerHTML = ''; }
  function openPause() {
    paused = true; showHud(true);
    $('stage').classList.remove('aim');
    modal(`<h2>잠깐 쉬는 중</h2><div class="col">
      <button class="btn gold" id="psGo">계속하기</button>
      <button class="btn" id="psSet">설정</button>
      <button class="btn" id="psHelp">게임 방법</button>
      <button class="btn gray" id="psRe">이 웨이브 처음부터</button>
      <button class="btn gray" id="psOut">나가기 (웨이브 시작 전으로 저장됨)</button></div>`);
    on('psGo', resumePlay);
    on('psSet', () => openSettings(true));
    on('psHelp', () => showHelp(openPause));
    on('psRe', () => { const t = run.stats.time; run = JSON.parse(snap); run.stats.time = t; closeModal(); startWave(); });
    on('psOut', () => { const t = run.stats.time; run = JSON.parse(snap); run.stats.time = t; saveRun(); W = null; showTitle(); });
  }
  function resumePlay() { closeModal(); paused = false; $('stage').classList.add('aim'); }
  function openSettings(fromPause) {
    const levels = [['끄기', 0], ['작게', 0.3], ['보통', 0.6], ['크게', 0.85], ['최대', 1]];
    const near = cur => levels.reduce((bi, l, i) => Math.abs(l[1] - cur) < Math.abs(levels[bi][1] - cur) ? i : bi, 0);
    const seg = (key, cur) => levels.map(([n], i) => `<button class="seg ${near(cur) === i ? 'on' : ''}" id="s_${key}_${i}">${n}</button>`).join('');
    const tog = (key, cur) => `<button class="seg ${cur ? 'on' : ''}" id="s_${key}_1">켜기</button><button class="seg ${!cur ? 'on' : ''}" id="s_${key}_0">끄기</button>`;
    modal(`<h2>설정</h2>
      <div class="opt"><span class="on2">효과음</span>${seg('sfx', meta.sfx)}</div>
      <div class="opt"><span class="on2">배경 음악</span>${seg('bgm', meta.bgm)}</div>
      <div class="opt"><span class="on2">화면 흔들림</span>${tog('shake', meta.shake)}</div>
      <div class="opt"><span class="on2">조준 보조선</span>${tog('lines', meta.lines)}</div>
      <div class="opt c" style="margin-top:18px"><button class="btn gray small" id="sFull">전체 화면</button><button class="btn gold small" id="sClose">닫기</button></div>`);
    levels.forEach(([n, v], i) => {
      on(`s_sfx_${i}`, () => { meta.sfx = v; applyOpts(); saveMeta(); Sound.play('fire'); openSettings(fromPause); });
      on(`s_bgm_${i}`, () => { meta.bgm = v; applyOpts(); saveMeta(); openSettings(fromPause); });
    });
    ['shake', 'lines'].forEach(k => [0, 1].forEach(v => on(`s_${k}_${v}`, () => { meta[k] = !!v; applyOpts(); saveMeta(); openSettings(fromPause); })));
    on('sFull', toggleFull);
    on('sClose', () => { if (fromPause) openPause(); else closeModal(); });
  }
  function applyOpts() { Sound.setSfx(meta.sfx); Sound.setBgm(meta.bgm); Render.opt.shake = meta.shake; Render.opt.lines = meta.lines; }
  function showHelp(back) {
    const list = Object.keys(ENEMY).map(k => `<div class="hrow"><canvas id="hi_${k}" width="120" height="120"></canvas><div><b>${ENEMY[k].name}</b>${ENEMY[k].tip}</div></div>`).join('');
    modal(`<h2>게임 방법</h2>
      <div class="help">
        <p>• 하늘을 <b>클릭</b>(스페이스바도 같아)하면 요격탄이 날아가 그 자리에서 터져.</p>
        <p>• 폭발에 닿은 적은 같이 터지고, 옆의 적을 또 터뜨려. <b>연쇄</b>일수록 점수가 몇 배!</p>
        <p>• 요격탄 수는 정해져 있어. 남기면 부품을 더 줘. 빨간 선은 건물을 노리는 적이야.</p>
        <p>• <b>메가 폭탄</b> 버튼을 누르고 하늘을 클릭하면 아주 크게 터져. 모선에는 3배로 아파.</p>
        <p>• 도시마다 웨이브 10개, 마지막엔 모선이 와. 건물이 다 무너지면 그 웨이브만 다시 하면 돼.</p>
      </div>
      <div class="hlist">${list}</div>
      <button class="btn gold small" id="hClose">닫기</button>`);

    on('hClose', () => { if (back) back(); else closeModal(); });

  function showRecords() {
    const r = loadRun();
    const mins = Math.round(meta.time / 60);
    modal(`<h2>기록</h2><div class="recs">
      <div>최고 점수 <b>${fmt(meta.best)}</b></div><div>최대 연쇄 <b>${meta.bestChain}</b></div>
      <div>모든 도시 해방 <b>${meta.clears}번</b></div><div>어려움 모드 해방 <b>${meta.hardClears}번</b></div>
      <div>총 격추 <b>${fmt(meta.kills)}</b></div><div>총 플레이 <b>${mins}분</b></div>
      ${r ? `<div>지금 별 <b>${r.stars.reduce((a, b) => a + b, 0)}/18</b></div><div>지금 점수 <b>${fmt(r.score)}</b></div>` : ''}
      </div><button class="btn gold small" id="rClose">닫기</button>`);
    on('rClose', closeModal);
  }

  // ----- 돌아가는 고리 -----
  let last = performance.now(), speedMul = 1;
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)) * speedMul; last = now;
    if (mode === 'play' && W && !paused) {
      let left = dt;
      while (left > 1e-6 && !W.over) { const h = Math.min(left, 1 / 60); Engine.step(W, h); left -= h; }
      for (const ev of W.ev) visual(ev, false, W);
      W.ev.length = 0;
      run.stats.time += dt; meta.time += dt;
      updateHud();
      if (W.over) waveOver();
    } else if (mode !== 'play') stepDemo(dt);
    const play = mode === 'play' && W;
    Render.frame(play && !paused ? dt : (play ? 0 : dt), play ? W : demo, {
      mx: mouse.x, my: mouse.y, mouseIn: mouse.inCv && play && !paused, hud: !!play, dim: play ? (paused ? 0.45 : 0) : 0.42,
    });
    requestAnimationFrame(loop);
  }

  // ----- 시작 -----
  Render.init($('cv'));
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  fit(); applyOpts();
  setInterval(saveMeta, 15000);
  window.addEventListener('beforeunload', saveMeta);
  showTitle();
  requestAnimationFrame(loop);
  window.__sky = { get run() { return run; }, get W() { return W; }, get mode() { return mode; }, set speed(v) { speedMul = v; }, startWave, showPrep, showTitle, showMap };
})();

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>별빛 딸 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3b2f4a; --ink2: #6b5d7a; --paper: #fff9ef; --paper2: #f7ead6; --line: #e2cfb2;
  --accent: #e86a92; --accent2: #7a6cf0; --gold: #e0a92e; --good: #2f9e6e; --bad: #d4495b;
  --night1: #141a3d; --night2: #2b2466;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1030; }
body { font-family: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; }
.jua { font-family: 'Jua', 'Gowun Dodum', 'Malgun Gothic', sans-serif; }

#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden;
  background: radial-gradient(ellipse at 30% 10%, #3a3384 0%, var(--night2) 35%, var(--night1) 100%); }
#stars { position: absolute; inset: 0; pointer-events: none; }
#stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: block; }

.btn { border: 3px solid #c99a6b; background: linear-gradient(#fffaf0, #f6e4c8); border-radius: 16px; padding: 10px 22px; font-size: 24px; cursor: pointer;
  box-shadow: 0 4px 0 #b88a5a; transition: transform .08s, filter .1s; }
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b88a5a; }
.btn.pri { background: linear-gradient(#ff9fbd, #e86a92); border-color: #c24a72; color: #fff; box-shadow: 0 4px 0 #a83a5f; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.btn.vio { background: linear-gradient(#a99cff, #7a6cf0); border-color: #5a4cc8; color: #fff; box-shadow: 0 4px 0 #4a3cb0; }
.btn:disabled, .btn.off { filter: grayscale(.8) opacity(.55); cursor: default; transform: none; }
.btn.small { font-size: 20px; padding: 6px 14px; border-radius: 12px; }

/* ---------- 타이틀 ---------- */
#title .logo { position: absolute; left: 90px; top: 110px; color: #fff; }
#title .logo h1 { margin: 0; font-size: 92px; letter-spacing: 4px; text-shadow: 0 0 24px #b9a8ff, 0 6px 0 #4a3cb0; }
#title .logo p { margin: 10px 0 0 6px; font-size: 28px; color: #e6defa; }
#title .menu { position: absolute; left: 100px; top: 300px; display: flex; flex-direction: column; gap: 12px; width: 360px; }
#title .menu .btn { font-size: 28px; padding: 9px 24px; }
#title .info { position: absolute; left: 100px; bottom: 24px; color: #cfc6f0; font-size: 22px; }
#title .pic { position: absolute; right: 90px; top: 50px; width: 440px; height: 640px; }
#title .pic svg { width: 100%; height: 100%; filter: drop-shadow(0 0 30px rgba(190,170,255,.5)); }

/* ---------- 새로 시작 ---------- */
#setup .panel { position: absolute; left: 70px; top: 50px; width: 720px; height: 620px; background: var(--paper); border: 4px solid var(--line); border-radius: 26px; padding: 30px 40px; }
#setup h2 { margin: 0 0 16px; font-size: 40px; }
#setup .lbl { font-size: 26px; margin: 18px 0 10px; }
#nameInput { font-family: inherit; font-size: 34px; padding: 10px 18px; width: 340px; border: 3px solid #c99a6b; border-radius: 14px; background: #fff; color: var(--ink); outline: none; }
#nameInput:focus { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-size: 22px; padding: 6px 16px; border-radius: 999px; border: 2px solid #d8c09c; background: #fff; cursor: pointer; }
.chip:hover { background: #fff1e0; }
.swatch { width: 62px; height: 62px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 3px #d8c09c; cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 5px var(--accent); }
#setup .preview { position: absolute; right: 80px; top: 60px; width: 380px; height: 560px; border-radius: 26px; overflow: hidden; border: 4px solid var(--line); background: #fdf1dc; }
#setup .preview > div { position: absolute; inset: 0; }
#setup .preview svg { width: 100%; height: 100%; }
#setup .bonus { font-size: 21px; color: var(--accent2); margin-top: 14px; min-height: 28px; }
#setup .go { position: absolute; left: 40px; bottom: 30px; display: flex; gap: 14px; }

/* ---------- 메인 ---------- */
#hud { position: absolute; left: 0; top: 0; right: 0; height: 66px; display: flex; align-items: center; gap: 16px; padding: 0 18px; color: #fff; }
#hud .date { font-size: 32px; text-shadow: 0 2px 0 rgba(0,0,0,.3); min-width: 330px; }
#hud .gold { font-size: 30px; background: rgba(255,255,255,.12); padding: 4px 18px; border-radius: 999px; min-width: 190px; text-align: center; }
#hud .sp { flex: 1; }
#hud .btn { font-size: 21px; padding: 6px 14px; }

.card { position: absolute; background: var(--paper); border: 4px solid var(--line); border-radius: 22px; }
#pcard { left: 14px; top: 76px; width: 384px; height: 630px; overflow: hidden; padding: 0; }
#pcard .room, #pcard .girl { position: absolute; left: 0; top: 0; width: 376px; height: 446px; }
#pcard .room svg, #pcard .girl svg { width: 100%; height: 100%; }
#pcard .girl { transition: transform .3s; }
#pcard .girl.bounce { animation: bounce .5s; }
@keyframes bounce { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-14px) } }
#bubble { position: absolute; left: 14px; top: 12px; max-width: 250px; background: #fff; border: 3px solid #d8c09c; border-radius: 18px; padding: 8px 14px; font-size: 20px; line-height: 1.35; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
#bubble:empty { display: none; }
#pinfo { position: absolute; left: 0; right: 0; top: 446px; bottom: 0; padding: 8px 18px; background: var(--paper); border-top: 3px solid var(--line); }
#pinfo .nm { font-size: 30px; }
#pinfo .ttl { font-size: 18px; color: var(--accent2); margin-left: 8px; }
.meter { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 21px; }
.meter b { width: 82px; font-weight: normal; }
.meter .bar { flex: 1; height: 20px; background: #eadcc6; border-radius: 10px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 10px; transition: width .5s; }
.meter span { width: 48px; text-align: right; }

#stats { left: 410px; top: 76px; width: 370px; height: 470px; padding: 12px 16px; }
.srow { display: flex; align-items: center; height: 43px; gap: 8px; font-size: 22px; border-radius: 10px; padding: 0 4px; transition: background .3s; }
.srow b { width: 50px; font-weight: normal; }
.srow .arrow { width: 26px; text-align: center; font-size: 18px; }
.srow .bar { flex: 1; height: 18px; background: #eadcc6; border-radius: 9px; overflow: hidden; }
.srow .bar i { display: block; height: 100%; border-radius: 9px; transition: width .6s; }
.srow span { width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
.srow.flash { background: #fff1b8; }
.up { color: var(--good); } .down { color: var(--bad); }

#acts { left: 792px; top: 76px; width: 476px; height: 470px; padding: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 61px; gap: 4px 6px; }
.act { position: relative; display: flex; align-items: center; gap: 8px; border-radius: 14px; border: 3px solid transparent; padding: 2px 10px; cursor: pointer; text-align: left; font-size: 22px; }
.act.lesson { background: #eef0ff; border-color: #c9cdf5; }
.act.job { background: #eaf7ee; border-color: #b9e0c5; }
.act.rest, .act.travel { background: #fff0f3; border-color: #f2c4d0; }
.act:hover { filter: brightness(1.04); border-color: var(--accent); }
.act .ic { font-size: 30px; width: 38px; text-align: center; line-height: 1; display: flex; flex-direction: column; align-items: center; }
.act .tx { flex: 1; line-height: 1.15; min-width: 0; }
.act .r1 { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; font-size: 21px; }
.act .tx small { display: block; font-size: 16px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.act .lv { font-size: 10px; color: #c99a2e; letter-spacing: -1px; margin-top: 3px; }
.act .money { font-size: 17px; }
.act.dis { filter: grayscale(.9) opacity(.5); cursor: default; }

#sched { left: 410px; top: 556px; width: 858px; height: 150px; padding: 8px 10px; display: flex; gap: 10px; align-items: stretch; }
.slot { width: 160px; border: 3px dashed #d8c09c; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: #fffdf8; position: relative; }
.slot .when { position: absolute; top: 4px; left: 10px; font-size: 18px; color: var(--ink2); }
.slot .ic { font-size: 42px; margin-top: 12px; }
.slot .nm { font-size: 22px; }
.slot.filled { border-style: solid; border-color: var(--accent); background: #fff3f7; }
.slot.empty .nm { color: #b8a58a; font-size: 19px; }
.slot.next { box-shadow: 0 0 0 3px #ffd2e0 inset; }
#sched .side { flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
#sched .side .sum { font-size: 19px; color: var(--ink2); text-align: center; }
#repeatBtn { font-size: 18px; padding: 3px 10px; box-shadow: 0 3px 0 #b88a5a; }
#startBtn { font-size: 27px; padding: 7px 10px; }

/* 진행 화면 */
#run { position: absolute; left: 410px; top: 76px; width: 858px; height: 630px; display: none; background: var(--paper); border: 4px solid var(--line); border-radius: 22px; overflow: hidden; }
#run.on { display: block; }
#run .head { height: 70px; display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 30px; background: var(--paper2); border-bottom: 3px solid var(--line); }
#run .head .steps { margin-left: auto; display: flex; gap: 8px; }
#run .head .steps i { width: 22px; height: 22px; border-radius: 50%; background: #e2d2b8; display: block; }
#run .head .steps i.on { background: var(--accent); }
#run .head .steps i.done { background: var(--good); }
#run .scene { position: absolute; left: 0; right: 0; top: 70px; height: 300px; display: flex; align-items: center; justify-content: center; }
#run .big { font-size: 150px; animation: work 0.9s infinite ease-in-out; }
@keyframes work { 0%,100% { transform: rotate(-8deg) translateY(0) } 50% { transform: rotate(8deg) translateY(-12px) } }
#run .days { position: absolute; left: 0; right: 0; top: 370px; display: flex; justify-content: center; gap: 10px; }
#run .days i { width: 30px; height: 30px; border-radius: 8px; background: #eadcc6; display: block; transition: background .15s, transform .15s; }
#run .days i.on { background: #f5b13d; transform: scale(1.1); }
#run .line { position: absolute; left: 0; right: 0; top: 418px; text-align: center; font-size: 28px; min-height: 40px; }
#run .result { position: absolute; left: 0; right: 0; top: 466px; text-align: center; }
#run .result .kind { font-size: 44px; display: inline-block; }
#run .result .kind.great { color: #e0702e; animation: pop .4s; }
#run .result .kind.ok { color: var(--good); animation: pop .4s; }
#run .result .kind.fail { color: var(--bad); animation: pop .4s; }
#run .result .kind.sick { color: #7a6cf0; animation: pop .4s; }
@keyframes pop { 0% { transform: scale(.4) } 70% { transform: scale(1.15) } 100% { transform: scale(1) } }
.chgs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.chg { font-size: 22px; padding: 3px 12px; border-radius: 999px; background: #fff; border: 2px solid #e2d2b8; }
.chg.up { border-color: #9fd8b9; } .chg.down { border-color: #f0b0b8; }
#run .skip { position: absolute; right: 16px; bottom: 10px; font-size: 17px; color: var(--ink2); }
#run .summary { position: absolute; inset: 70px 0 0 0; background: var(--paper); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 28px; }
#run .summary.on { display: flex; }

/* ---------- 모달 ---------- */
#modalWrap { position: absolute; inset: 0; background: rgba(10,8,30,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
#modalWrap.on { display: flex; }
.modal { background: var(--paper); border: 5px solid var(--line); border-radius: 26px; padding: 22px 34px; min-width: 560px; max-width: 1180px; max-height: 690px; box-shadow: 0 16px 50px rgba(0,0,0,.45); position: relative; animation: mIn .22s; }
@keyframes mIn { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.modal h3 { margin: 0 0 12px; font-size: 36px; display: flex; align-items: center; gap: 12px; }
.modal h3 .ic { font-size: 50px; }
.modal p { font-size: 26px; line-height: 1.5; margin: 8px 0; }
.modal .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; justify-content: center; }
.modal .btns .btn { min-width: 170px; }
.modal .x { position: absolute; right: 16px; top: 12px; }

/* 생일 선물 */
.gifts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 12px; }
.gift { border: 3px solid #e2d2b8; border-radius: 18px; background: #fff; padding: 12px; text-align: center; cursor: pointer; font-size: 22px; }
.gift:hover { border-color: var(--accent); background: #fff3f7; }
.gift .ic { font-size: 56px; display: block; }
.gift small { display: block; color: var(--ink2); font-size: 18px; margin-top: 4px; }

/* 옷가게 */
.shop { display: grid; grid-template-columns: repeat(4, 220px); gap: 12px; }
.ocard { border: 3px solid #e2d2b8; border-radius: 18px; background: #fff; cursor: pointer; position: relative; overflow: hidden; height: 232px; }
.ocard:hover { border-color: #f0a0bc; }
.ocard.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #ffd2e0; }
.ocard .pv { height: 152px; background: #fdf1dc; }
.ocard .pv svg { width: 100%; height: 100%; }
.ocard .nm { font-size: 21px; text-align: center; margin-top: 4px; }
.ocard .pr { font-size: 19px; text-align: center; color: var(--gold); }
.ocard .tag { position: absolute; left: 8px; top: 8px; font-size: 16px; background: var(--good); color: #fff; padding: 2px 10px; border-radius: 999px; }
.ocard .tag.wear { background: var(--accent); }
.shopinfo { display: flex; align-items: center; gap: 16px; margin-top: 14px; font-size: 23px; min-height: 60px; }
.shopinfo .d { flex: 1; }

/* 도감 */
.codex { display: grid; grid-template-columns: repeat(5, 208px); gap: 8px; }
.ecard { border: 3px solid #e2d2b8; border-radius: 14px; background: #fff; padding: 6px 10px; height: 82px; display: flex; align-items: center; gap: 8px; cursor: default; position: relative; }
.ecard .ic { font-size: 34px; }
.ecard .nm { font-size: 20px; line-height: 1.15; }
.ecard.lock { background: #f1ebe2; }
.ecard.lock .ic { filter: grayscale(1) opacity(.45); }
.ecard.got { border-color: #f0a0bc; background: #fff6f9; }
.ecard .pg { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 6px; background: #eadcc6; border-radius: 3px; overflow: hidden; }
.ecard .pg i { display: block; height: 100%; background: var(--accent2); }
.ecard:hover { border-color: var(--accent2); }
.cinfo { margin-top: 12px; font-size: 22px; min-height: 66px; background: #fff; border-radius: 14px; padding: 10px 16px; border: 2px dashed #e2d2b8; }

/* 설정 */
.setrow { display: flex; align-items: center; gap: 12px; font-size: 25px; margin: 12px 0; }
.setrow b { width: 150px; font-weight: normal; }
.seg { display: flex; gap: 6px; }
.seg .btn { font-size: 21px; padding: 6px 16px; }
.seg .btn.on { background: linear-gradient(#ff9fbd, #e86a92); color: #fff; border-color: #c24a72; }

/* 축제 */
.fest { display: grid; grid-template-columns: repeat(4, 240px); gap: 14px; margin-top: 8px; }
.fcard { border: 3px solid #e2d2b8; border-radius: 18px; background: #fff; padding: 14px; text-align: center; cursor: pointer; }
.fcard:hover { border-color: var(--accent); background: #fff3f7; }
.fcard .ic { font-size: 60px; }
.fcard .nm { font-size: 26px; }
.fcard small { display: block; font-size: 18px; color: var(--ink2); }
.fcard .chance { font-size: 21px; margin-top: 6px; }
.match { width: 900px; }
.vs { display: flex; align-items: center; gap: 18px; margin: 18px 0; font-size: 26px; }
.vs .who { width: 250px; }
.vs .bar { flex: 1; height: 34px; background: #eadcc6; border-radius: 17px; overflow: hidden; }
.vs .bar i { display: block; height: 100%; width: 0; border-radius: 17px; transition: width 1.4s ease-out; }
.vs .sc { width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
.rlabel { font-size: 32px; text-align: center; }
.rres { font-size: 40px; text-align: center; min-height: 54px; }

/* 엔딩 */
#ending { z-index: 40; }
#ending .bgc { position: absolute; inset: 0; transition: background 1s; }
#ending .pic { position: absolute; left: 70px; top: 40px; width: 430px; height: 640px; opacity: 0; transition: opacity 1.2s; }
#ending .pic svg { width: 100%; height: 100%; filter: drop-shadow(0 0 28px rgba(255,240,200,.45)); }
#ending .txt { position: absolute; left: 540px; top: 60px; width: 680px; color: #fff; opacity: 0; transition: opacity 1.2s; }
#ending .txt .no { font-size: 24px; color: #ffe2a8; }
#ending .txt h2 { margin: 6px 0 18px; font-size: 64px; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
#ending .txt p { font-size: 27px; line-height: 1.6; }
#ending .txt .new { display: inline-block; background: #ffcf4a; color: #5a3a00; font-size: 22px; padding: 2px 14px; border-radius: 999px; margin-left: 12px; vertical-align: middle; }
#ending .final { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px 14px; font-size: 20px; margin-top: 14px; background: rgba(255,255,255,.12); padding: 12px 16px; border-radius: 16px; }
#ending .btn:not(.pri) { color: var(--ink); }
#ending .btns { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
#ending .intro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; text-align: center; line-height: 1.7; transition: opacity 1s; }

#toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); background: rgba(40,30,70,.92); color: #fff; font-size: 24px; padding: 10px 26px; border-radius: 999px; z-index: 80; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.on { opacity: 1; }
</style></head><body>
<div id="stage">
  <div id="stars"></div>

  <!-- 타이틀 -->
  <section id="title" class="screen">
    <div class="logo jua"><h1>별빛 딸 키우기</h1><p>열 살 딸을 열여덟 살까지, 8년의 이야기</p></div>
    <div class="menu">
      <button class="btn pri jua" id="tContinue">이어하기</button>
      <button class="btn jua" id="tNew">새로 키우기</button>
      <button class="btn jua" id="tCodex">엔딩 도감</button>
      <button class="btn jua" id="tSettings">설정</button>
      <button class="btn jua" id="tFull">전체 화면</button>
    </div>
    <div class="info" id="tInfo"></div>
    <div class="pic" id="tPic"></div>
  </section>

  <!-- 새로 시작 -->
  <section id="setup" class="screen">
    <div class="panel">
      <h2 class="jua">딸을 맞이하자</h2>
      <div class="lbl">이름 (키보드로 입력하거나 아래에서 골라 줘)</div>
      <input id="nameInput" maxlength="6" autocomplete="off" spellcheck="false">
      <div class="chips" id="nameChips" style="margin-top:12px"></div>
      <div class="lbl">머리 색</div>
      <div class="chips" id="hairChips"></div>
      <div class="bonus" id="ngBonus"></div>
      <div class="go">
        <button class="btn pri jua" id="setupGo" style="font-size:30px">키우기 시작!</button>
        <button class="btn jua" id="setupBack">돌아가기</button>
      </div>
    </div>
    <div class="preview"><div id="setupRoom"></div><div id="setupGirl"></div></div>
  </section>

  <!-- 메인 -->
  <section id="main" class="screen">
    <div id="hud">
      <div class="date jua" id="hDate"></div>
      <div class="gold jua" id="hGold"></div>
      <div class="sp"></div>
      <button class="btn jua" id="hShop">👗 옷가게</button>
      <button class="btn jua" id="hCodex">📖 도감</button>
      <button class="btn jua" id="hSet">⚙️ 설정</button>
      <button class="btn jua" id="hFull">⛶</button>
    </div>
    <div class="card" id="pcard">
      <div class="room" id="pRoom"></div>
      <div class="girl" id="pGirl"></div>
      <div id="bubble"></div>
      <div id="pinfo">
        <div><span class="nm jua" id="pName"></span><span class="ttl" id="pTitle"></span></div>

const EVENT = Object.fromEntries(EVENTS.map(e => [e.id, e]));
// ===== 게임 규칙 (화면과 분리: 시뮬레이션에서도 그대로 씀) =====
const Logic = (() => {
  let rng = Math.random;
  const setRng = f => { rng = f; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[Math.floor(rng() * arr.length)];

  const TOTAL_MONTHS = 96;
  const STIPEND = 70;
  const GAIN = 0.5;   // 수업·일 능력치 상승 배율
  const age = s => 10 + Math.floor(s.m / 12);
  const calMonth = s => (2 + s.m) % 12;           // 0 = 1월
  const yearNo = s => Math.floor(s.m / 12) + 1;   // n년째
  const isBirthday = s => s.m > 0 && s.m % 12 === 0;
  const isFestival = s => s.m % 12 === 7;          // 10월

  // ----- 한국어 조사 -----
  function hasBatchim(word) {
    const ch = word.charCodeAt(word.length - 1);
    if (ch < 0xac00 || ch > 0xd7a3) return false;
    return (ch - 0xac00) % 28 !== 0;
  }
  const JOSA = { '은': ['은', '는'], '이': ['이', '가'], '을': ['을', '를'], '과': ['과', '와'], '아': ['아', '야'], '도': ['도', '도'] };
  const josa = (word, j) => word + JOSA[j][hasBatchim(word) ? 0 : 1];
  function fmt(text, s) {
    const n = s.name;
    const b = hasBatchim(n);
    return text.replace(/\{n\}\{(은|이|을|과|아|도)\}/g, (_, j) => n + JOSA[j][b ? 0 : 1]).replace(/\{n\}/g, n);
  }

  // ----- 새 게임 -----
  function newGame(name, hair, meta) {
    meta = meta || {};
    const r = () => Math.floor(rng() * 7) - 3;
    const s = {
      v: 1, name, hair, m: 0,
      st: { hp: 30 + r(), str: 15 + r(), int: 20 + r(), ele: 20 + r(), cha: 25 + r(), sen: 20 + r(), mag: 5 + r(), mor: 40 + r(), cook: 5 + r(), swd: 5 + r() },
      stress: 0, fame: 0,
      gold: 500 + newGamePlusGold(meta),
      outfit: 'basic',
      owned: Array.from(new Set(['basic', ...(meta.keptOutfits || [])])),
      cnt: {}, flags: {}, wins: { martial: 0, beauty: 0, cook: 0, magic: 0 },
      titles: [], seen: {}, sched: [null, null, null], lastSched: null,
      sick: 0, runaways: 0, runaway: false, contestLog: [],
    };
    for (const a of ACTS) s.cnt[a.id] = 0;
    return s;
  }
  function newGamePlusGold(meta) {
    const n = Object.keys(meta.endings || {}).length;
    return Math.min(1000, n * 50);
  }

  // ----- 수업 단계 -----
  function lessonLv(s, id) {
    const c = s.cnt[id] || 0;
    let lv = 1;
    for (let i = 0; i < LESSON_LV.length; i++) if (c >= LESSON_LV[i]) lv = i + 1;
    return lv;
  }
  const lvMult = lv => 1 + (lv - 1) * 0.15;

  function payOf(s, a) { return Math.round(a.pay * (1 + (age(s) - 10) * 0.12)); }

  function actState(s, a, plannedCost) {
    if (a.minAge && age(s) < a.minAge) return { ok: false, why: `${a.minAge}살부터` };
    if (a.req) for (const k in a.req) if (s.st[k] < a.req[k]) return { ok: false, why: `${STAT_NAME[k]} ${a.req[k]} 필요` };
    const cost = a.cost || 0;
    if (cost > 0 && s.gold - (plannedCost || 0) < cost) return { ok: false, why: '돈이 모자라' };
    return { ok: true };
  }
  function schedCost(s) {
    return s.sched.reduce((t, id) => t + (id ? (ACT[id].cost || 0) : 0), 0);
  }

  // ----- 스탯 적용 -----
  function addStat(s, k, d) {
    if (k === 'gold') { s.gold = Math.max(0, s.gold + d); return; }
    if (k === 'stress') { s.stress = clamp(s.stress + d, 0, 100); return; }
    if (k === 'fame') { s.fame = clamp(s.fame + d, 0, 999); return; }
    if (k in s.st) { s.st[k] = clamp(s.st[k] + d, 0, STAT_MAX); return; }
    s.flags[k] = (s.flags[k] || 0) + d;  // 플래그 (friend, prince 등)
  }
  function applyFx(s, fx) {
    const out = [];
    for (const k in fx) { addStat(s, k, fx[k]); out.push({ k, d: fx[k] }); }
    return out;
  }

  // ----- 스케줄 한 칸 실행 -----
  function runSlot(s, id) {
    const a = ACT[id];
    const res = { id, kind: 'ok', changes: [], gold: 0, stress: 0, line: pick(a.lines), lvUp: false };

    // 아픔 판정 (스트레스가 높으면)
    if (a.type !== 'rest' && a.type !== 'travel' && s.stress >= 80) {
      const p = clamp((s.stress - 75) / 50 + (s.st.hp < 100 ? 0.1 : 0), 0, 0.65);
      if (rng() < p) {
        res.kind = 'sick';
        const med = Math.min(s.gold, 40);
        s.gold -= med; res.gold = -med;
        addStat(s, 'stress', -25); res.stress = -25;
        addStat(s, 'hp', -3); res.changes.push({ k: 'hp', d: -3 });
        s.sick++;
        res.line = '열이 나서 앓아누웠어… 약값이 들었어.';
        return res;
      }
    }

    // 성공 판정
    const sp = Math.max(0, s.stress - 40) * 0.008;
    let pOk, pGreat;
    if (a.type === 'lesson') { pOk = 0.9 - sp; pGreat = 0.12; }
    else if (a.type === 'job') { const kv = s.st[a.key] || 0; pOk = clamp(0.55 + kv / 400, 0.55, 0.95) - sp; pGreat = 0.08 + Math.min(0.15, kv / 2000); }
    else { pOk = 1; pGreat = 0.15; }
    const roll = rng();
    res.kind = roll < pGreat ? 'great' : roll < pOk ? 'ok' : 'fail';
    if (res.kind === 'fail') res.line = a.lines[a.lines.length - 1];
    const mult = { great: 1.5, ok: 1, fail: 0.35 }[res.kind];

    // 효과 배율: 수업 단계 · 옷
    const before = a.type === 'lesson' ? lessonLv(s, id) : 0;
    let m = a.type === 'lesson' ? lvMult(before) : 1;
    const of = OUTFIT[s.outfit];
    if (of && of.act && of.act[id]) m *= of.act[id];

    for (const k in a.gain) {
      const base = a.gain[k];
      let d;
      if (base > 0) d = Math.max(res.kind === 'fail' ? 0 : 1, Math.round(base * GAIN * m * mult * (0.8 + rng() * 0.4)));
      else d = Math.min(-1, Math.round(base * GAIN));
      if (d !== 0) { addStat(s, k, d); res.changes.push({ k, d }); }
    }

    // 돈
    if (a.type === 'job') {
      const g = Math.round(payOf(s, a) * (res.kind === 'great' ? 1.5 : res.kind === 'fail' ? 0.4 : 1));
      s.gold += g; res.gold = g;
    } else if (a.cost) {
      const c = Math.min(s.gold, a.cost);
      s.gold -= c; res.gold = -c;
    }

    // 스트레스: 체력이 높을수록 덜 쌓여
    let sd = a.stress;
    if (sd > 0) sd = Math.round(sd * (1 - Math.min(0.45, s.st.hp / 900)) * (res.kind === 'fail' ? 1.3 : 1));
    else if (res.kind === 'great') sd = Math.round(sd * 1.3);
    addStat(s, 'stress', sd); res.stress = sd;

    if (a.fame) { addStat(s, 'fame', a.fame * (res.kind === 'fail' ? 0 : 1)); }
    if (a.type === 'job' && res.kind !== 'fail' && !a.fame) addStat(s, 'fame', 0.5);

    s.cnt[id] = (s.cnt[id] || 0) + 1;
    if (a.type === 'lesson' && lessonLv(s, id) > before) res.lvUp = lessonLv(s, id);
    return res;
  }

  // ----- 달 마감 -----
  function monthEnd(s) {
    const out = { stipend: STIPEND, bonus: [], runaway: false };
    s.gold += STIPEND;
    const of = OUTFIT[s.outfit];
    if (of && of.bonus) out.bonus = applyFx(s, of.bonus);
    s.fame = Math.round(s.fame * 10) / 10;
    if (s.stress >= 100 && s.st.mor < 200 && rng() < 0.5) { s.runaway = true; out.runaway = true; }
    s.lastSched = s.sched.slice();
    s.sched = [null, null, null];
    s.m++;
    return out;
  }

  function resolveRunaway(s) {
    s.runaway = false;
    s.runaways++;
    const lost = Math.min(s.gold, 100);
    s.gold -= lost;
    s.stress = 40;
    addStat(s, 'mor', -10);
    addStat(s, 'fame', -25);
    s.gold += STIPEND;
    s.m++;
    return { lost };
  }

  // ----- 이벤트 -----
  function eventOK(s, e) {
    if (!e.repeat && s.seen[e.id]) return false;
    if (e.month !== undefined && calMonth(s) !== e.month) return false;
    if (e.cond && !e.cond(s, s.st, age(s), calMonth(s))) return false;
    return true;
  }
  function pickEvent(s) {
    const fixed = EVENTS.filter(e => e.weight === 99 && eventOK(s, e));
    if (fixed.length) return fixed[0];
    if (s.m === 0 || rng() > 0.4) return null;
    const pool = EVENTS.filter(e => e.weight !== 99 && eventOK(s, e) && !(e.repeat && s.seen[e.id] && rng() < 0.7));
    if (!pool.length) return null;
    return pick(pool);
  }
  function chooseEvent(s, e, i) {
    s.seen[e.id] = (s.seen[e.id] || 0) + 1;
    const ch = e.choices[i];
    const fx = Object.assign({}, ch.fx);
    let msg = ch.msg;
    let extra = null;
    if (fx.gamble) {
      delete fx.gamble;
      if (rng() < 0.55) { fx.gold = (fx.gold || 0) + 450; msg = '행상인이 정말로 450G를 들고 돌아왔어! 대박!'; }
      else msg = '행상인은… 다시 나타나지 않았어. 비싼 수업료였어.';
    }
    if (fx.fortune) {
      delete fx.fortune;
      const near = nearestEnding(s);
      msg = `"따님에게서 「${near.name}」의 기운이 느껴지는구려…" ${near.hint}`;
      extra = near.id;
    }
    const changes = applyFx(s, fx);
    return { msg: fmt(msg, s), changes, extra };
  }

  // ----- 생일 -----
  function birthdayGifts(s) {
    const pool = BDAY_GIFTS.slice();
    const out = [];
    while (out.length < 4) out.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
    return out;
  }

  // ----- 축제 대회 -----
  function contestPower(s, id) {
    const c = CONTEST[id];
    let p = c.power(s.st);
    const of = OUTFIT[s.outfit];
    if (of && of.contest && of.contest[id]) p += of.contest[id];
    return Math.round(p);
  }
  function rivalBase(y) { return 40 + y * 62; }  // y: 1~8
  function runContest(s, id) {
    const c = CONTEST[id];
    const y = yearNo(s);
    const base = rivalBase(y);
    const names = c.rivals.slice().sort(() => rng() - 0.5);
    const rounds = [];
    const muls = [0.7, 0.9, 1.08];
    const labels = ['1회전', '준결승', '결승'];
    let won = true;
    const me = contestPower(s, id);
    for (let i = 0; i < 3; i++) {
      const them = Math.round(base * muls[i] * (0.88 + rng() * 0.24));
      const mine = Math.round(me * (0.9 + rng() * 0.2));
      const win = mine >= them;
      rounds.push({ label: labels[i], rival: names[i], me: mine, them, win });
      if (!win) { won = false; break; }
    }
    const prize = won ? 200 + y * 50 : rounds.length >= 2 ? 50 : 0;
    s.gold += prize;
    addStat(s, 'fame', won ? 40 : 5 + rounds.length * 3);
    addStat(s, 'stress', won ? -15 : 5);
    if (won) {
      s.wins[id]++;
      const t = `${c.name} 우승`;
      if (!s.titles.includes(t)) s.titles.push(t);
    }
    s.contestLog.push({ y, id, won, reach: rounds.length });
    return { rounds, won, prize, power: me };
  }

  // ----- 엔딩 -----
  function reqMet(s, req) {
    if (req.st) for (const k in req.st) if (s.st[k] < req.st[k]) return false;
    if (req.max) for (const k in req.max) if (s.st[k] > req.max[k]) return false;
    if (req.cnt) for (const k in req.cnt) if ((s.cnt[k] || 0) < req.cnt[k]) return false;
    if (req.wins) for (const k in req.wins) if (s.wins[k] < req.wins[k]) return false;
    if (req.flags) for (const k in req.flags) if ((s.flags[k] || 0) < req.flags[k]) return false;
    if (req.gold && s.gold < req.gold) return false;
    return true;
  }
  // 0~1: 조건에 얼마나 가까운지
  function reqProgress(s, req) {
    const parts = [];
    if (req.st) for (const k in req.st) parts.push(Math.min(1, s.st[k] / req.st[k]));
    if (req.max) for (const k in req.max) parts.push(s.st[k] <= req.max[k] ? 1 : Math.max(0, 1 - (s.st[k] - req.max[k]) / 200));

const Sound = (() => {
  let ctx = null, master = null, bgmGain = null, sfxGain = null;

      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.ratio.value = 4;

      master.connect(comp); comp.connect(ctx.destination);

  function tone(freq, t0, dur, type, vol, dest, slideTo) {
    if (!ctx) return;

    o.type = type || 'triangle';

    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  }

    click:  () => tone(N(84), ctx.currentTime, 0.07, 'square', 0.18),
    select: () => seq([76, 83], 0.06, 'triangle', 0.45),
    cancel: () => seq([72, 65], 0.06, 'triangle', 0.4),
    tick:   () => tone(N(91), ctx.currentTime, 0.05, 'sine', 0.22),
    coin:   () => seq([88, 95], 0.07, 'square', 0.25),
    good:   () => seq([72, 76, 79], 0.07, 'triangle', 0.5),
    great:  () => seq([72, 76, 79, 84, 88], 0.06, 'triangle', 0.55),
    fail:   () => seq([67, 63, 60], 0.11, 'sawtooth', 0.25),
    sick:   () => seq([64, 60, 57, 52], 0.14, 'triangle', 0.45),
    lvup:   () => seq([72, 76, 79, 84, 0, 84], 0.08, 'square', 0.3),
    event:  () => seq([84, 79, 88], 0.09, 'sine', 0.55),
    buy:    () => seq([79, 84, 91], 0.07, 'square', 0.28),
    start:  () => seq([60, 64, 67, 72], 0.07, 'triangle', 0.5),
    hit:    () => { tone(N(48), ctx.currentTime, 0.18, 'square', 0.4, null, N(36)); tone(N(72), ctx.currentTime, 0.06, 'sawtooth', 0.2); },
    win:    () => seq([67, 72, 76, 79, 0, 76, 79, 84, 84, 84], 0.1, 'square', 0.32, 0.22),
    lose:   () => seq([72, 71, 70, 69, 0, 64], 0.16, 'triangle', 0.45),
    bday:   () => seq([67, 67, 69, 67, 72, 71], 0.16, 'triangle', 0.5),
    ending: () => seq([72, 76, 79, 84, 83, 79, 76, 79, 84, 88, 91], 0.16, 'triangle', 0.5, 0.4),
  };
  function play(name) {
    if (!ctx || !FX[name]) return;
    try { FX[name](); } catch (e) { /* 무시 */ }
  }

  // 오르골풍 배경음
  const SONGS = {
    home: { tempo: 0.27, mel: [76, 0, 79, 76, 74, 0, 72, 74, 76, 0, 72, 0, 67, 0, 0, 0, 69, 0, 72, 69, 67, 0, 64, 67, 69, 0, 72, 74, 72, 0, 0, 0],
            bass: [48, 55, 52, 55, 45, 52, 48, 52, 41, 48, 45, 48, 43, 50, 47, 50] },
    fest: { tempo: 0.18, mel: [72, 76, 79, 76, 72, 76, 79, 84, 81, 79, 77, 76, 74, 76, 77, 79, 72, 76, 79, 76, 72, 76, 79, 84, 83, 81, 79, 77, 76, 74, 72, 0],

      const lv = a.type === 'lesson' ? `<span class="lv">${'★'.repeat(Logic.lessonLv(S, a.id))}${'☆'.repeat(5 - Logic.lessonLv(S, a.id))}</span>` : '';
      const sub = st.ok ? gainText(a) : `🔒 ${st.why}`;
      return `<div class="act ${a.type}${st.ok ? '' : ' dis'}" data-act="${a.id}"><span class="ic">${a.icon}${lv}</span><span class="tx"><span class="r1">${a.name}${money}</span><small>${sub}</small></span></div>`;
    }).join('');
  }
  function renderSched() {
    const firstEmpty = S.sched.indexOf(null);
    document.querySelectorAll('#sched .slot').forEach((el, i) => {
      const id = S.sched[i];
      el.className = 'slot ' + (id ? 'filled' : 'empty') + (i === firstEmpty ? ' next' : '');
      el.innerHTML = `<span class="when">${SLOT_NAMES[i]}</span>` + (id ? `<span class="ic">${ACT[id].icon}</span><span class="nm">${ACT[id].name}</span>` : `<span class="ic" style="opacity:.25">＋</span><span class="nm">왼쪽에서 골라 줘</span>`);
    });
    let out = 0, inc = 0;
    for (const id of S.sched) if (id) { const a = ACT[id]; if (a.type === 'job') inc += Logic.payOf(S, a); else out += a.cost || 0; }
    $('schedSum').innerHTML = `지출 <b class="down">-${out}G</b> · 수입 <b class="up">+${inc}G</b>`;
    $('startBtn').disabled = firstEmpty !== -1;
    $('repeatBtn').disabled = !canRepeat();
  }
  function canRepeat() {
    if (!S.lastSched || S.lastSched.some(x => !x)) return false;
    let cost = 0;
    for (const id of S.lastSched) {
      const st = Logic.actState(S, ACT[id], cost);
      if (!st.ok) return false;
      cost += ACT[id].cost || 0;
    }
    return true;
  }
  function renderAll() {
    if (!S) return;
    renderHud(); renderStats(); renderActs(); renderSched(); renderGirl();
  }
  function setHudLock(on) {
    ['hShop', 'hCodex', 'hSet'].forEach(id => { $(id).disabled = on; });
  }

  // 말풍선
  function talk(text) {
    if (text) { $('bubble').textContent = text; return; }
    const a = Logic.age(S), cm = Logic.calMonth(S), st = Logic.stage(S);
    let pool;
    if (S.stress >= 80) pool = ['너무 힘들어… 좀 쉬고 싶어.', '머리가 핑 돌아…', '쉬게 해 주면 안 돼?'];
    else if (S.stress >= 60) pool = ['요즘 좀 지쳐.', '놀러 가고 싶다~', '휴식이 필요해…'];
    else if (S.gold < 80) pool = ['우리 집… 돈 괜찮아?', '나 아르바이트 할까?'];
    else if (S.m === 0) pool = [`안녕, 아빠! 나 ${S.name}! 잘 부탁해!`];
    else if (S.m >= 90) pool = ['곧 열여덟 살이야… 두근두근.', '어른이 되면 뭘 하고 있을까?'];
    else if (cm === 8) pool = ['다음 달은 가을 축제야! 준비해야지.', '축제에 무슨 대회 나갈까?'];
    else if (st === 0) pool = ['이번 달엔 뭐 해?', '아빠, 오늘 저녁 뭐야?', '나 키 컸지?', '헤헤, 열심히 할게!'];
    else if (st === 1) pool = ['이번 달도 힘내 볼게!', '친구들이랑 놀고 싶은데…', '거울 보는 게 좋아졌어.', '나 많이 컸지?'];
    else pool = ['벌써 이렇게 컸네.', '아빠, 늘 고마워.', '꿈에 한 걸음씩!', '오늘은 뭘 배울까?'];
    $('bubble').textContent = pool[Math.floor(Math.random() * pool.length)];
    void a;
  }

  // ---------- 스케줄 고르기 ----------
  function onActClick(id) {
    if (busy || !S) return;
    const a = ACT[id];
    const i = S.sched.indexOf(null);
    if (i === -1) { toast('칸이 다 찼어. 바꿀 칸을 먼저 눌러서 비워 줘'); Sound.play('cancel'); return; }
    const st = Logic.actState(S, a, Logic.schedCost(S));
    if (!st.ok) { toast(`${a.name}: ${st.why}`); Sound.play('cancel'); return; }
    S.sched[i] = id;
    Sound.play('select');
    renderActs(); renderSched();
  }
  function onSlotClick(i) {
    if (busy || !S || !S.sched[i]) return;
    S.sched[i] = null;
    Sound.play('cancel');
    renderActs(); renderSched();
  }
  function onRepeat() {
    if (busy || !S || !canRepeat()) return;
    S.sched = S.lastSched.slice();
    Sound.play('select');
    renderActs(); renderSched();
  }

  // ---------- 한 달 진행 ----------
  async function runMonth() {
    if (busy || !S || S.sched.includes(null)) return;
    busy = true; setHudLock(true);
    Sound.play('start');
    $('bubble').textContent = '';
    $('run').classList.add('on');
    $('rSummary').classList.remove('on');
    for (let i = 0; i < 3; i++) await playSlot(i);
    skip = false;
    const end = Logic.monthEnd(S);
    await showSummary(end);
    $('run').classList.remove('on');
    busy = false; setHudLock(false);
    save();
    renderAll();
    await beginMonth();
  }

  async function playSlot(i) {
    skip = false;
    const id = S.sched[i], a = ACT[id];
    $('rSteps').innerHTML = [0, 1, 2].map(k => `<i class="${k < i ? 'done' : k === i ? 'on' : ''}"></i>`).join('');
    $('rTitle').textContent = `${SLOT_NAMES[i]} · ${a.icon} ${a.name}${a.type === 'lesson' ? ' 수업' : ''}`;
    $('rIcon').textContent = a.icon;
    $('rIcon').style.animation = '';
    $('rDays').innerHTML = '<i></i>'.repeat(10);
    $('rLine').textContent = '';
    $('rResult').innerHTML = '';
    renderGirl(a.type === 'rest' || a.type === 'travel' ? 'happy' : 'normal');
    const res = Logic.runSlot(S, id);
    const days = $('rDays').children;
    await sleep(350);
    for (let d = 0; d < 10; d++) {
      days[d].classList.add('on');
      Sound.play('tick');
      if (d === 3) $('rLine').textContent = res.line;
      await sleep(380);
    }
    const kindTxt = { great: '대성공!', ok: '성공!', fail: '실패…', sick: '아파서 쉬었어…' }[res.kind];
    const ch = res.changes.slice();
    if (res.gold) ch.push({ k: 'gold', d: res.gold });
    if (res.stress) ch.push({ k: 'stress', d: res.stress });
    $('rResult').innerHTML = `<span class="kind ${res.kind} jua">${kindTxt}</span>${chipsHTML(ch)}`;
    if (res.kind === 'sick') $('rIcon').textContent = '🤒';
    $('rIcon').style.animation = 'none';
    Sound.play({ great: 'great', ok: 'good', fail: 'fail', sick: 'sick' }[res.kind]);
    if (res.gold > 0) setTimeout(() => Sound.play('coin'), 250);
    renderGirl(res.kind === 'great' || res.kind === 'ok' ? 'happy' : res.kind === 'sick' ? 'sick' : 'sulky');
    if (res.kind !== 'fail') bounce();
    const fl = {}; res.changes.forEach(c => { fl[c.k] = 1; });
    renderHud();
    if (res.lvUp) { setTimeout(() => { Sound.play('lvup'); toast(`${a.name} 수업이 ${res.lvUp}단계가 됐어! 효과가 더 커져`); }, 500); }
    skip = false;
    await sleep(res.lvUp ? 2300 : 1800);
    void fl;
  }

  async function showSummary(end) {
    const box = $('rSummary');
    const ch = [{ k: 'gold', d: end.stipend }].concat(end.bonus);
    box.innerHTML = `<div class="jua" style="font-size:40px">한 달 끝!</div><div>나라에서 주는 양육 지원금이 들어왔어.</div>${chipsHTML(ch)}`;
    box.classList.add('on');
    Sound.play('coin');
    renderAll();
    await sleep(1500);
    box.classList.remove('on');
  }

  // ---------- 달 시작 ----------
  async function beginMonth(first) {
    if (!S) return;
    if (S.runaway) await runawayScene();
    if (S.m >= Logic.TOTAL_MONTHS) return startEnding();
    renderAll();
    if (first && S.m === 0) await tutorial();
    if (Logic.isBirthday(S) && S.bdayDone !== S.m) { await birthday(); S.bdayDone = S.m; save(); }
    if (Logic.isFestival(S) && S.festDone !== S.m) { await festival(); S.festDone = S.m; save(); }
    if (S.evDone !== S.m) {
      const ev = Logic.pickEvent(S);
      S.evDone = S.m;
      if (ev) await doEvent(ev);
      save();
    }
    closeModal();
    renderAll();
    talk();
    if (Logic.mood(S) === 'tired') bounce();
  }

  async function tutorial() {
    await choose(`<h3><span class="ic">🌟</span>${F('{n}{과} 함께하는 8년')}</h3>
      <p>매달 <b>상순·중순·하순</b> 세 칸에 할 일을 넣어 줘.<br>오른쪽 목록을 <b>클릭</b>하면 빈칸에 차례로 들어가고, 칸을 클릭하면 빠져.</p>
      <p>📚 수업은 돈이 들고 능력치가 올라. 🥐 아르바이트는 돈을 벌어.<br>😫 스트레스가 쌓이면 아프거나 집을 나갈 수도 있으니 🛏️ 휴식·🧳 여행도 챙겨 줘.</p>
      <p>🍂 해마다 10월엔 가을 축제 대회가 열리고, 🎂 열여덟 살 생일에 엔딩이 정해져.<br>📖 도감에서 엔딩별 힌트를 볼 수 있어. (스페이스바 = 클릭)</p>
      <div class="btns"><button class="btn pri jua" data-v="ok">알겠어!</button></div>`);

  async function birthday() {
    const a = Logic.age(S);

    const gifts = Logic.birthdayGifts(S);
    Sound.play('bday');

      <p>${grow ? F('{n}{이} 몰라보게 훌쩍 컸어! ') : ''}생일 선물을 하나 골라 줘.</p>
      <div class="gifts">${gifts.map(g => `<div class="gift" data-v="${g.id}"><span class="ic">${g.icon}</span>${g.n}<small>${Object.entries(g.fx).map(([k, d]) => `${KEY_NAME[k]} ${d > 0 ? '+' : ''}${d}${k === 'gold' ? 'G' : ''}`).join(', ')}</small></div>`).join('')}</div>`, '');

  async function doEvent(ev) {
    Sound.play('event');
    const html = `<h3><span class="ic">${ev.icon}</span>${ev.title}</h3><p>${F(ev.text)}</p>
      <div class="btns">${ev.choices.map((c, i) => {
        const off = c.need && S.gold < c.need;
        return `<button class="btn ${i === 0 ? 'pri' : ''} jua" data-v="${i}" ${off ? 'disabled' : ''}>${c.t}</button>`;
      }).join('')}</div>`;
    const v = await choose(html);
    const r = Logic.chooseEvent(S, ev, +v);

    await choose(`<h3><span class="ic">${ev.icon}</span>${ev.title}</h3><p>${r.msg}</p>${chipsHTML(r.changes)}
      <div class="btns"><button class="btn pri jua" data-v="ok">확인</button></div>`);

  async function runawayScene() {
    Sound.play('lose');
    renderGirl('sulky', true);

      <p>${F('아침에 일어나 보니 {n}의 방이 비어 있었어. 스트레스가 너무 쌓였던 거야…')}</p>
      <p>한 달 동안 온 마을을 찾아다녔어.</p>

      <p>${F('한 달 만에 {n}{이} 고개를 푹 숙이고 돌아왔어. "…미안해."')}</p>
      ${chipsHTML([{ k: 'gold', d: -r.lost }, { k: 'mor', d: -10 }, { k: 'fame', d: -25 }])}
      <p style="font-size:22px">다음부터는 휴식이랑 여행을 꼭 챙겨 주자.</p>
      <div class="btns"><button class="btn pri jua" data-v="ok">꼭 안아 준다</button></div>`);

  // ---------- 가을 축제 ----------
  function chanceOf(id) {
    const me = Logic.contestPower(S, id);
    const fin = Logic.rivalBase(Logic.yearNo(S)) * 1.08;
    const r = me / fin;
    if (r >= 1.12) return ['우승 가능성 높음!', '#2f9e6e'];
    if (r >= 0.97) return ['해 볼 만해', '#3a7bd5'];
    if (r >= 0.8) return ['조금 어려워', '#e0702e'];
    return ['아직 무리야', '#d4495b'];
  }
  async function festival() {
    Sound.setSong('fest');
    Sound.play('event');
    const y = Logic.yearNo(S);
    const v = await choose(`<h3><span class="ic">🎪</span>가을 별빛 축제 (${y}번째)</h3>
      <p>광장에 등불이 가득해! ${F('{n}{은}')} 어느 대회에 나갈까? 우승하면 상금과 칭호를 받아.</p>
      <div class="fest">${CONTESTS.map(c => {
        const [t, col] = chanceOf(c.id);
        const w = S.wins[c.id];
        return `<div class="fcard" data-v="${c.id}"><div class="ic">${c.icon}</div><div class="nm jua">${c.name}</div><small>${c.stat}</small><div class="chance" style="color:${col}">${t}</div><small>내 실력 ${Logic.contestPower(S, c.id)}${w ? ` · 우승 ${w}회` : ''}</small></div>`;
      }).join('')}</div>
      <div class="btns"><button class="btn jua" data-v="none">구경만 할래 (스트레스 -20)</button></div>`);
    if (v === 'none') {
      Logic.applyFx(S, { stress: -20, sen: 3 });
      toast('솜사탕을 먹으며 축제를 즐겼어!');
    } else await contest(v);
    Sound.setSong('home');
    renderAll();
  }
  async function contest(id) {
    const c = CONTEST[id];
    const r = Logic.runContest(S, id);
    for (let i = 0; i < r.rounds.length; i++) {
      const rd = r.rounds[i];
      const max = Math.max(rd.me, rd.them) * 1.15;
      openModal(`<div class="match"><h3><span class="ic">${c.icon}</span>${c.name}</h3>
        <div class="rlabel jua">${rd.label}</div>
        <div class="vs"><div class="who jua">${S.name}</div><div class="bar"><i id="cbMe" style="background:#e86a92"></i></div><div class="sc" id="csMe">0</div></div>
        <div class="vs"><div class="who">${rd.rival}</div><div class="bar"><i id="cbThem" style="background:#7a8aa0"></i></div><div class="sc" id="csThem">0</div></div>
        <div class="rres jua" id="cRes"></div></div>`);
      await sleep(500);
      Sound.play('hit');
      $('cbMe').style.width = (rd.me / max * 100) + '%';
      $('cbThem').style.width = (rd.them / max * 100) + '%';
      const t0 = performance.now();
      await new Promise(res => {
        const f = () => {
          const k = Math.min(1, (performance.now() - t0) / 1400);
          $('csMe').textContent = Math.round(rd.me * k);
          $('csThem').textContent = Math.round(rd.them * k);
          if (k < 1) requestAnimationFrame(f); else res();
        };
        f();
      });
      await sleep(300);
      $('cRes').innerHTML = rd.win ? '<span class="up">승리!</span>' : '<span class="down">패배…</span>';
      Sound.play(rd.win ? 'good' : 'fail');
      await sleep(1400);
    }
    Sound.play(r.won ? 'win' : 'lose');
    renderGirl(r.won ? 'happy' : 'sulky', true);
    const reached = r.rounds.length;
    const msg = r.won ? F(`{n}{이} ${c.name}에서 우승했어! 「${c.name} 우승」 칭호를 얻었어.`)
      : reached === 3 ? F('아깝게 결승에서 졌어. 그래도 준우승이야!') : reached === 2 ? '준결승에서 아쉽게 졌어.' : '1회전에서 졌어… 내년엔 더 강해지자.';
    await choose(`<h3><span class="ic">${r.won ? '🏆' : c.icon}</span>${r.won ? '우승!' : '대회 끝'}</h3><p>${msg}</p>
      ${chipsHTML([{ k: 'gold', d: r.prize }, { k: 'fame', d: r.won ? 40 : 5 + reached * 3 }])}
      <div class="btns"><button class="btn pri jua" data-v="ok">확인</button></div>`);
  }

  // ---------- 옷가게 ----------
  async function openShop() {
    if (busy || !S) return;
    let sel = S.outfit;
    const shopList = OUTFITS.filter(o => !o.hidden);
    let draw = () => {
      const o = OUTFIT[sel];
      const owned = S.owned.includes(sel);
      let btn;
      if (S.outfit === sel) btn = `<button class="btn jua" disabled>입는 중</button>`;
      else if (owned) btn = `<button class="btn pri jua" data-act="wear">입기</button>`;
      else btn = `<button class="btn pri jua" data-act="buy" ${S.gold < o.price ? 'disabled' : ''}>사기 (${o.price}G)</button>`;
      openModal(`<h3><span class="ic">👗</span>옷가게 <span style="font-size:24px;margin-left:auto">💰 ${Math.floor(S.gold).toLocaleString()}G</span></h3>
        <div class="shop">${shopList.map(x => `<div class="ocard${x.id === sel ? ' sel' : ''}" data-o="${x.id}">
          ${S.outfit === x.id ? '<span class="tag wear">입는 중</span>' : S.owned.includes(x.id) ? '<span class="tag">보유</span>' : ''}
          <div class="pv">${Art.girl({ stage: Logic.stage(S), outfit: x.id, expr: 'normal', hair: hairCol(S.hair) })}</div>
          <div class="nm jua">${x.name}</div><div class="pr">${x.price ? x.price + 'G' : '기본'}</div></div>`).join('')}</div>
        <div class="shopinfo"><div class="d"><b class="jua">${o.name}</b> — ${o.desc}</div>${btn}<button class="btn jua" data-act="close">닫기</button></div>`, 'wide');
    };
    await new Promise(res => {
      const handler = e => {
        const card = e.target.closest('[data-o]');
        if (card) { sel = card.dataset.o; Sound.play('click'); draw(); return; }
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        if (b.dataset.act === 'close') { closeModal(); res(); return; }
        if (b.dataset.act === 'buy') {
          const o = OUTFIT[sel];
          if (S.gold < o.price) return;
          S.gold -= o.price; S.owned.push(sel); S.outfit = sel;
          Sound.play('buy'); toast(F(`{n}{이} ${Logic.josa(o.name, '을')} 입고 빙글 돌았어!`));
        } else if (b.dataset.act === 'wear') { S.outfit = sel; Sound.play('select'); }
        renderAll(); renderGirl('happy'); bounce(); save(); draw();
      };
      const d0 = draw;
      draw = () => { d0(); $('modal').onclick = handler; };
      draw();
    });
    renderAll();
  }

  // ---------- 도감 ----------
  async function openCodex() {
    if (busy) return;
    const seen = Object.keys(meta.endings).length;
    const info = e => {
      const got = meta.endings[e.id];

      return `<b class="jua" style="font-size:26px">${e.icon} ${e.name}</b> ${got ? `<span class="up">✔ 달성 (${got.count}번)</span>` : '<span style="color:#8a7c99">미달성</span>'}
        ${pg !== null && e.id !== 'villager' ? `<span style="float:right;color:#7a6cf0">지금 ${S.name}: ${pg}%</span>` : ''}<br>힌트: ${e.hint}`;
    };
    openModal(`<h3><span class="ic">📖</span>엔딩 도감 <span style="font-size:26px;color:#7a6cf0">${seen} / ${ENDINGS.length}</span><button class="btn small jua x" data-act="close">닫기</button></h3>
      <div class="codex">${ENDINGS.map(e => {
        const got = meta.endings[e.id];
        const pg = S && e.id !== 'villager' ? Math.round(Logic.reqProgress(S, e.req) * 100) : null;
        return `<div class="ecard ${got ? 'got' : 'lock'}" data-e="${e.id}"><span class="ic">${e.icon}</span><span class="nm">${e.name}</span>${pg !== null ? `<div class="pg"><i style="width:${pg}%"></i></div>` : ''}</div>`;
      }).join('')}</div>
      <div class="cinfo" id="cInfo">카드 위에 마우스를 올리면 힌트가 보여. ${S ? '보라색 막대는 지금 딸이 그 엔딩에 얼마나 가까운지야.' : ''}</div>`, 'wide');
    const m = $('modal');
    m.onmouseover = e => { const c = e.target.closest('[data-e]'); if (c) $('cInfo').innerHTML = info(ENDING[c.dataset.e]); };
    await new Promise(res => {
      m.onclick = e => {
        const c = e.target.closest('[data-e]');
        if (c) { $('cInfo').innerHTML = info(ENDING[c.dataset.e]); Sound.play('click'); return; }
        const b = e.target.closest('[data-act]');
        if (b) { m.onmouseover = null; closeModal(); res(); }
      };
    });
  }

  // ---------- 설정 ----------
  async function openSettings(fromTitle) {
    if (busy) return;
    const st = meta.settings;
    const seg = (key, opts) => `<div class="seg">${opts.map(([v, t]) => `<button class="btn jua${st[key] === v ? ' on' : ''}" data-k="${key}" data-val="${v}">${t}</button>`).join('')}</div>`;
    let draw = () => openModal(`<h3><span class="ic">⚙️</span>설정</h3>
      <div class="setrow"><b>연출 속도</b>${seg('speed', [[1, '보통'], [0.55, '빠름'], [0.3, '아주 빠름']])}</div>
      <div class="setrow"><b>효과음</b>${seg('sfx', [[0, '끄기'], [0.6, '작게'], [1, '보통'], [1.6, '크게']])}</div>
      <div class="setrow"><b>배경 음악</b>${seg('bgm', [[0, '끄기'], [0.3, '작게'], [0.5, '보통'], [0.9, '크게']])}</div>
      <p style="font-size:20px;color:#6b5d7a">보통 속도로 한 번 키우는 데 1시간쯤 걸려. 두 번째부터는 '빠름'도 좋아.<br>게임은 매달 자동으로 저장돼.</p>
      <div class="btns">
        <button class="btn jua" data-act="full">전체 화면</button>
        ${fromTitle ? '' : '<button class="btn jua" data-act="title">타이틀로 (저장됨)</button>'}
        <button class="btn pri jua" data-act="close">닫기</button>
      </div>`);
    await new Promise(res => {
      const handler = e => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.k) {
          st[b.dataset.k] = +b.dataset.val;
          applySettings(); saveMeta(); Sound.play('select'); draw(); return;
        }
        if (b.dataset.act === 'full') { fullscreen(); return; }
        if (b.dataset.act === 'title') { save(); closeModal(); res(); toTitle(); return; }
        if (b.dataset.act === 'close') { closeModal(); res(); }
      };
      const d0 = draw;
      draw = () => { d0(); $('modal').onclick = handler; };
      draw();
    });
  }
  function applySettings() {
    Sound.setSfx(meta.settings.sfx);
    Sound.setBgm(meta.settings.bgm);
    Sound.setBgmOn(meta.settings.bgm > 0);
  }

  // ---------- 엔딩 ----------
  async function startEnding() {
    const e = Logic.decideEnding(S);
    const isNew = !meta.endings[e.id];
    meta.endings[e.id] = { count: (meta.endings[e.id] ? meta.endings[e.id].count : 0) + 1, name: S.name };
    const kept = new Set(meta.keptOutfits);
    S.owned.forEach(o => { if (o !== 'basic' && !OUTFIT[o].hidden) kept.add(o); });
    meta.keptOutfits = Array.from(kept);
    saveMeta();
    store.del(SAVE_KEY);
    closeModal();
    show('ending');
    Sound.setBgmOn(false);
    const bg = $('eBg'), intro = $('eIntro'), pic = $('ePic'), txt = $('eTxt');
    bg.style.background = '#0d1030';
    pic.style.opacity = 0; txt.style.opacity = 0; pic.innerHTML = ''; txt.innerHTML = '';
    intro.style.opacity = 1;
    const lines = ['그리고 8년이 흘렀어…', F('오늘은 {n}의 열여덟 번째 생일.'), F('{n}{은} 어떤 어른이 되었을까?')];
    for (const l of lines) {
      intro.style.opacity = 0; await sleep(500);
      intro.textContent = l; intro.style.opacity = 1;
      Sound.play('tick');
      await sleep(2200);
    }
    intro.style.opacity = 0;
    await sleep(700);
    bg.style.background = `radial-gradient(ellipse at 30% 40%, ${Art.shade(e.bg, 0.25)}, ${e.bg} 60%, ${Art.shade(e.bg, -0.45)})`;
    pic.innerHTML = Art.girl({ stage: 2, outfit: e.outfit, expr: 'happy', hair: hairCol(S.hair), acc: e.acc });
    const no = ENDINGS.indexOf(e) + 1;
    const t = S.st;
    txt.innerHTML = `<div class="no">엔딩 ${no} / ${ENDINGS.length}${isNew ? '<span class="new">NEW!</span>' : ''}</div>
      <h2 class="jua">${e.icon} ${e.name}</h2>
      <p>${F(e.text)}</p>
      <div class="final">${STATS.map(s => `<div>${s.n} <b>${Math.floor(t[s.k])}</b></div>`).join('')}
        <div>돈 <b>${Math.floor(S.gold)}G</b></div><div>평판 <b>${Math.floor(S.fame)}</b></div><div>우승 <b>${S.wins.martial + S.wins.beauty + S.wins.cook + S.wins.magic}회</b></div><div>여행 <b>${S.cnt.travel}번</b></div><div>가출 <b>${S.runaways}번</b></div></div>
      <div class="btns">
        <button class="btn pri jua" data-end="again">같은 이름으로 다시 키우기</button>
        <button class="btn jua" data-end="new">새 이름으로</button>
        <button class="btn jua" data-end="codex">엔딩 도감</button>
        <button class="btn jua" data-end="title">타이틀로</button>
      </div>`;
    pic.style.opacity = 1; txt.style.opacity = 1;
    Sound.play('ending');
    setTimeout(() => { applySettings(); Sound.setSong('home'); }, 2500);
  }
  function onEndingBtn(v) {
    const name = meta.lastName;
    if (S) setupHair = S.hair;
    if (v === 'again') {
      S = null;
      $('nameInput').value = name;
      startNewWith(name);
    } else if (v === 'new') { S = null; toSetup(''); }
    else if (v === 'codex') { const keep = S; S = null; openCodex().then(() => { S = keep; }); }
    else { toTitle(); }
  }
  function startNewWith(name) {
    $('nameInput').value = name;
    startNew();
  }

  // ---------- 입력 ----------
  function bind() {
    $('tContinue').onclick = () => { Sound.play('click'); continueGame(); };
    $('tNew').onclick = () => {
      Sound.play('click');
      if (load()) {
        choose(`<h3><span class="ic">⚠️</span>새로 키울까?</h3><p>지금 키우던 딸의 저장이 사라져. (엔딩 도감은 그대로야)</p>
          <div class="btns"><button class="btn pri jua" data-v="y">새로 키울래</button><button class="btn jua" data-v="n">그만둘래</button></div>`)
          .then(v => { closeModal(); if (v === 'y') { store.del(SAVE_KEY); toSetup(''); } });
      } else toSetup('');
    };
    $('tCodex').onclick = () => { Sound.play('click'); openCodex(); };
    $('tSettings').onclick = () => { Sound.play('click'); openSettings(true); };
    $('tFull').onclick = () => { Sound.play('click'); fullscreen(); };
    $('nameChips').onclick = e => { const c = e.target.closest('[data-name]'); if (c) { $('nameInput').value = c.dataset.name; Sound.play('select'); } };
    $('hairChips').onclick = e => { const c = e.target.closest('[data-hair]'); if (c) { setupHair = c.dataset.hair; Sound.play('select'); updateSetupPreview(); } };
    $('setupGo').onclick = startNew;
    $('setupBack').onclick = () => { Sound.play('cancel'); toTitle(); };
    $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startNew(); } });
    $('acts').onclick = e => { const a = e.target.closest('[data-act]'); if (a) onActClick(a.dataset.act); };
    $('acts').onmouseover = e => {
      const a = e.target.closest('[data-act]');
      if (!a || busy || !S) return;
      renderStats(ACT[a.dataset.act].gain);
    };
    $('acts').onmouseleave = () => { if (S && !busy) renderStats(); };
    document.querySelectorAll('#sched .slot').forEach(el => { el.onclick = () => onSlotClick(+el.dataset.slot); });
    $('repeatBtn').onclick = onRepeat;
    $('startBtn').onclick = runMonth;
    $('run').onclick = () => { if (busy) skip = true; };
    $('hShop').onclick = () => { Sound.play('click'); openShop(); };
    $('hCodex').onclick = () => { Sound.play('click'); openCodex(); };
    $('hSet').onclick = () => { Sound.play('click'); openSettings(false); };
    $('hFull').onclick = () => { Sound.play('click'); fullscreen(); };
    $('eTxt').onclick = e => { const b = e.target.closest('[data-end]'); if (b) { Sound.play('click'); onEndingBtn(b.dataset.end); } };

    // 스페이스바 = 마우스 좌클릭
    document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    document.addEventListener('keydown', e => {
      Sound.init();
      if (e.code !== 'Space' && e.key !== ' ') return;
      const ae = document.activeElement;
      if (ae && ae.tagName === 'INPUT') return;
      e.preventDefault();
      if (e.repeat || mouse.x < 0) return;
      const el = document.elementFromPoint(mouse.x, mouse.y);
      if (el) el.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: mouse.x, clientY: mouse.y }));
    });
    document.addEventListener('keyup', e => { if (e.code === 'Space' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) e.preventDefault(); });
    document.addEventListener('pointerdown', () => Sound.init());
    // 버튼에 포커스가 남아 스페이스로 두 번 눌리는 것 방지
    document.addEventListener('click', () => { const a = document.activeElement; if (a && a.tagName === 'BUTTON') a.blur(); });
    addEventListener('resize', fit);
    document.addEventListener('fullscreenchange', fit);
  }

  // ---------- 시작 ----------
  initStars();
  bind();
  fit();
  applySettings();
  toTitle();
  window.__game = { get S() { return S; }, set S(v) { S = v; }, meta: () => meta, renderAll, beginMonth, Logic };
})();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>별빛 딸 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3b2f4a; --ink2: #6b5d7a; --paper: #fff9ef; --paper2: #f7ead6; --line: #e2cfb2;
  --accent: #e86a92; --accent2: #7a6cf0; --gold: #e0a92e; --good: #2f9e6e; --bad: #d4495b;
  --night1: #141a3d; --night2: #2b2466;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1030; }
body { font-family: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; }
.jua { font-family: 'Jua', 'Gowun Dodum', 'Malgun Gothic', sans-serif; }

#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden;
  background: radial-gradient(ellipse at 30% 10%, #3a3384 0%, var(--night2) 35%, var(--night1) 100%); }
#stars { position: absolute; inset: 0; pointer-events: none; }
#stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: block; }

.btn { border: 3px solid #c99a6b; background: linear-gradient(#fffaf0, #f6e4c8); border-radius: 16px; padding: 10px 22px; font-size: 24px; cursor: pointer;
  box-shadow: 0 4px 0 #b88a5a; transition: transform .08s, filter .1s; }
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b88a5a; }
.btn.pri { background: linear-gradient(#ff9fbd, #e86a92); border-color: #c24a72; color: #fff; box-shadow: 0 4px 0 #a83a5f; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.btn.vio { background: linear-gradient(#a99cff, #7a6cf0); border-color: #5a4cc8; color: #fff; box-shadow: 0 4px 0 #4a3cb0; }
.btn:disabled, .btn.off { filter: grayscale(.8) opacity(.55); cursor: default; transform: none; }
.btn.small { font-size: 20px; padding: 6px 14px; border-radius: 12px; }

/* ---------- 타이틀 ---------- */
#title .logo { position: absolute; left: 90px; top: 110px; color: #fff; }
#title .logo h1 { margin: 0; font-size: 92px; letter-spacing: 4px; text-shadow: 0 0 24px #b9a8ff, 0 6px 0 #4a3cb0; }
#title .logo p { margin: 10px 0 0 6px; font-size: 28px; color: #e6defa; }
#title .menu { position: absolute; left: 100px; top: 300px; display: flex; flex-direction: column; gap: 12px; width: 360px; }
#title .menu .btn { font-size: 28px; padding: 9px 24px; }
#title .info { position: absolute; left: 100px; bottom: 24px; color: #cfc6f0; font-size: 22px; }
#title .pic { position: absolute; right: 90px; top: 50px; width: 440px; height: 640px; }
#title .pic svg { width: 100%; height: 100%; filter: drop-shadow(0 0 30px rgba(190,170,255,.5)); }

/* ---------- 새로 시작 ---------- */
#setup .panel { position: absolute; left: 60px; top: 40px; width: 740px; height: 640px; background: var(--paper); border: 4px solid var(--line); border-radius: 26px; padding: 24px 36px; }
#setup h2 { margin: 0 0 6px; font-size: 38px; }
#setup .lbl { font-size: 23px; margin: 12px 0 8px; }
#nameInput { font-family: inherit; font-size: 30px; padding: 6px 16px; width: 340px; border: 3px solid #c99a6b; border-radius: 14px; background: #fff; color: var(--ink); outline: none; }
#nameInput:focus { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-size: 21px; padding: 4px 13px; border-radius: 999px; border: 2px solid #d8c09c; background: #fff; cursor: pointer; }
.chip:hover { background: #fff1e0; }
.swatch { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 3px #d8c09c; cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 5px var(--accent); }
#setup .preview { position: absolute; right: 80px; top: 60px; width: 380px; height: 560px; border-radius: 26px; overflow: hidden; border: 4px solid var(--line); background: #fdf1dc; }
#setup .preview > div { position: absolute; inset: 0; }
#setup .preview svg { width: 100%; height: 100%; }
#setup .bonus { font-size: 20px; color: var(--accent2); margin-top: 10px; min-height: 26px; }
.chip.on { background: var(--accent); color: #fff; border-color: #c24a72; }
#setup .go { position: absolute; left: 36px; bottom: 22px; display: flex; gap: 14px; }

/* ---------- 메인 ---------- */
#hud { position: absolute; left: 0; top: 0; right: 0; height: 66px; display: flex; align-items: center; gap: 16px; padding: 0 18px; color: #fff; }
#hud .date { font-size: 29px; text-shadow: 0 2px 0 rgba(0,0,0,.3); min-width: 280px; }
#hud .gold { font-size: 27px; background: rgba(255,255,255,.12); padding: 4px 16px; border-radius: 999px; min-width: 170px; text-align: center; }
#hud .sp { flex: 1; }
#hud { gap: 10px; }
#hud .btn { font-size: 20px; padding: 6px 12px; position: relative; }
#hud .btn.dot::after { content: ''; position: absolute; right: -3px; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: #ff5a7a; border: 2px solid #fff; }

.card { position: absolute; background: var(--paper); border: 4px solid var(--line); border-radius: 22px; }
#pcard { left: 14px; top: 76px; width: 384px; height: 630px; overflow: hidden; padding: 0; }
#pcard .room, #pcard .girl { position: absolute; left: 0; top: 0; width: 376px; height: 420px; }
#pcard .room svg, #pcard .girl svg { width: 100%; height: 100%; }
#pcard .girl { transition: transform .3s; }
#pcard .girl.bounce { animation: bounce .5s; }
@keyframes bounce { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-14px) } }
#bubble { position: absolute; left: 14px; top: 12px; max-width: 250px; background: #fff; border: 3px solid #d8c09c; border-radius: 18px; padding: 8px 14px; font-size: 20px; line-height: 1.35; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
#bubble:empty { display: none; }
#pinfo { position: absolute; left: 0; right: 0; top: 420px; bottom: 0; padding: 6px 18px; background: var(--paper); border-top: 3px solid var(--line); }
#pinfo .nm { font-size: 30px; }
#pinfo .ttl { font-size: 18px; color: var(--accent2); margin-left: 8px; }
.meter { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 21px; }
.meter.aff b { width: auto; }
.hearts { color: #e8507a; font-size: 24px; letter-spacing: 2px; }
.meter b { width: 82px; font-weight: normal; }
.meter .bar { flex: 1; height: 20px; background: #eadcc6; border-radius: 10px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 10px; transition: width .5s; }
.meter span { width: 48px; text-align: right; }

#stats { left: 410px; top: 76px; width: 370px; height: 470px; padding: 12px 16px; }
.srow { display: flex; align-items: center; height: 43px; gap: 8px; font-size: 22px; border-radius: 10px; padding: 0 4px; transition: background .3s; }
.srow b { width: 50px; font-weight: normal; }
.srow .arrow { width: 26px; text-align: center; font-size: 18px; }
.srow .bar { flex: 1; height: 18px; background: #eadcc6; border-radius: 9px; overflow: hidden; }
.srow .bar i { display: block; height: 100%; border-radius: 9px; transition: width .6s; }
.srow span { width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
.srow.flash { background: #fff1b8; }
.up { color: var(--good); } .down { color: var(--bad); }

#acts { left: 792px; top: 76px; width: 476px; height: 470px; padding: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 61px; gap: 4px 6px; }
.act { position: relative; display: flex; align-items: center; gap: 8px; border-radius: 14px; border: 3px solid transparent; padding: 2px 10px; cursor: pointer; text-align: left; font-size: 22px; }
.act.lesson { background: #eef0ff; border-color: #c9cdf5; }
.act.job { background: #eaf7ee; border-color: #b9e0c5; }
.act.rest, .act.travel { background: #fff0f3; border-color: #f2c4d0; }
.act:hover { filter: brightness(1.04); border-color: var(--accent); }
.act .ic { font-size: 30px; width: 38px; text-align: center; line-height: 1; display: flex; flex-direction: column; align-items: center; }
.act .tx { flex: 1; line-height: 1.15; min-width: 0; }
.act .r1 { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; font-size: 21px; }
.act .tx small { display: block; font-size: 16px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.act .lv { font-size: 10px; color: #c99a2e; letter-spacing: -1px; margin-top: 3px; }
.act .money { font-size: 17px; }
.act.dis { filter: grayscale(.9) opacity(.5); cursor: default; }

#sched { left: 410px; top: 556px; width: 858px; height: 150px; padding: 8px 10px; display: flex; gap: 10px; align-items: stretch; }
.slot { width: 160px; border: 3px dashed #d8c09c; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: #fffdf8; position: relative; }
.slot .when { position: absolute; top: 4px; left: 10px; font-size: 18px; color: var(--ink2); }
.slot .ic { font-size: 42px; margin-top: 12px; }
.slot .nm { font-size: 22px; }
.slot.filled { border-style: solid; border-color: var(--accent); background: #fff3f7; }
.slot.empty .nm { color: #b8a58a; font-size: 19px; }
.slot.next { box-shadow: 0 0 0 3px #ffd2e0 inset; }
#sched .side { flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
#sched .side .sum { font-size: 19px; color: var(--ink2); text-align: center; }
#repeatBtn { font-size: 18px; padding: 3px 10px; box-shadow: 0 3px 0 #b88a5a; }
#startBtn { font-size: 27px; padding: 7px 10px; }

/* 진행 화면 */
#run { position: absolute; left: 410px; top: 76px; width: 858px; height: 630px; display: none; background: var(--paper); border: 4px solid var(--line); border-radius: 22px; overflow: hidden; }
#run.on { display: block; }
#run .head { height: 70px; display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 30px; background: var(--paper2); border-bottom: 3px solid var(--line); }
#run .head .steps { margin-left: auto; display: flex; gap: 8px; }
#run .head .steps i { width: 22px; height: 22px; border-radius: 50%; background: #e2d2b8; display: block; }
#run .head .steps i.on { background: var(--accent); }
#run .head .steps i.done { background: var(--good); }
#run .scene { position: absolute; left: 0; right: 0; top: 70px; height: 300px; overflow: hidden; border-bottom: 3px solid var(--line); }
#run .scene > svg { width: 100%; height: 100%; display: block; }
.nbub { position: absolute; right: 16px; top: 80px; max-width: 330px; background: #fff; border: 3px solid #d8c09c; border-radius: 16px; padding: 8px 14px; font-size: 20px; line-height: 1.35; opacity: 0; transform: translateY(8px); transition: all .3s; pointer-events: none; }
.nbub.on { opacity: 1; transform: none; }
.nbub b { color: var(--accent2); margin-right: 4px; }
/* 장면 움직임 */
.pose-swing { animation: pSwing 0.8s infinite ease-in-out; }
.pose-bob { animation: pBob 0.9s infinite ease-in-out; }
.pose-nod { animation: pNod 1.6s infinite ease-in-out; }
.pose-sway { animation: pSway 1.8s infinite ease-in-out; }
.pose-walk { animation: pWalk 0.7s infinite ease-in-out; }
.pose-breathe { animation: pBreathe 2.4s infinite ease-in-out; }
@keyframes pSwing { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) translateY(-6px) } }
@keyframes pBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
@keyframes pNod { 0%,100% { transform: rotate(0) } 50% { transform: rotate(2deg) translateY(3px) } }
@keyframes pSway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
@keyframes pWalk { 0%,100% { transform: translateY(0) rotate(-2deg) } 50% { transform: translateY(-8px) rotate(2deg) } }
@keyframes pBreathe { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(1.02) } }
.npc-in { animation: npcIn .5s; }
@keyframes npcIn { from { opacity: 0; transform: translateX(30px) } to { opacity: 1; transform: none } }
svg .float { animation: fl 1.8s infinite ease-in-out; }
@keyframes fl { 0% { transform: translateY(0); opacity: 0 } 30% { opacity: 1 } 100% { transform: translateY(-50px); opacity: 0 } }
svg .glow { animation: glow 1.6s infinite ease-in-out; }
@keyframes glow { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
svg .tw { animation: twinkle 3s infinite ease-in-out; }
svg .ember { animation: ember 3s infinite linear; }
@keyframes ember { 0% { transform: translateY(0); opacity: 1 } 100% { transform: translateY(-120px); opacity: 0 } }
svg .drift { animation: drift 8s infinite ease-in-out; }
@keyframes drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(40px) } }
svg .clash { animation: clash .6s infinite; transform-origin: 425px 130px; }
@keyframes clash { 0%,100% { transform: scale(.8); opacity: .6 } 50% { transform: scale(1.2); opacity: 1 } }
svg .card { animation: cardUp 1.2s infinite alternate; }
@keyframes cardUp { from { transform: translateY(10px) } to { transform: translateY(0) } }
svg .firework { animation: fw 1.4s infinite ease-out; }
@keyframes fw { 0% { transform: scale(.1); opacity: 1 } 80% { opacity: 1 } 100% { transform: scale(1.4); opacity: 0 } }
#run .days { position: absolute; left: 0; right: 0; top: 384px; display: flex; justify-content: center; gap: 10px; }
#run .days i { width: 30px; height: 30px; border-radius: 8px; background: #eadcc6; display: block; transition: background .15s, transform .15s; }
#run .days i.on { background: #f5b13d; transform: scale(1.1); }
#run .line { position: absolute; left: 0; right: 0; top: 426px; text-align: center; font-size: 28px; min-height: 40px; }
#run .result { position: absolute; left: 0; right: 0; top: 470px; text-align: center; }
#run .result .kind { font-size: 40px; display: inline-block; }
#run .result .kind.great { color: #e0702e; animation: pop .4s; }
#run .result .kind.ok { color: var(--good); animation: pop .4s; }
#run .result .kind.fail { color: var(--bad); animation: pop .4s; }
#run .result .kind.sick { color: #7a6cf0; animation: pop .4s; }
@keyframes pop { 0% { transform: scale(.4) } 70% { transform: scale(1.15) } 100% { transform: scale(1) } }
.chgs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.chg { font-size: 22px; padding: 3px 12px; border-radius: 999px; background: #fff; border: 2px solid #e2d2b8; }
.chg.up { border-color: #9fd8b9; } .chg.down { border-color: #f0b0b8; }
#run .skip { position: absolute; right: 16px; bottom: 10px; font-size: 17px; color: var(--ink2); }
#run .summary { position: absolute; inset: 70px 0 0 0; background: var(--paper); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 28px; }
#run .summary.on { display: flex; }

/* ---------- 모달 ---------- */
#modalWrap { position: absolute; inset: 0; background: rgba(10,8,30,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
#modalWrap.on { display: flex; }
.modal { background: var(--paper); border: 5px solid var(--line); border-radius: 26px; padding: 22px 34px; min-width: 560px; max-width: 1180px; max-height: 690px; box-shadow: 0 16px 50px rgba(0,0,0,.45); position: relative; animation: mIn .22s; }
@keyframes mIn { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.modal h3 { margin: 0 0 12px; font-size: 36px; display: flex; align-items: center; gap: 12px; }
.modal h3 .ic { font-size: 50px; }
.modal p { font-size: 26px; line-height: 1.5; margin: 8px 0; }
.modal .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; justify-content: center; }
.modal .btns .btn { min-width: 170px; }
.modal .x { position: absolute; right: 16px; top: 12px; }

/* 생일 선물 */
.gifts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 12px; }
.gift { border: 3px solid #e2d2b8; border-radius: 18px; background: #fff; padding: 12px; text-align: center; cursor: pointer; font-size: 22px; }
.gift:hover { border-color: var(--accent); background: #fff3f7; }
.gift .ic { font-size: 56px; display: block; }
.gift small { display: block; color: var(--ink2); font-size: 18px; margin-top: 4px; }

/* 옷가게 */
.shop { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; width: 1100px; }
.ocard { border: 3px solid #e2d2b8; border-radius: 16px; background: #fff; cursor: pointer; position: relative; overflow: hidden; height: 232px; }
.ocard:hover { border-color: #f0a0bc; }
.ocard.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #ffd2e0; }
.ocard .pv { height: 160px; background: #fdf1dc; }
.ocard .pv svg { width: 100%; height: 100%; }
.ocard .nm { font-size: 18px; white-space: nowrap; text-align: center; margin-top: 4px; }
.ocard .pr { font-size: 19px; text-align: center; color: var(--gold); }
.ocard .tag { position: absolute; left: 8px; top: 8px; font-size: 16px; background: var(--good); color: #fff; padding: 2px 10px; border-radius: 999px; }
.ocard .tag.wear { background: var(--accent); }
.shopinfo { display: flex; align-items: center; gap: 16px; margin-top: 14px; font-size: 23px; min-height: 60px; }
.shopinfo .d { flex: 1; }

/* 도감 */
.codex { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 1100px; }
.ecard { border: 3px solid #e2d2b8; border-radius: 14px; background: #fff; padding: 4px 8px; height: 70px; display: flex; align-items: center; gap: 8px; cursor: default; position: relative; }
.ecard .ic { font-size: 30px; }
.ecard .nm { font-size: 18px; line-height: 1.15; word-break: keep-all; }
.ecard.lock { background: #f1ebe2; }
.ecard.lock .ic { filter: grayscale(1) opacity(.45); }
.ecard.got { border-color: #f0a0bc; background: #fff6f9; }
.ecard .pg { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 6px; background: #eadcc6; border-radius: 3px; overflow: hidden; }
.ecard .pg i { display: block; height: 100%; background: var(--accent2); }
.ecard:hover { border-color: var(--accent2); }
.rqs { font-size: 19px; margin-top: 4px; color: var(--ink2); }
.cpic { float: left; width: 74px; height: 104px; margin: -6px 12px 0 -6px; }
.cpic svg { width: 100%; height: 100%; }
#ending .missed { font-size: 19px; color: #ffe2a8; margin-top: 6px; }
.rq.ok { color: var(--good); }
.rq.no { color: var(--bad); }
.rq small { font-size: 15px; color: var(--ink2); }
.cinfo { margin-top: 10px; font-size: 21px; min-height: 96px; background: #fff; border-radius: 14px; padding: 10px 16px; border: 2px dashed #e2d2b8; }

/* 설정 */
.setrow { display: flex; align-items: center; gap: 12px; font-size: 25px; margin: 12px 0; }
.setrow b { width: 150px; font-weight: normal; }
.seg { display: flex; gap: 6px; }
.seg .btn { font-size: 21px; padding: 6px 16px; }
.seg .btn.on { background: linear-gradient(#ff9fbd, #e86a92); color: #fff; border-color: #c24a72; }

/* 축제 */
.fest { display: grid; grid-template-columns: repeat(4, 240px); gap: 14px; margin-top: 8px; }
.fcard { border: 3px solid #e2d2b8; border-radius: 18px; background: #fff; padding: 14px; text-align: center; cursor: pointer; }
.fcard:hover { border-color: var(--accent); background: #fff3f7; }
.fcard .ic { font-size: 60px; }
.fcard .nm { font-size: 26px; }
.fcard small { display: block; font-size: 18px; color: var(--ink2); }
.fcard .chance { font-size: 21px; margin-top: 6px; }
.match { width: 900px; }
.vs { display: flex; align-items: center; gap: 18px; margin: 18px 0; font-size: 26px; }
.vs .who { width: 250px; }
.vs .bar { flex: 1; height: 34px; background: #eadcc6; border-radius: 17px; overflow: hidden; }
.vs .bar i { display: block; height: 100%; width: 0; border-radius: 17px; transition: width 1.4s ease-out; }
.vs .sc { width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
.rlabel { font-size: 32px; text-align: center; }
.rres { font-size: 40px; text-align: center; min-height: 54px; }

/* 엔딩 */
#ending { z-index: 40; }
#ending .bgc { position: absolute; inset: 0; transition: background 1s; }
#ending .pic { position: absolute; left: 70px; top: 40px; width: 430px; height: 640px; opacity: 0; transition: opacity 1.2s; }
#ending .pic svg { width: 100%; height: 100%; filter: drop-shadow(0 0 28px rgba(255,240,200,.45)); }
#ending .txt { position: absolute; left: 530px; top: 34px; width: 720px; color: #fff; opacity: 0; transition: opacity 1.2s; }
#ending .txt .no { font-size: 24px; color: #ffe2a8; }
#ending .txt h2 { margin: 4px 0 10px; font-size: 56px; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
#ending .txt p { font-size: 25px; line-height: 1.55; margin: 8px 0; }
#ending .txt .new { display: inline-block; background: #ffcf4a; color: #5a3a00; font-size: 22px; padding: 2px 14px; border-radius: 999px; margin-left: 12px; vertical-align: middle; }

// ===== 게임 규칙 (화면과 분리: 시뮬레이션에서도 그대로 씀) =====
const Logic = (() => {
  let rng = Math.random;
  const setRng = f => { rng = f; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[Math.floor(rng() * arr.length)];

  const TOTAL_MONTHS = 96;
  const STIPEND = 60;   // 10살 기준, 해마다 +10
  const stipendOf = s => STIPEND + (age(s) - 10) * 10;
  const GAIN = 0.4;   // 수업·일 능력치 상승 배율
  const AFF_SOFT = 150;   // 사이가 높을수록 덜 오름
  const AFF_DRIFT = 1.5;  // 사이가 좋을 때(50 넘게) 딸과 시간을 안 보낸 달에 식는 만큼
  const age = s => 10 + Math.floor(s.m / 12);
  const calMonth = s => (2 + s.m) % 12;           // 0 = 1월
  const yearNo = s => Math.floor(s.m / 12) + 1;   // n년째
  const isBirthday = s => s.m > 0 && s.m % 12 === 0;
  const isFestival = s => s.m % 12 === 7;          // 10월

  // ----- 한국어 조사 -----
  function hasBatchim(word) {
    const ch = word.charCodeAt(word.length - 1);
    if (ch < 0xac00 || ch > 0xd7a3) return false;
    return (ch - 0xac00) % 28 !== 0;
  }
  const JOSA = { '은': ['은', '는'], '이': ['이', '가'], '을': ['을', '를'], '과': ['과', '와'], '아': ['아', '야'], '도': ['도', '도'], '이라': ['이라', '라'] };
  const josa = (word, j) => word + JOSA[j][hasBatchim(word) ? 0 : 1];
  function fmt(text, s) {
    const n = s.name;
    const b = hasBatchim(n);
    return text.replace(/\{n\}\{(이라|은|이|을|과|아|도)\}/g, (_, j) => n + JOSA[j][b ? 0 : 1]).replace(/\{n\}/g, () => n);
  }

  // ----- 새 게임 -----
  function newGame(name, hair, meta, hairStyle) {
    meta = meta || {};
    const r = () => Math.floor(rng() * 7) - 3;
    const s = {
      v: 2, name, hair, hairStyle: hairStyle || 'long', m: 0, aff: 30,
      st: { hp: 30 + r(), str: 15 + r(), int: 20 + r(), ele: 20 + r(), cha: 25 + r(), sen: 20 + r(), mag: 5 + r(), mor: 40 + r(), cook: 5 + r(), swd: 5 + r() },
      stress: 0, fame: 0,
      gold: 500 + newGamePlusGold(meta),
      outfit: 'basic',
      owned: Array.from(new Set(['basic', ...(meta.keptOutfits || [])])),
      wear: null, ownedAcc: Array.from(new Set(meta.keptAcc || [])), talkedM: -1,
      cnt: {}, flags: {}, wins: { martial: 0, beauty: 0, cook: 0, magic: 0 },
      titles: [], seen: {}, sched: [null, null, null], lastSched: null,
      sick: 0, runaways: 0, runaway: false, contestLog: [],
    };
    for (const a of ACTS) s.cnt[a.id] = 0;
    return s;
  }
  function newGamePlusGold(meta) {
    const n = Object.keys(meta.endings || {}).length;
    return Math.min(1000, n * 50);
  }

  // ----- 수업 단계 · 일 숙련도 (같은 기준) -----
  function lessonLv(s, id) {
    const c = s.cnt[id] || 0;
    let lv = 1;
    for (let i = 0; i < LESSON_LV.length; i++) if (c >= LESSON_LV[i]) lv = i + 1;
    return lv;
  }
  const lvMult = lv => 1 + (lv - 1) * 0.12;
  const costOf = (s, a) => Math.round((a.cost || 0) * (a.type === 'lesson' ? 1 + (lessonLv(s, a.id) - 1) * 0.15 : 1));

  const jobPayMult = lv => 1 + (lv - 1) * 0.08;
  function payOf(s, a) { return Math.round(a.pay * (1 + (age(s) - 10) * 0.12) * jobPayMult(lessonLv(s, a.id))); }

  function actState(s, a, plannedCost) {
    if (a.minAge && age(s) < a.minAge) return { ok: false, why: `${a.minAge}살부터` };
    if (a.req) for (const k in a.req) if (s.st[k] < a.req[k]) return { ok: false, why: `${STAT_NAME[k]} ${a.req[k]} 필요` };
    const cost = costOf(s, a);
    if (cost > 0 && s.gold - (plannedCost || 0) < cost) return { ok: false, why: '돈이 모자라' };
    return { ok: true };
  }
  function schedCost(s) {
    return s.sched.reduce((t, id) => t + (id ? costOf(s, ACT[id]) : 0), 0);
  }

  // ----- 옷 · 액세서리 -----
  function gear(s) { return [OUTFIT[s.outfit], s.wear && ACC_ITEM[s.wear]].filter(Boolean); }
  function gearMult(s, id) { let m = 1; for (const g of gear(s)) if (g.act && g.act[id]) m *= g.act[id]; return m; }
  function gearContest(s, id) { let p = 0; for (const g of gear(s)) if (g.contest && g.contest[id]) p += g.contest[id]; return p; }

  // ----- 스탯 적용 -----
  function addStat(s, k, d) {
    if (k === 'gold') { s.gold = Math.max(0, s.gold + d); return; }
    if (k === 'stress') { s.stress = clamp(s.stress + d, 0, 100); return; }
    if (k === 'fame') { s.fame = clamp(s.fame + d, 0, 999); return; }
    if (k === 'aff') { s.aff = clamp(s.aff + (d > 0 ? d * (1 - s.aff / AFF_SOFT) : d), 0, 100); return; }
    if (k in s.st) { s.st[k] = clamp(s.st[k] + d, 0, STAT_MAX); return; }
    s.flags[k] = (s.flags[k] || 0) + d;  // 플래그 (friend, prince 등)
  }
  // 실제로 변한 만큼을 돌려줌 (상한·하한, 사이 완만함 반영)
  function valueOf(s, k) {
    if (k === 'gold' || k === 'stress' || k === 'fame' || k === 'aff') return s[k];
    if (k in s.st) return s.st[k];
    return null;
  }
  function applyFx(s, fx) {
    const out = [];
    for (const k in fx) {
      const before = valueOf(s, k);
      addStat(s, k, fx[k]);
      const after = valueOf(s, k);
      out.push({ k, d: before === null ? fx[k] : Math.round(after - before) });
    }
    return out;
  }

  // ----- 스케줄 한 칸 실행 -----
  function runSlot(s, id) {
    const a = ACT[id];
    const res = { id, kind: 'ok', changes: [], gold: 0, stress: 0, line: pick(a.lines), lvUp: false };

    // 아픔 판정 (스트레스가 높으면)
    if (a.type !== 'rest' && a.type !== 'travel' && s.stress >= 80) {
      const p = clamp((s.stress - 75) / 50 + (s.st.hp < 100 ? 0.1 : 0), 0, 0.65);
      if (rng() < p) {
        res.kind = 'sick';
        const med = Math.min(s.gold, 40);
        s.gold -= med; res.gold = -med;
        addStat(s, 'stress', -25); res.stress = -25;
        addStat(s, 'hp', -3); res.changes.push({ k: 'hp', d: -3 });
        s.sick++;
        res.line = '열이 나서 앓아누웠어… 약값이 들었어.';
        return res;
      }
    }

    // 성공 판정
    const sp = Math.max(0, s.stress - 40) * 0.008;
    let pOk, pGreat;
    if (a.type === 'lesson') { pOk = 0.9 - sp; pGreat = 0.12; }
    else if (a.type === 'job') { const kv = s.st[a.key] || 0; pOk = clamp(0.55 + kv / 400, 0.55, 0.95) - sp; pGreat = 0.08 + Math.min(0.15, kv / 2000); }
    else { pOk = 1; pGreat = 0.15; }
    const roll = rng();
    res.kind = roll < pGreat ? 'great' : roll < pOk ? 'ok' : 'fail';
    if (res.kind === 'fail') res.line = a.lines[a.lines.length - 1];
    const mult = { great: 1.5, ok: 1, fail: 0.35 }[res.kind];

    // 효과 배율: 수업 단계 · 옷
    const leveled = a.type === 'lesson' || a.type === 'job';
    const before = leveled ? lessonLv(s, id) : 0;
    let m = leveled ? lvMult(before) : 1;
    m *= gearMult(s, id);

    for (const k in a.gain) {
      const base = a.gain[k];
      let d;
      if (base > 0) d = Math.max(res.kind === 'fail' ? 0 : 1, Math.round(base * GAIN * m * mult * (0.8 + rng() * 0.4)));
      else { const x = -base * GAIN; d = -(Math.floor(x) + (rng() < x - Math.floor(x) ? 1 : 0)); }  // 평균만큼만 깎임
      if (d !== 0) { addStat(s, k, d); res.changes.push({ k, d }); }
    }

      p.push(`<path d="M${cx - ww},${B.waist - 2} Q${cx - fw * 0.7},${hem - 40} ${cx - fw},${hem} Q${cx},${hem + 12} ${cx + fw},${hem} Q${cx + fw * 0.7},${hem - 40} ${cx + ww},${B.waist - 2}Z" fill="${fill}" stroke="${colD}" stroke-width="2"/>`);
      p.push(`<path d="M${cx - fw + 4},${hem - 6} Q${cx},${hem + 8} ${cx + fw - 4},${hem - 6}" stroke="${acc}" stroke-width="6" fill="none" stroke-linecap="round"/>`);
      p.push(`<path d="M${cx - fw * 0.55},${hem - 30} Q${cx - fw * 0.3},${B.waist + 40} ${cx - ww * 0.4},${B.waist + 4}" stroke="${shade(col, 0.25)}" stroke-width="3" fill="none"/>`);
      p.push(`<path d="M${cx + fw * 0.5},${hem - 26} Q${cx + fw * 0.25},${B.waist + 50} ${cx + ww * 0.5},${B.waist + 6}" stroke="${shade(col, 0.25)}" stroke-width="3" fill="none"/>`);
      if (of.sparkle) for (let i = 0; i < 9; i++) {
        const sx = cx - fw * 0.7 + (i * 37 % (fw * 1.4)), sy = B.waist + 25 + (i * 53 % (hem - B.waist - 40));
        p.push(`<circle cx="${sx}" cy="${sy}" r="2.4" fill="${of.sparkle}"/>`);
      }
      if (of.id === 'rose') for (let i = 0; i < 5; i++) p.push(rosette(cx - fw * 0.8 + i * fw * 0.4, hem - 14, '#ff9ab8'));
      p.push(`<path d="${bodice}" fill="${fill}" stroke="${colD}" stroke-width="2"/>`);
      p.push(`<path d="M${cx - sw + 4},${top + 8} Q${cx},${top + 26} ${cx + sw - 4},${top + 8}" stroke="${acc}" stroke-width="5" fill="none"/>`);
    } else if (st === 'robe' || st === 'coat') {
      const hem = B.foot - (st === 'coat' ? 26 : 6), fw = B.sh * (st === 'coat' ? 0.85 : 0.95);
      if (st === 'coat') {
        p.push(`<rect x="${cx - 24}" y="${hem - 10}" width="16" height="${B.foot - hem + 4}" rx="7" fill="#5a4a5a"/><rect x="${cx + 8}" y="${hem - 10}" width="16" height="${B.foot - hem + 4}" rx="7" fill="#5a4a5a"/>`);
      }
      p.push(`<path d="M${cx - sw},${top + 6} Q${cx},${top - 4} ${cx + sw},${top + 6} L${cx + fw},${hem} Q${cx},${hem + 8} ${cx - fw},${hem}Z" fill="${fill}" stroke="${colD}" stroke-width="2"/>`);
      if (st === 'robe') {
        if (of.sparkle) for (let i = 0; i < 10; i++) p.push(`<circle cx="${cx - fw * 0.7 + (i * 41 % (fw * 1.4))}" cy="${B.waist + 18 + (i * 47 % (hem - B.waist - 30))}" r="2.6" fill="${of.sparkle}"/>`);
        p.push(`<path d="M${cx - fw + 3},${hem - 4} Q${cx},${hem + 6} ${cx + fw - 3},${hem - 4}" stroke="${acc}" stroke-width="7" fill="none"/>`);
        p.push(`<line x1="${cx}" y1="${top + 10}" x2="${cx}" y2="${hem}" stroke="${acc}" stroke-width="5"/>`);
        p.push(`<rect x="${cx - ww - 2}" y="${B.waist - 6}" width="${ww * 2 + 4}" height="9" rx="4" fill="${shade(col, -0.35)}"/>`);
      } else {
        for (let i = 0; i < 4; i++) p.push(`<circle cx="${cx + 8}" cy="${top + 26 + i * 30}" r="5" fill="${acc}"/>`);
        p.push(`<line x1="${cx}" y1="${top + 10}" x2="${cx}" y2="${hem}" stroke="${colD}" stroke-width="3"/>`);
        p.push(`<path d="M${cx - sw - 4},${top + 10} Q${cx},${top + 34} ${cx + sw + 4},${top + 10} Q${cx},${top - 6} ${cx - sw - 4},${top + 10}Z" fill="#fff6ea" stroke="#e8d8c0" stroke-width="2"/>`);
      }
    } else {
      const shortH = st === 'train' || st === 'armor';
      const tutu = st === 'tutu';
      const hem = shortH ? B.waist + (B.hem - B.waist) * 0.55 : tutu ? B.waist + (B.hem - B.waist) * 0.6 : B.hem;
      const fw = B.sh * (shortH ? 0.62 : tutu ? 1.2 : st === 'smock' ? 1.0 : 0.95);
      if (tutu) {
        for (let k = 0; k < 3; k++) {
          const y = hem - k * 10, w = fw - k * 8;
          p.push(`<path d="M${cx - ww},${B.waist - 2} Q${cx - w},${y - 8} ${cx - w},${y} Q${cx},${y + 12} ${cx + w},${y} Q${cx + w},${y - 8} ${cx + ww},${B.waist - 2}Z" fill="${shade(col, k * 0.15)}" stroke="${colD}" stroke-width="1.5" opacity=".95"/>`);
        }
      } else {
        p.push(`<path d="M${cx - ww},${B.waist - 2} Q${cx - fw * 0.8},${hem - 30} ${cx - fw},${hem} Q${cx},${hem + 10} ${cx + fw},${hem} Q${cx + fw * 0.8},${hem - 30} ${cx + ww},${B.waist - 2}Z" fill="${fill}" stroke="${colD}" stroke-width="2"/>`);
        if (!shortH) p.push(`<path d="M${cx - fw + 4},${hem - 3} Q${cx},${hem + 9} ${cx + fw - 4},${hem - 3}" stroke="${shade(col, 0.45)}" stroke-width="5" fill="none"/>`);
      }
      p.push(`<path d="${bodice}" fill="${fill}" stroke="${colD}" stroke-width="2"/>`);
      if (st === 'apron' || st === 'maid') {
        p.push(`<path d="M${cx - ww * 0.8},${B.waist} L${cx + ww * 0.8},${B.waist} L${cx + fw * 0.62},${hem - 6} Q${cx},${hem + 2} ${cx - fw * 0.62},${hem - 6}Z" fill="#fff" stroke="#e6d8d8" stroke-width="2"/>`);
        p.push(`<rect x="${cx - ww * 0.62}" y="${top + 16}" width="${ww * 1.24}" height="${B.waist - top - 16}" rx="4" fill="#fff" stroke="#e6d8d8" stroke-width="2"/>`);
        p.push(`<rect x="${cx - ww - 4}" y="${B.waist - 5}" width="${ww * 2 + 8}" height="8" rx="4" fill="${st === 'maid' ? '#fff' : acc === '#ffffff' ? '#f4b6b6' : acc}"/>`);
        if (st === 'maid') p.push(`<path d="M${cx - 18},${top + 2} Q${cx},${top + 18} ${cx + 18},${top + 2}" fill="#fff" stroke="#ddd" stroke-width="2"/><circle cx="${cx}" cy="${top + 16}" r="5" fill="#d4495b"/>`);
      }
      if (st === 'train') {
        p.push(`<rect x="${cx - ww - 3}" y="${B.waist - 6}" width="${ww * 2 + 6}" height="10" rx="3" fill="${acc}"/><rect x="${cx - 7}" y="${B.waist - 7}" width="14" height="12" rx="2" fill="#e8c547"/>`);
      }
      if (st === 'armor') {
        p.push(`<path d="M${cx - sw + 6},${top + 12} Q${cx},${top + 2} ${cx + sw - 6},${top + 12} L${cx + ww - 2},${B.waist - 4} Q${cx},${B.waist + 6} ${cx - ww + 2},${B.waist - 4}Z" fill="#cdd8e4" stroke="#7d8ea3" stroke-width="2"/>`);
        p.push(`<path d="M${cx},${top + 20} l-8,14 l8,12 l8,-12z" fill="${acc}"/>`);
        p.push(`<ellipse cx="${cx - sw}" cy="${top + 10}" rx="15" ry="10" fill="#cdd8e4" stroke="#7d8ea3" stroke-width="2"/><ellipse cx="${cx + sw}" cy="${top + 10}" rx="15" ry="10" fill="#cdd8e4" stroke="#7d8ea3" stroke-width="2"/>`);
      }
      if (st === 'dress' || st === 'smock') {
        p.push(`<path d="M${cx - 18},${top + 2} Q${cx},${top + 20} ${cx + 18},${top + 2}" fill="${acc}" stroke="${shade(acc, -0.1)}" stroke-width="2"/>`);
        if (st === 'dress') p.push(`<circle cx="${cx}" cy="${top + 22}" r="5" fill="${acc === '#ffffff' ? '#f07fb4' : acc}"/>`);
        else ['#e86a92', '#4fa3e0', '#f2c94c', '#3fb8a5'].forEach((c, i) => p.push(`<circle cx="${cx - 30 + i * 19}" cy="${B.waist + 20 + (i % 2) * 22}" r="${4 + i % 2 * 2}" fill="${c}" opacity=".8"/>`));
      }
      if (st === 'sailor') {
        p.push(`<path d="M${cx - sw},${top + 6} L${cx},${top + 44} L${cx + sw},${top + 6} L${cx + sw - 6},${top + 26} L${cx},${top + 58} L${cx - sw + 6},${top + 26}Z" fill="${acc}" stroke="${shade(acc, -0.2)}" stroke-width="2"/>`);
        p.push(`<path d="M${cx},${top + 50} l-14,-8 l0,16z M${cx},${top + 50} l14,-8 l0,16z" fill="#e2414f"/><circle cx="${cx}" cy="${top + 50}" r="5" fill="#c23040"/>`);
        p.push(`<path d="M${cx - fw + 6},${hem - 4} Q${cx},${hem + 8} ${cx + fw - 6},${hem - 4}" stroke="${acc}" stroke-width="4" fill="none"/>`);
      }
      if (st === 'tutu') p.push(`<path d="M${cx - 16},${top + 4} Q${cx},${top + 16} ${cx + 16},${top + 4}" stroke="${acc}" stroke-width="4" fill="none"/>`);
    }

    // 팔
    const sl = [cx - sw + 2, top + 10], sr = [cx + sw - 2, top + 10];
    const hl = [cx - sw - 16, B.waist + 14], hrr = [cx + sw + 16, B.waist + 14];
    const sleeve = st === 'armor' ? '#cdd8e4' : st === 'tutu' ? SKIN : col;
    for (const [s0, h] of [[sl, hl], [sr, hrr]]) {
      const ex = (s0[0] + h[0]) / 2 + (h[0] < cx ? -6 : 6), ey = (s0[1] + h[1]) / 2;
      p.push(`<path d="M${s0[0]},${s0[1]} Q${ex},${ey} ${h[0]},${h[1] - 10}" stroke="${shade(sleeve, -0.25)}" stroke-width="19" fill="none" stroke-linecap="round"/>`);
      p.push(`<path d="M${s0[0]},${s0[1]} Q${ex},${ey} ${h[0]},${h[1] - 10}" stroke="${sleeve}" stroke-width="15" fill="none" stroke-linecap="round"/>`);
      p.push(`<circle cx="${h[0]}" cy="${h[1]}" r="9" fill="${SKIN}" stroke="${SKIN_LINE}" stroke-width="1.5"/>`);
    }
    if (st === 'gown' || st === 'dress' || st === 'maid' || st === 'sailor') {
      const pc = st === 'maid' ? '#fff' : shade(col, 0.15);
      p.push(`<ellipse cx="${sl[0] - 2}" cy="${sl[1] + 4}" rx="14" ry="11" fill="${pc}" stroke="${colD}" stroke-width="1.5"/>`);
      p.push(`<ellipse cx="${sr[0] + 2}" cy="${sr[1] + 4}" rx="14" ry="11" fill="${pc}" stroke="${colD}" stroke-width="1.5"/>`);
    }

    // 목
    p.push(`<rect x="${cx - 9}" y="${hy + hr * 0.8}" width="18" height="${B.neck - hy - hr * 0.8 + 10}" fill="${SKIN}"/>`);
    const W = o.wear && ACC_ITEM[o.wear];
    if (W && W.slot === 'neck') p.push(neckAcc(o.wear, cx, B.neck + 4));

    // 들고 있는 것
    if (o.acc === 'sword') p.push(`<g transform="translate(${hrr[0]},${hrr[1]}) rotate(-20)"><rect x="-3" y="-110" width="7" height="104" rx="2" fill="#e6edf5" stroke="#8a9bb0"/><rect x="-14" y="-8" width="29" height="7" rx="3" fill="#c79a2c"/><rect x="-3" y="-1" width="7" height="22" rx="2" fill="#6b4226"/></g>`);
    if (o.acc === 'violin') p.push(`<g transform="translate(${hl[0] + 10},${hl[1] - 30}) rotate(-35)"><ellipse cx="0" cy="0" rx="16" ry="24" fill="#a85a2a"/><rect x="-3" y="-60" width="6" height="40" fill="#5a2f14"/></g>`);
    if (o.acc === 'coin') p.push(`<circle cx="${hrr[0]}" cy="${hrr[1] - 4}" r="12" fill="#f2c94c" stroke="#b8902a" stroke-width="3"/>`);
    if (o.acc === 'book' || o.acc === 'glasses') p.push(`<g transform="translate(${hrr[0] - 4},${hrr[1] - 8}) rotate(-12)"><rect x="-16" y="-20" width="32" height="40" rx="3" fill="#8a3b52"/><rect x="-12" y="-16" width="24" height="32" fill="#f6ead2"/></g>`);
    if (o.acc === 'brush') p.push(`<g transform="translate(${hrr[0]},${hrr[1]}) rotate(25)"><rect x="-2" y="-50" width="5" height="50" fill="#a8743a"/><path d="M-3,-50 q3,-14 6,0z" fill="#e86a92"/></g>`);
    if (o.acc === 'bread') p.push(`<ellipse cx="${hrr[0]}" cy="${hrr[1] - 6}" rx="20" ry="11" fill="#d9993c" stroke="#a8702a" stroke-width="2"/>`);
    if (o.acc === 'staff') p.push(`<g transform="translate(${hrr[0]},${hrr[1]})"><rect x="-3" y="-150" width="6" height="190" rx="3" fill="#7a4a2a"/><circle cx="0" cy="-156" r="12" fill="#b7a8ff" stroke="#fff" stroke-width="3"/></g>`);
    if (o.acc === 'mic') p.push(`<g transform="translate(${hl[0] + 6},${hl[1] - 14})"><circle r="9" fill="#555"/><rect x="-3" y="6" width="6" height="22" fill="#333"/></g>`);
    if (o.acc === 'locket') p.push(neckAcc('locket', cx, B.neck + 4));

    // 얼굴
    p.push(`<ellipse cx="${cx}" cy="${hy}" rx="${hr * 0.93}" ry="${hr}" fill="${SKIN}" stroke="${SKIN_LINE}" stroke-width="2"/>`);
    p.push(face(cx, hy, hr, expr, stage));

    // 앞머리
    const b = hy - hr * 0.08;
    const bangs = hs === 'bob'
      ? `M${cx - hr - 5},${hy + hr * 0.35} Q${cx - hr - 8},${hy - hr * 1.18} ${cx},${hy - hr * 1.15} Q${cx + hr + 8},${hy - hr * 1.18} ${cx + hr + 5},${hy + hr * 0.35} Q${cx + hr * 0.7},${b - hr * 0.05} ${cx + hr * 0.3},${b - hr * 0.08} Q${cx},${b - hr * 0.2} ${cx - hr * 0.3},${b - hr * 0.08} Q${cx - hr * 0.7},${b - hr * 0.05} ${cx - hr - 5},${hy + hr * 0.35}Z`
      : `M${cx - hr - 5},${hy + hr * 0.25} Q${cx - hr - 8},${hy - hr * 1.18} ${cx},${hy - hr * 1.15} Q${cx + hr + 8},${hy - hr * 1.18} ${cx + hr + 5},${hy + hr * 0.25} Q${cx + hr * 0.82},${b - hr * 0.1} ${cx + hr * 0.7},${b - hr * 0.3} Q${cx + hr * 0.5},${b} ${cx + hr * 0.38},${b + hr * 0.02} Q${cx + hr * 0.3},${b - hr * 0.25} ${cx + hr * 0.12},${b - hr * 0.35} Q${cx},${b} ${cx - hr * 0.12},${b + hr * 0.04} Q${cx - hr * 0.22},${b - hr * 0.28} ${cx - hr * 0.42},${b - hr * 0.3} Q${cx - hr * 0.55},${b} ${cx - hr * 0.68},${b + hr * 0.02} Q${cx - hr * 0.8},${b - hr * 0.2} ${cx - hr - 5},${hy + hr * 0.25}Z`;
    p.push(`<path d="${bangs}" fill="${hair}" stroke="${hairD}" stroke-width="2" stroke-linejoin="round"/>`);
    p.push(`<path d="M${cx - hr * 0.55},${hy - hr * 0.85} Q${cx - hr * 0.1},${hy - hr * 1.02} ${cx + hr * 0.3},${hy - hr * 0.9}" stroke="rgba(255,255,255,.45)" stroke-width="5" fill="none" stroke-linecap="round"/>`);
    const sideLen = hs === 'bob' ? 0.85 : 1.02;
    p.push(`<path d="M${cx - hr - 4},${hy - hr * 0.2} Q${cx - hr - 2},${hy + hr * 0.7} ${cx - hr * 0.72},${hy + hr * sideLen} Q${cx - hr * 0.86},${hy + hr * 0.3} ${cx - hr * 0.78},${hy - hr * 0.1}Z" fill="${hair}" stroke="${hairD}" stroke-width="1.5"/>`);
    p.push(`<path d="M${cx + hr + 4},${hy - hr * 0.2} Q${cx + hr + 2},${hy + hr * 0.7} ${cx + hr * 0.72},${hy + hr * sideLen} Q${cx + hr * 0.86},${hy + hr * 0.3} ${cx + hr * 0.78},${hy - hr * 0.1}Z" fill="${hair}" stroke="${hairD}" stroke-width="1.5"/>`);

    // 머리 장식: 엔딩 소품 > 액세서리 > 옷 기본 > 나이 기본
    let head = o.acc && o.acc !== 'none' ? o.acc : null;
    if (!head && W && W.slot === 'head') head = o.wear;
    if (!head && st === 'maid') head = 'maidcap';
    if (!head && o.acc !== 'none') head = hs === 'pony' ? 'none' : stage === 0 ? 'ribbon' : stage === 1 ? 'hairpin' : 'none';
    p.push(headAcc(head, cx, hy, hr, of));
    if (expr === 'sick') p.push(`<rect x="${cx - hr * 0.5}" y="${hy - hr * 0.72}" width="${hr}" height="${hr * 0.28}" rx="6" fill="#fff" stroke="#cfd8e0" stroke-width="2"/>`);
    if (expr === 'tired') p.push(`<path d="M${cx + hr * 0.85},${hy - hr * 0.35} q6,10 0,16 q-6,-6 0,-16z" fill="#8fd0ff"/>`);
    if (expr === 'surprise') p.push(`<g stroke="#e0702e" stroke-width="4" stroke-linecap="round"><line x1="${cx + hr * 1.05}" y1="${hy - hr * 0.9}" x2="${cx + hr * 1.25}" y2="${hy - hr * 1.15}"/><line x1="${cx + hr * 1.15}" y1="${hy - hr * 0.7}" x2="${cx + hr * 1.42}" y2="${hy - hr * 0.78}"/></g>`);
    return `<svg viewBox="0 -40 300 460" xmlns="http://www.w3.org/2000/svg"><defs>${defs.join('')}</defs>${p.join('')}</svg>`;
  }

  function rosette(x, y, c) {
    return `<g transform="translate(${x},${y})">${[0, 72, 144, 216, 288].map(a => `<ellipse rx="5" ry="8" transform="rotate(${a}) translate(0,-6)" fill="${c}"/>`).join('')}<circle r="4" fill="#ffd166"/></g>`;
  }

  function backHair(hs, stage, B, cx, hy, hr, hair, hairD) {
    const hw = hr * 1.08 + (stage === 0 ? 2 : 6);
    const cap = `M${cx - hw},${hy} Q${cx - hw - 2},${hy - hr * 1.25} ${cx},${hy - hr * 1.22} Q${cx + hw + 2},${hy - hr * 1.25} ${cx + hw},${hy}`;
    const stroke = `stroke="${hairD}" stroke-width="2"`;
    const out = [];
    if (hs === 'long') {
      const len = [hy + hr * 1.45, B.waist - 10, B.waist + 34][stage];
      out.push(`<path d="${cap} L${cx + hw + (stage ? 8 : 4)},${len} Q${cx + hw * 0.5},${len + 14} ${cx},${len - 4} Q${cx - hw * 0.5},${len + 14} ${cx - hw - (stage ? 8 : 4)},${len}Z" fill="${hair}" ${stroke}/>`);
    } else if (hs === 'bob') {
      const len = hy + hr * 0.98;
      out.push(`<path d="${cap} L${cx + hw + 2},${len} Q${cx},${len + 16} ${cx - hw - 2},${len}Z" fill="${hair}" ${stroke}/>`);
    } else if (hs === 'twin') {
      const len = hy + hr * 0.9;
      out.push(`<path d="${cap} L${cx + hw},${len} Q${cx},${len + 12} ${cx - hw},${len}Z" fill="${hair}" ${stroke}/>`);
      const tl = [96, 140, 175][stage];
      out.push(`<path d="M${cx - hw + 2},${hy - 4} q-30,30 -18,${tl} q8,-30 30,-${tl - 26}z" fill="${hair}" ${stroke}/>`);
      out.push(`<path d="M${cx + hw - 2},${hy - 4} q30,30 18,${tl} q-8,-30 -30,-${tl - 26}z" fill="${hair}" ${stroke}/>`);
    } else { // pony
      const len = hy + hr * 0.95;
      out.push(`<path d="${cap} L${cx + hw},${len} Q${cx},${len + 12} ${cx - hw},${len}Z" fill="${hair}" ${stroke}/>`);
      const tl = [110, 150, 190][stage];
      out.push(`<path d="M${cx + hr * 0.5},${hy - hr * 0.95} q${hr * 1.3},10 ${hr * 0.9},${tl} q-12,-${tl * 0.5} -${hr * 0.75},-${tl - 20}z" fill="${hair}" ${stroke}/>`);
      out.push(`<circle cx="${cx + hr * 0.62}" cy="${hy - hr * 0.88}" r="8" fill="#f05a7e" stroke="#c23b5d" stroke-width="2"/>`);
    }
    return out.join('');
  }

  function face(cx, hy, hr, expr, stage) {
    const p = [];
    const ey = hy + hr * 0.18, ex = hr * 0.38;
    const erx = hr * (0.15 + (2 - stage) * 0.012), ery = hr * (0.21 + (2 - stage) * 0.015);
    const blush = expr === 'sick' ? 'rgba(240,80,90,.55)' : 'rgba(255,130,150,.35)';
    p.push(`<ellipse cx="${cx - hr * 0.58}" cy="${ey + hr * 0.3}" rx="${hr * 0.17}" ry="${hr * 0.09}" fill="${blush}"/><ellipse cx="${cx + hr * 0.58}" cy="${ey + hr * 0.3}" rx="${hr * 0.17}" ry="${hr * 0.09}" fill="${blush}"/>`);
    for (const sgn of [-1, 1]) {
      const x = cx + sgn * ex;
      if (expr === 'happy' || expr === 'cry') {
        if (expr === 'happy') p.push(`<path d="M${x - erx},${ey + 2} Q${x},${ey - ery * 1.1} ${x + erx},${ey + 2}" stroke="${EYE}" stroke-width="4" fill="none" stroke-linecap="round"/>`);
        else {
          p.push(`<path d="M${x - erx},${ey - 3} Q${x},${ey + ery * 0.7} ${x + erx},${ey - 3}" stroke="${EYE}" stroke-width="4" fill="none" stroke-linecap="round"/>`);
          p.push(`<path d="M${x + sgn * erx * 0.4},${ey + 6} q${sgn * 4},14 0,26 q${-sgn * 6},-8 0,-26z" fill="#8fd0ff"/>`);
        }
      } else if (expr === 'tired' || expr === 'sick') {
        p.push(`<path d="M${x - erx},${ey - 1} L${x + erx},${ey - 1}" stroke="${EYE}" stroke-width="3.5" stroke-linecap="round"/>`);
        p.push(`<path d="M${x - erx * 0.85},${ey} Q${x},${ey + ery * 1.1} ${x + erx * 0.85},${ey}Z" fill="${EYE}"/>`);
        p.push(`<path d="M${x - erx * 0.5},${ey + 2} Q${x},${ey + ery * 0.8} ${x + erx * 0.5},${ey + 2}Z" fill="${IRIS}"/>`);
      } else if (expr === 'surprise') {
        p.push(`<ellipse cx="${x}" cy="${ey}" rx="${erx * 1.05}" ry="${ery * 1.1}" fill="#fff" stroke="${EYE}" stroke-width="3"/>`);
        p.push(`<circle cx="${x}" cy="${ey + 2}" r="${erx * 0.45}" fill="${EYE}"/>`);
      } else {
        p.push(`<ellipse cx="${x}" cy="${ey}" rx="${erx}" ry="${ery}" fill="${EYE}"/>`);
        p.push(`<ellipse cx="${x}" cy="${ey + ery * 0.35}" rx="${erx * 0.75}" ry="${ery * 0.5}" fill="${IRIS}"/>`);
        p.push(`<circle cx="${x - erx * 0.35}" cy="${ey - ery * 0.38}" r="${erx * 0.38}" fill="#fff"/><circle cx="${x + erx * 0.35}" cy="${ey + ery * 0.4}" r="${erx * 0.16}" fill="#fff"/>`);
        p.push(`<path d="M${x - erx * 1.25},${ey - ery * 0.75} Q${x},${ey - ery * 1.35} ${x + erx * 1.25},${ey - ery * 0.75}" stroke="${EYE}" stroke-width="3" fill="none" stroke-linecap="round"/>`);

      else if (expr === 'surprise') p.push(`<path d="M${x - erx},${by - 6} Q${x},${by - 12} ${x + erx},${by - 6}" stroke="${EYE}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>`);
      else p.push(`<path d="M${x - erx},${by} Q${x},${by - 4} ${x + erx},${by}" stroke="${EYE}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>`);

    if (expr === 'happy') p.push(`<path d="M${cx - hr * 0.16},${my - 3} Q${cx},${my + hr * 0.22} ${cx + hr * 0.16},${my - 3}Z" fill="#c9455b"/>`);

    else if (expr === 'sick' || expr === 'cry') p.push(`<path d="M${cx - hr * 0.14},${my} q${hr * 0.07},-5 ${hr * 0.14},0 q${hr * 0.07},5 ${hr * 0.14},0" stroke="#b5475a" stroke-width="3" fill="none" stroke-linecap="round"/>`);
    else if (expr === 'tired') p.push(`<ellipse cx="${cx}" cy="${my}" rx="${hr * 0.07}" ry="${hr * 0.05}" fill="#b5475a"/>`);
    else if (expr === 'surprise') p.push(`<ellipse cx="${cx}" cy="${my + 2}" rx="${hr * 0.09}" ry="${hr * 0.12}" fill="#b5475a"/>`);
    else p.push(`<path d="M${cx - hr * 0.12},${my - 2} Q${cx},${my + 7} ${cx + hr * 0.12},${my - 2}" stroke="#b5475a" stroke-width="3" fill="none" stroke-linecap="round"/>`);
    return p.join('');
  }

  function neckAcc(id, cx, y) {

    if (id === 'locket') return `<path d="M${cx - 16},${y - 6} Q${cx},${y + 12} ${cx + 16},${y - 6}" fill="none" stroke="#c9ced8" stroke-width="2"/><ellipse cx="${cx}" cy="${y + 10}" rx="7" ry="9" fill="#dfe4ee" stroke="#9aa3b5" stroke-width="2"/><circle cx="${cx}" cy="${y + 10}" r="2.5" fill="#9aa3b5"/>`;

  function headAcc(acc, cx, hy, hr, of) {

      case 'crown': return `<path d="M${cx - 34},${top + 14} L${cx - 38},${top - 22} L${cx - 18},${top - 4} L${cx},${top - 30} L${cx + 18},${top - 4} L${cx + 38},${top - 22} L${cx + 34},${top + 14}Z" fill="#f2c94c" stroke="#b8902a" stroke-width="3"/><circle cx="${cx}" cy="${top - 2}" r="6" fill="#e24a6a"/>`;

      case 'halo': return `<ellipse cx="${cx}" cy="${top - 18}" rx="40" ry="10" fill="none" stroke="#ffe680" stroke-width="7" opacity=".9"/>`;
      case 'hat': case 'magehat': return `<path d="M${cx - hr * 1.5},${top + 18} Q${cx},${top + 36} ${cx + hr * 1.5},${top + 18} Q${cx},${top + 2} ${cx - hr * 1.5},${top + 18}Z M${cx - hr * 0.8},${top + 14} L${cx + 26},${top - 80} L${cx + hr * 0.8},${top + 14}Z" fill="${acc === 'magehat' ? '#4b3a8c' : of.col}" stroke="${acc === 'magehat' ? '#e8c547' : of.acc}" stroke-width="3"/><circle cx="${cx + 26}" cy="${top - 80}" r="6" fill="#e8c547"/>`;
      case 'witchhat': return `<path d="M${cx - hr * 1.6},${top + 20} Q${cx},${top + 38} ${cx + hr * 1.6},${top + 20} Q${cx},${top + 4} ${cx - hr * 1.6},${top + 20}Z M${cx - hr * 0.8},${top + 16} Q${cx - 6},${top - 60} ${cx + 40},${top - 70} Q${cx + 6},${top - 40} ${cx + hr * 0.8},${top + 16}Z" fill="#2d2340" stroke="#8f5cd6" stroke-width="3"/>`;
      case 'chefhat': return `<rect x="${cx - 32}" y="${top - 10}" width="64" height="22" rx="4" fill="#fff" stroke="#ddd" stroke-width="2"/><circle cx="${cx - 20}" cy="${top - 22}" r="20" fill="#fff" stroke="#ddd" stroke-width="2"/><circle cx="${cx + 20}" cy="${top - 22}" r="20" fill="#fff" stroke="#ddd" stroke-width="2"/><circle cx="${cx}" cy="${top - 34}" r="22" fill="#fff" stroke="#ddd" stroke-width="2"/>`;
      case 'strawhat': return `<ellipse cx="${cx}" cy="${top + 18}" rx="${hr * 1.6}" ry="16" fill="#e9c46a" stroke="#b8902a" stroke-width="2"/><path d="M${cx - hr * 0.85},${top + 16} Q${cx},${top - 40} ${cx + hr * 0.85},${top + 16}Z" fill="#e9c46a" stroke="#b8902a" stroke-width="2"/><rect x="${cx - hr * 0.85}" y="${top + 4}" width="${hr * 1.7}" height="9" fill="#e24a4a"/>`;
      case 'beret': return `<ellipse cx="${cx - 10}" cy="${top + 4}" rx="${hr * 1.05}" ry="22" fill="#c0392b" stroke="#8e2a20" stroke-width="2"/><circle cx="${cx - 10}" cy="${top - 16}" r="5" fill="#8e2a20"/>`;
      case 'veil': return `<path d="M${cx - hr * 0.9},${top + 14} Q${cx},${top - 16} ${cx + hr * 0.9},${top + 14} L${cx + hr * 1.5},${hy + hr * 2.4} L${cx - hr * 1.5},${hy + hr * 2.4}Z" fill="rgba(255,255,255,.55)" stroke="rgba(255,255,255,.9)" stroke-width="2"/>`;
      case 'nunveil': return `<path d="M${cx - hr * 1.1},${hy + hr * 0.2} Q${cx - hr * 1.2},${top - 10} ${cx},${top - 12} Q${cx + hr * 1.2},${top - 10} ${cx + hr * 1.1},${hy + hr * 0.2} L${cx + hr * 1.3},${hy + hr * 2} L${cx - hr * 1.3},${hy + hr * 2}Z" fill="#30324a"/><path d="M${cx - hr * 0.95},${hy - hr * 0.2} Q${cx},${top - 2} ${cx + hr * 0.95},${hy - hr * 0.2}" stroke="#fff" stroke-width="8" fill="none"/>`;
      case 'glasses': return `<g stroke="#5a4a3a" stroke-width="3" fill="rgba(255,255,255,.2)"><circle cx="${cx - hr * 0.38}" cy="${hy + hr * 0.18}" r="${hr * 0.25}"/><circle cx="${cx + hr * 0.38}" cy="${hy + hr * 0.18}" r="${hr * 0.25}"/><line x1="${cx - hr * 0.13}" y1="${hy + hr * 0.16}" x2="${cx + hr * 0.13}" y2="${hy + hr * 0.16}"/></g>`;

  // ---------- 인물 상반신 ----------
  // n: { sex:'m'|'f', age:'kid'|'adult'|'old', hair, hs:'short'|'long'|'bun'|'bald'|'spiky'|'curly'|'messy', cloth, cloth2, beard, mustache, glasses, hat, skin, eye }
  function npc(n) {
    const skin = n.skin || '#ffe0c8', line = shade(skin, -0.18);
    const hair = n.hair || '#5a3a22', hairD = shade(hair, -0.3);
    const cloth = n.cloth || '#7a8aa0', cloth2 = n.cloth2 || '#fff';
    const kid = n.age === 'kid', old = n.age === 'old';
    const hy = kid ? 100 : 92, hr = kid ? 46 : 42;
    const p = [];
    // 어깨
    const sh = kid ? 58 : 70;
    p.push(`<path d="M${100 - sh},200 Q${100 - sh},${hy + 62} 100,${hy + 56} Q${100 + sh},${hy + 62} ${100 + sh},200Z" fill="${cloth}" stroke="${shade(cloth, -0.25)}" stroke-width="2"/>`);
    p.push(`<path d="M${100 - 22},${hy + 54} L100,${hy + 80} L${100 + 22},${hy + 54}" fill="${cloth2}" stroke="${shade(cloth2, -0.15)}" stroke-width="2"/>`);
    if (n.collar === 'priest') p.push(`<rect x="92" y="${hy + 52}" width="16" height="10" fill="#fff"/>`);
    if (n.necklace) p.push(`<path d="M76,${hy + 58} Q100,${hy + 84} 124,${hy + 58}" fill="none" stroke="#fbf6ff" stroke-width="5" stroke-dasharray="1 6" stroke-linecap="round"/>`);
    // 뒷머리
    if (n.hs === 'long' || n.hs === 'curly') {
      const len = hy + (n.hs === 'curly' ? 70 : 90);
      p.push(`<path d="M${100 - hr - 8},${hy} Q${100 - hr - 8},${hy - hr * 1.3} 100,${hy - hr * 1.25} Q${100 + hr + 8},${hy - hr * 1.3} ${100 + hr + 8},${hy} L${100 + hr + 14},${len} Q100,${len + 14} ${100 - hr - 14},${len}Z" fill="${hair}" stroke="${hairD}" stroke-width="2"/>`);
      if (n.hs === 'curly') for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) p.push(`<circle cx="${100 + sx * (hr + 8)}" cy="${hy + 20 + i * 18}" r="12" fill="${hair}" stroke="${hairD}" stroke-width="2"/>`);
    }
    if (n.hs === 'bun') p.push(`<circle cx="100" cy="${hy - hr - 10}" r="20" fill="${hair}" stroke="${hairD}" stroke-width="2"/>`);
    // 목·얼굴
    p.push(`<rect x="90" y="${hy + 30}" width="20" height="28" fill="${skin}"/>`);
    p.push(`<ellipse cx="100" cy="${hy}" rx="${hr * 0.92}" ry="${hr}" fill="${skin}" stroke="${line}" stroke-width="2"/>`);
    // 눈
    const ey = hy + 6, eye = n.eye || '#3a2b3a';
    for (const s of [-1, 1]) {
      const x = 100 + s * hr * 0.38;
      if (old) p.push(`<path d="M${x - 7},${ey} Q${x},${ey - 5} ${x + 7},${ey}" stroke="${eye}" stroke-width="3" fill="none" stroke-linecap="round"/>`);
      else if (n.sex === 'f' || kid) { p.push(`<ellipse cx="${x}" cy="${ey}" rx="${kid ? 6.5 : 6}" ry="${kid ? 9 : 8}" fill="${eye}"/><circle cx="${x - 2}" cy="${ey - 3}" r="2.4" fill="#fff"/>`); if (n.sex === 'f') p.push(`<path d="M${x - 8},${ey - 6} Q${x},${ey - 12} ${x + 8},${ey - 6}" stroke="${eye}" stroke-width="2.5" fill="none"/>`); }
      else p.push(`<ellipse cx="${x}" cy="${ey}" rx="5" ry="6" fill="${eye}"/><circle cx="${x - 1.5}" cy="${ey - 2}" r="1.8" fill="#fff"/>`);
      const bc = n.brow || (old ? '#bbb' : hairD);
      p.push(`<path d="M${x - 8},${ey - 15} Q${x},${ey - 19} ${x + 8},${ey - 15}" stroke="${bc}" stroke-width="${n.sex === 'm' ? 4 : 2.5}" fill="none" stroke-linecap="round"/>`);
    }
    if (n.patch) p.push(`<ellipse cx="${100 + hr * 0.38}" cy="${ey}" rx="10" ry="9" fill="#2a2a2a"/><line x1="${100 - hr * 0.9}" y1="${hy - 18}" x2="${100 + hr * 0.9}" y2="${hy - 4}" stroke="#2a2a2a" stroke-width="3"/>`);
    if (old) p.push(`<path d="M${100 - hr * 0.62},${ey + 14} q6,4 10,0 M${100 + hr * 0.62},${ey + 14} q-6,4 -10,0" stroke="${line}" stroke-width="2" fill="none"/>`);
    p.push(`<ellipse cx="${100 - hr * 0.55}" cy="${ey + 14}" rx="7" ry="4" fill="rgba(255,120,140,${n.sex === 'f' || kid ? 0.35 : 0.15})"/><ellipse cx="${100 + hr * 0.55}" cy="${ey + 14}" rx="7" ry="4" fill="rgba(255,120,140,${n.sex === 'f' || kid ? 0.35 : 0.15})"/>`);
    // 수염 · 입
    if (n.beard) p.push(`<path d="M${100 - hr * 0.8},${hy + 8} Q${100 - hr * 0.7},${hy + hr + 26} 100,${hy + hr + 30} Q${100 + hr * 0.7},${hy + hr + 26} ${100 + hr * 0.8},${hy + 8} Q100,${hy + 34} ${100 - hr * 0.8},${hy + 8}Z" fill="${n.beard}" stroke="${shade(n.beard, -0.2)}" stroke-width="2"/>`);
    if (n.mustache) p.push(`<path d="M100,${hy + 24} q-10,-6 -20,2 q10,4 20,-2z M100,${hy + 24} q10,-6 20,2 q-10,4 -20,-2z" fill="${n.mustache}"/>`);
    if (!n.beard) p.push(`<path d="M92,${hy + 28} Q100,${hy + 34} 108,${hy + 28}" stroke="#a5475a" stroke-width="3" fill="none" stroke-linecap="round"/>`);
    // 앞머리
    if (n.hs !== 'bald') {
      if (n.hs === 'spiky' || n.hs === 'messy') {
        p.push(`<path d="M${100 - hr - 4},${hy + 4} L${100 - hr - 10},${hy - hr * 0.6} L${100 - hr * 0.6},${hy - hr * 1.0} L${100 - hr * 0.5},${hy - hr * 1.35} L${100 - hr * 0.1},${hy - hr * 1.1} L${100 + hr * 0.2},${hy - hr * 1.4} L${100 + hr * 0.45},${hy - hr * 1.05} L${100 + hr * 0.9},${hy - hr * 1.2} L${100 + hr * 0.85},${hy - hr * 0.7} L${100 + hr + 10},${hy - hr * 0.5} L${100 + hr + 4},${hy + 4} Q${100 + hr * 0.6},${hy - hr * 0.5} ${100 + hr * 0.2},${hy - hr * 0.42} L100,${hy - hr * 0.6} L${100 - hr * 0.3},${hy - hr * 0.4} Q${100 - hr * 0.7},${hy - hr * 0.4} ${100 - hr - 4},${hy + 4}Z" fill="${hair}" stroke="${hairD}" stroke-width="2" stroke-linejoin="round"/>`);
      } else {
        const side = n.hs === 'short' ? 0.1 : 0.4;

      }
    } else {
      p.push(`<path d="M${100 - hr - 2},${hy - 2} Q${100 - hr - 4},${hy - 22} ${100 - hr * 0.7},${hy - 26}" stroke="${hair}" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M${100 + hr + 2},${hy - 2} Q${100 + hr + 4},${hy - 22} ${100 + hr * 0.7},${hy - 26}" stroke="${hair}" stroke-width="9" fill="none" stroke-linecap="round"/>`);
      p.push(`<ellipse cx="${100 - 12}" cy="${hy - hr * 0.7}" rx="12" ry="6" fill="rgba(255,255,255,.5)"/>`);
    }
    if (n.glasses) p.push(`<g stroke="#5a4a3a" stroke-width="2.5" fill="rgba(255,255,255,.25)"><circle cx="${100 - hr * 0.38}" cy="${ey}" r="11"/><circle cx="${100 + hr * 0.38}" cy="${ey}" r="11"/><line x1="${100 - hr * 0.38 + 11}" y1="${ey}" x2="${100 + hr * 0.38 - 11}" y2="${ey}"/></g>`);
    // 모자
    const top = hy - hr * 1.1;
    const hats = {
      wizard: `<path d="M${100 - hr * 1.5},${top + 20} Q100,${top + 36} ${100 + hr * 1.5},${top + 20} Q100,${top + 4} ${100 - hr * 1.5},${top + 20}Z M${100 - hr * 0.8},${top + 16} Q94,${top - 60} ${140},${top - 66} Q106,${top - 36} ${100 + hr * 0.8},${top + 16}Z" fill="${n.hatCol || '#4b3a8c'}" stroke="#e8c547" stroke-width="3"/>`,
      tiara: `<path d="M${100 - 30},${top + 16} Q100,${top} ${100 + 30},${top + 16} L${100 + 20},${top + 6} L100,${top - 12} L${100 - 20},${top + 6}Z" fill="#f2c94c" stroke="#b8902a" stroke-width="2"/><circle cx="100" cy="${top + 2}" r="5" fill="#e24a6a"/>`,
      straw: `<ellipse cx="100" cy="${top + 18}" rx="${hr * 1.6}" ry="15" fill="#e9c46a" stroke="#b8902a" stroke-width="2"/><path d="M${100 - hr * 0.85},${top + 16} Q100,${top - 36} ${100 + hr * 0.85},${top + 16}Z" fill="#e9c46a" stroke="#b8902a" stroke-width="2"/>`,
      beret: `<ellipse cx="94" cy="${top + 6}" rx="${hr * 1.05}" ry="18" fill="${n.hatCol || '#2e6b4a'}"/><circle cx="94" cy="${top - 10}" r="4" fill="${shade(n.hatCol || '#2e6b4a', -0.3)}"/>`,
      feather: `<ellipse cx="94" cy="${top + 8}" rx="${hr * 1.1}" ry="15" fill="${n.hatCol || '#2e6b4a'}"/><path d="M${100 + hr * 0.4},${top} q30,-36 56,-40 q-20,28 -50,46z" fill="#e24a4a"/>`,
      scarf: `<path d="M${100 - hr - 6},${hy + 10} Q${100 - hr - 8},${top - 6} 100,${top - 8} Q${100 + hr + 8},${top - 6} ${100 + hr + 6},${hy + 10} Q100,${hy - hr * 0.7} ${100 - hr - 6},${hy + 10}Z" fill="${n.hatCol || '#c0392b'}"/>`,

  // ---------- 방 ----------
  // season: 0 봄 1 여름 2 가을 3 겨울
  function room(season, night) {

  function startNew() {

  // ---------- 프롤로그 ----------
  async function prologue() {
    show('story');
    Sound.setSong('night');

    $('stSkip').style.display = skipFast ? '' : 'none';
    let skipped = false;
    $('stSkip').onclick = e => { e.stopPropagation(); skipped = true; Sound.play('click'); $('story').click(); };

  // ---------- 메인 그리기 ----------
  let girlKey = '', roomKey = '';
  function renderGirl(expr, force) {
    if (!S) return;
    const o = girlOpts(expr);
    const key = JSON.stringify(o);
    if (key !== girlKey || force) { girlKey = key; $('pGirl').innerHTML = Art.girl(o); }
    const rk = season() + '';
    if (rk !== roomKey) { roomKey = rk; $('pRoom').innerHTML = Art.room(season(), false); }
  }
  function bounce() { const g = $('pGirl'); g.classList.remove('bounce'); void g.offsetWidth; g.classList.add('bounce'); }
  function renderHud() {
    if (!S) return;
    $('hDate').textContent = `${Logic.yearNo(S)}년째 ${Logic.calMonth(S) + 1}월 · ${Logic.age(S)}살`;
    $('hGold').textContent = `💰 ${Math.floor(S.gold).toLocaleString()}G`;
    $('pName').textContent = S.name;
    const lastT = S.titles && S.titles.length ? TITLE[S.titles[S.titles.length - 1]] : null;
    $('pTitle').textContent = lastT ? `「${lastT.name}」` : '';
    $('mStress').style.width = S.stress + '%';
    $('mStress').style.background = S.stress >= 80 ? '#d4495b' : S.stress >= 60 ? '#f29e4c' : '#7ac58f';
    $('vStress').textContent = Math.round(S.stress);
    $('mFame').style.width = Math.min(100, S.fame / 3) + '%';
    $('vFame').textContent = Math.floor(S.fame);
    $('pAff').innerHTML = `<b>아빠와의 사이</b><span class="hearts">${hearts(S.aff)}</span>`;
    $('pMisc').textContent = `🏆 우승 ${S.wins.martial + S.wins.beauty + S.wins.cook + S.wins.magic}회 · 어른까지 ${Logic.TOTAL_MONTHS - S.m}개월`;
    $('hDad').classList.toggle('dot', S.talkedM !== S.m);
  }
  function renderStats(hint) {
    $('stats').innerHTML = STATS.map(s => {
      const v = Math.floor(S.st[s.k]);
      const h = hint && hint[s.k];
      const arrow = h ? (h > 0 ? '<span class="arrow up">▲</span>' : '<span class="arrow down">▼</span>') : '<span class="arrow"></span>';
      return `<div class="srow"><b>${s.n}</b>${arrow}<div class="bar"><i style="width:${Math.min(100, v / 8)}%;background:${s.col}"></i></div><span>${v}</span></div>`;
    }).join('');
  }
  function gainText(a) {
    const ks = Object.keys(a.gain);
    const up = ks.filter(k => a.gain[k] > 0).map(k => STAT_NAME[k] + '↑');
    const dn = ks.filter(k => a.gain[k] < 0).map(k => STAT_NAME[k] + '↓');
    if (a.type === 'rest' || a.type === 'travel') return '스트레스↓↓ ' + up.slice(0, 2).join(' ');
    return up.slice(0, 2).concat(dn.slice(0, 1)).join(' ');
  }
  function renderActs() {
    const planned = Logic.schedCost(S);
    $('acts').innerHTML = ACTS.map(a => {
      const st = Logic.actState(S, a, planned);
      let money;
      if (a.type === 'job') money = `<span class="money up">+${Logic.payOf(S, a)}G</span>`;
      else if (a.cost) money = `<span class="money down">-${Logic.costOf(S, a)}G</span>`;
      else money = `<span class="money">무료</span>`;
      const lvn = a.type === 'lesson' || a.type === 'job' ? Logic.lessonLv(S, a.id) : 0;
      const lv = lvn ? `<span class="lv">${'★'.repeat(lvn)}${'☆'.repeat(5 - lvn)}</span>` : '';
      const boost = Logic.gearMult(S, a.id) > 1 ? '<span class="boost">UP</span>' : '';
      const sub = st.ok ? gainText(a) : `🔒 ${st.why}`;
      return `<div class="act ${a.type}${st.ok ? '' : ' dis'}" data-act="${a.id}">${boost}<span class="ic">${a.icon}${lv}</span><span class="tx"><span class="r1">${a.name}${money}</span><small>${sub}</small></span></div>`;
    }).join('');
  }
  function renderSched() {
    const firstEmpty = S.sched.indexOf(null);
    document.querySelectorAll('#sched .slot').forEach((el, i) => {
      const id = S.sched[i];
      el.className = 'slot ' + (id ? 'filled' : 'empty') + (i === firstEmpty ? ' next' : '');
      el.innerHTML = `<span class="when">${SLOT_NAMES[i]}</span>` + (id ? `<span class="ic">${ACT[id].icon}</span><span class="nm">${ACT[id].name}</span>` : `<span class="ic" style="opacity:.25">＋</span><span class="nm">비어 있음</span>`);
    });
    let out = 0, inc = 0;
    for (const id of S.sched) if (id) { const a = ACT[id]; if (a.type === 'job') inc += Logic.payOf(S, a); else out += Logic.costOf(S, a); }
    $('schedSum').innerHTML = `지출 <b class="down">-${out}G</b> · 수입 <b class="up">+${inc}G</b>`;
    $('startBtn').disabled = firstEmpty !== -1;
    $('repeatBtn').disabled = !canRepeat();
  }
  function canRepeat() {
    if (!S.lastSched || S.lastSched.some(x => !x)) return false;
    let cost = 0;
    for (const id of S.lastSched) {
      if (!Logic.actState(S, ACT[id], cost).ok) return false;
      cost += Logic.costOf(S, ACT[id]);
    }
    return true;
  }
  function renderAll() {
    if (!S) return;
    renderHud(); renderStats(); renderActs(); renderSched(); renderGirl();
  }
  function setHudLock(on) { ['hShop', 'hCodex', 'hSet', 'hDad', 'hRufus'].forEach(id => { $(id).disabled = on; }); }

  // 말풍선
  function talk() {
    const a = Logic.age(S), cm = Logic.calMonth(S), st = Logic.stage(S), f = S.flags;
    let pool;
    if (S.stress >= 80) pool = ['너무 힘들어… 좀 쉬고 싶어.', '머리가 핑 돌아…', '쉬게 해 주면 안 돼?'];
    else if (S.stress >= 60) pool = ['요즘 좀 지쳐.', '놀러 가고 싶다~', '휴식이 필요해…'];
    else if (S.gold < 80) pool = ['우리 집… 돈 괜찮아?', '나 아르바이트 할까?'];
    else if (S.m === 0) pool = ['아빠, 오늘부터 잘 부탁해!'];
    else if (S.m >= 90) pool = ['곧 열여덟 살이야… 두근두근.', '어른이 되면 뭘 하고 있을까?', '아빠, 나 떠나도 울지 마. …농담이야.'];
    else if (cm === 8) pool = ['다음 달은 가을 축제야! 준비해야지.', '축제에 무슨 대회 나갈까?'];
    else {
      pool = st === 0 ? ['이번 달엔 뭐 해?', '아빠, 오늘 저녁 뭐야?', '나 키 컸지?', '헤헤, 열심히 할게!', '루퍼스 아저씨 쿠키 또 먹고 싶다.']
        : st === 1 ? ['이번 달도 힘내 볼게!', '친구들이랑 놀고 싶은데…', '거울 보는 게 좋아졌어.', '나 많이 컸지?']
        : ['벌써 이렇게 컸네.', '아빠, 늘 고마워.', '꿈에 한 걸음씩!', '오늘은 뭘 배울까?'];
      if (f.cat) pool.push('별똥이가 또 내 이불에서 자.');
      if (f.haru >= 4) pool.push('하루는 왕도에서 잘 지내려나.');
      else if (f.haru) pool.push('하루가 또 장난쳤어!');
      if (f.liana) pool.push('리아나는 요즘 뭐 하고 있을까?');
      if (f.bianca >= 3) pool.push('비앙카가 이번엔 먼저 인사했어. 신기하지?');
      if (f.locket >= 2) pool.push('…목걸이 속 문장, 가끔 꺼내 봐.');
      if (cm === 11 || cm === 0) pool.push('추워! 아빠 손 시렵지?');
      if (cm === 6) pool.push('더워~ 냇가 가고 싶다!');
    }
    $('bubble').textContent = pickOne(pool);
    void a;
  }

  // ---------- 스케줄 고르기 ----------
  function onActClick(id) {
    if (busy || !S) return;
    const a = ACT[id];
    const i = S.sched.indexOf(null);
    if (i === -1) { toast('칸이 다 찼어. 바꿀 칸을 먼저 눌러서 비워 줘'); Sound.play('cancel'); return; }
    const st = Logic.actState(S, a, Logic.schedCost(S));
    if (!st.ok) { toast(`${a.name}: ${st.why}`); Sound.play('cancel'); return; }
    S.sched[i] = id;
    Sound.play('select');
    renderActs(); renderSched();
  }
  function onSlotClick(i) {
    if (busy || !S || !S.sched[i]) return;
    S.sched[i] = null;
    Sound.play('cancel');
    renderActs(); renderSched();
  }
  function onRepeat() {
    if (busy || !S || !canRepeat()) return;
    S.sched = S.lastSched.slice();
    Sound.play('select');
    renderActs(); renderSched();
  }

  // ---------- 한 달 진행 ----------
  async function runMonth() {
    if (busy || !S || S.sched.includes(null)) return;
    busy = true; setHudLock(true);
    Sound.play('start');
    $('bubble').textContent = '';
    $('run').classList.add('on');
    $('rSummary').classList.remove('on');
    for (let i = 0; i < 3; i++) await playSlot(i);
    skip = false;
    const end = Logic.monthEnd(S);
    await showSummary(end);
    $('run').classList.remove('on');
    busy = false; setHudLock(false);
    save();
    renderAll();
    titleCheck();
    await beginMonth();
  }

  function npcSay(id, text) {
    const b = $('rNpc');
    b.innerHTML = `<b class="jua">${NPCS[id].name}</b> ${text}`;
    b.classList.add('on');
  }
  async function playSlot(i) {
    skip = false;
    const id = S.sched[i], a = ACT[id];
    $('rSteps').innerHTML = [0, 1, 2].map(k => `<i class="${k < i ? 'done' : k === i ? 'on' : ''}"></i>`).join('');
    $('rTitle').textContent = `${SLOT_NAMES[i]} · ${a.icon} ${a.name}${a.type === 'lesson' ? ' 수업' : ''}`;
    $('rNpc').classList.remove('on');
    $('rDays').innerHTML = '<i></i>'.repeat(10);
    $('rLine').textContent = '';
    $('rResult').innerHTML = '';
    const res = Logic.runSlot(S, id);
    const npcSvg = a.npc ? Art.npc(npcLook(a.npc)) : null;
    const workExpr = res.kind === 'sick' ? 'sick' : a.type === 'rest' || a.type === 'travel' ? 'happy' : 'normal';
    $('rScene').innerHTML = Scenes.activity(a, season(), girlOpts(workExpr), npcSvg);
    renderGirl(workExpr);
    const days = $('rDays').children;
    await sleep(300);
    for (let d = 0; d < 10; d++) {
      days[d].classList.add('on');
      Sound.play('tick');
      if (d === 2) $('rLine').textContent = res.line;
      await sleep(300);
    }
    const kindTxt = { great: '대성공!', ok: '성공!', fail: '실패…', sick: '아파서 쉬었어…' }[res.kind];
    const ch = res.changes.slice();
    if (res.gold) ch.push({ k: 'gold', d: res.gold });
    if (res.stress) ch.push({ k: 'stress', d: res.stress });
    $('rResult').innerHTML = `<span class="kind ${res.kind} jua">${kindTxt}</span>${chipsHTML(ch)}`;
    Sound.play({ great: 'great', ok: 'good', fail: 'fail', sick: 'sick' }[res.kind]);
    if (res.gold > 0) setTimeout(() => Sound.play('coin'), 250);
    const after = res.kind === 'great' || res.kind === 'ok' ? 'happy' : res.kind === 'sick' ? 'sick' : 'sulky';
    renderGirl(after);
    if (res.kind !== 'fail') bounce();
    renderHud();
    // 선생님·주인 한마디
    let said = false;
    if (res.lvUp && a.type === 'lesson' && TEACH_LINES[a.npc]) {
      npcSay(a.npc, F(TEACH_LINES[a.npc][res.lvUp - 2]));
      setTimeout(() => Sound.play('lvup'), 400);
      toast(`${a.name} 수업이 ${res.lvUp}단계가 됐어! 효과가 더 커져 (수업료도 조금 올라)`);
      said = true;
    } else if (res.lvUp && a.type === 'job' && BOSS_LINES[a.npc]) {
      npcSay(a.npc, F(res.lvUp >= 3 ? BOSS_LINES[a.npc].loyal : pickOne(BOSS_LINES[a.npc].great)));
      setTimeout(() => Sound.play('lvup'), 400);
      toast(`${a.name} 숙련도가 ${res.lvUp}단계가 됐어! 효과와 보수가 커져`);
      said = true;
    } else if (a.type === 'job' && BOSS_LINES[a.npc] && res.kind === 'great') {
      npcSay(a.npc, F(pickOne(BOSS_LINES[a.npc].great))); said = true;
    }
    skip = false;
    await sleep(said ? 2400 : 1500);
  }

  async function showSummary(end) {
    const box = $('rSummary');
    const ch = [{ k: 'gold', d: end.stipend }].concat(end.bonus);
    box.innerHTML = `<div class="jua" style="font-size:40px">한 달 끝!</div><div>나라에서 주는 양육 지원금이 들어왔어.</div>${chipsHTML(ch)}`;
    box.classList.add('on');
    Sound.play('coin');
    renderAll();
    await sleep(1200);
    box.classList.remove('on');
  }

  // ---------- 달 시작 ----------
  async function beginMonth() {
    if (!S) return;
    if (S.runaway) await runawayScene();
    if (S.m >= Logic.TOTAL_MONTHS) return startEnding();
    Sound.setSong(['spring', 'summer', 'home', 'winter'][season()]);
    renderAll();
    if (Logic.isBirthday(S) && S.bdayDone !== S.m) { await birthday(); S.bdayDone = S.m; save(); }
    if (Logic.isFestival(S) && S.festDone !== S.m) { await festival(); S.festDone = S.m; save(); }
    if (S.evDone !== S.m) {
      const ev = Logic.pickEvent(S);
      S.evDone = S.m;
      if (ev) await doEvent(ev);
      save();
    }
    closeModal();
    renderAll();
    titleCheck();
    talk();
    if (Logic.mood(S) === 'tired') bounce();
  }

        ['me', a === 13 ? '아빠, 나 키가 이만큼 컸어! 옷이 다 작아졌어.' : '아빠, 왜 그렇게 쳐다봐? …나 이상해?', 'happy'],

  async function doEvent(ev) {
    Sound.play('event');
    const head = { icon: ev.icon, title: ev.title };
    const lines = (ev.lines || []).map(l => [l[0], F(l[1]), l[2]]);
    const choices = ev.choices.map(c => ({ t: F(c.t), off: c.need && S.gold < c.need }));
    if (choices.every(c => c.off)) choices[choices.length - 1].off = false;
    const i = await playLines(head, lines, choices);
    const r = Logic.chooseEvent(S, ev, i);
    Sound.play('select');
    renderAll();
    let after = r.after.map(l => [l[0], F(l[1]), l[2]]);
    if (!after.length) after = [['n', F(`${ev.choices[i].t}.`)]];

  function chanceOf(id) {
    const me = Logic.contestPower(S, id);
    const fin = Logic.rivalBase(Logic.yearNo(S)) * 1.08;
    const r = me / fin;
    if (r >= 1.12) return ['우승 가능성 높음!', '#2f9e6e'];
    if (r >= 0.97) return ['해 볼 만해', '#3a7bd5'];
    if (r >= 0.8) return ['조금 어려워', '#e0702e'];
    return ['아직 무리야', '#d4495b'];
  }

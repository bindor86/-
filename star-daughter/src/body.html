<div id="stage">
  <div id="stars"></div>

  <!-- 타이틀 -->
  <section id="title" class="screen">
    <div class="logo jua"><h1>별빛 딸 키우기</h1><p>열 살 딸을 열여덟 살까지, 8년의 이야기</p></div>
    <div class="menu">
      <button class="btn pri jua" id="tContinue">이어하기</button>
      <button class="btn jua" id="tNew">새로 키우기</button>
      <button class="btn jua" id="tCodex">엔딩 도감</button>
      <button class="btn jua" id="tSettings">설정</button>
      <button class="btn jua" id="tFull">전체 화면</button>
    </div>
    <div class="info" id="tInfo"></div>
    <div class="pic" id="tPic"></div>
  </section>

  <!-- 새로 시작 -->
  <section id="setup" class="screen">
    <div class="panel">
      <h2 class="jua">딸을 맞이하자</h2>
      <div class="lbl">이름 (키보드로 입력하거나 아래에서 골라 줘)</div>
      <input id="nameInput" maxlength="6" autocomplete="off" spellcheck="false">
      <div class="chips" id="nameChips" style="margin-top:12px"></div>
      <div class="lbl">머리 색</div>
      <div class="chips" id="hairChips"></div>
      <div class="lbl">머리 모양</div>
      <div class="chips" id="styleChips"></div>
      <div class="bonus" id="ngBonus"></div>
      <div class="go">
        <button class="btn pri jua" id="setupGo" style="font-size:30px">키우기 시작!</button>
        <button class="btn jua" id="setupBack">돌아가기</button>
      </div>
    </div>
    <div class="preview"><div id="setupRoom"></div><div id="setupGirl"></div></div>
  </section>

  <!-- 메인 -->
  <section id="main" class="screen">
    <div id="hud">
      <div class="date jua" id="hDate"></div>
      <div class="gold jua" id="hGold"></div>
      <div class="sp"></div>
      <button class="btn jua" id="hDad">💕 딸과 시간</button>
      <button class="btn jua" id="hRufus">💬 루퍼스</button>
      <button class="btn jua" id="hShop">👗 옷가게</button>
      <button class="btn jua" id="hCodex">📖 도감</button>
      <button class="btn jua" id="hSet">⚙️ 설정</button>
      <button class="btn jua" id="hFull">⛶</button>
    </div>
    <div class="card" id="pcard">
      <div class="room" id="pRoom"></div>
      <div class="girl" id="pGirl"></div>
      <div id="bubble"></div>
      <div id="pinfo">
        <div><span class="nm jua" id="pName"></span><span class="ttl" id="pTitle"></span></div>
        <div class="meter"><b>스트레스</b><div class="bar"><i id="mStress"></i></div><span id="vStress"></span></div>
        <div class="meter"><b>평판</b><div class="bar"><i id="mFame" style="background:#e0a92e"></i></div><span id="vFame"></span></div>
        <div class="meter aff" id="pAff"></div>
        <div class="meter" style="font-size:18px;color:#6b5d7a" id="pMisc"></div>
      </div>
    </div>
    <div class="card" id="stats"></div>
    <div class="card" id="acts"></div>
    <div class="card" id="sched">
      <div class="slot" data-slot="0"></div>
      <div class="slot" data-slot="1"></div>
      <div class="slot" data-slot="2"></div>
      <div class="side">
        <div class="sum" id="schedSum"></div>
        <button class="btn small jua" id="repeatBtn">↺ 지난달과 같이</button>
        <button class="btn pri jua" id="startBtn">이번 달 시작 ▶</button>
      </div>
    </div>
    <div id="run">
      <div class="head jua"><span id="rTitle"></span><div class="steps" id="rSteps"><i></i><i></i><i></i></div></div>
      <div class="scene" id="rScene"></div>
      <div class="nbub" id="rNpc"></div>
      <div class="days" id="rDays"></div>
      <div class="line" id="rLine"></div>
      <div class="result" id="rResult"></div>
      <div class="summary" id="rSummary"></div>
      <div class="skip">클릭하면 빨리 넘어가</div>
    </div>
  </section>

  <!-- 프롤로그 -->
  <section id="story" class="screen">
    <div class="stbg" id="stBg"></div>
    <button class="btn small jua stskip" id="stSkip">건너뛰기 ▶▶</button>
    <div class="stbox" id="stBox">
      <div class="stpic" id="stPic"></div>
      <div class="sttext"><div class="dname jua" id="stName"></div><p id="stText"></p><div class="stnext">클릭 ▶</div></div>
    </div>
  </section>

  <!-- 엔딩 -->
  <section id="ending" class="screen">
    <div class="bgc" id="eBg"></div>
    <div class="intro jua" id="eIntro"></div>
    <div class="pic" id="ePic"></div>
    <div class="txt" id="eTxt"></div>
  </section>

  <div id="modalWrap"><div class="modal" id="modal"></div></div>
  <div id="toast"></div>
</div>
